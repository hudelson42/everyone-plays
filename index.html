<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0E1513">
<title>Everyone Plays — playing time tracker</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Everyone Plays">
<meta name="description" content="Substitution and playing-time tracker for youth soccer coaches. Works offline, keeps everything on your phone.">
<style>
:root{
  --bg:#0E1513; --panel:#16201D; --panel2:#1D2926; --line:#2C3B36;
  --turf:#12392A; --turf-line:rgba(233,245,239,.22);
  --ink:#E9F5EF; --ink-dim:#8FA69E;
  --on:#3ECF8E; --next:#F2B33D; --alert:#E4572E; --gk:#7FB2FF; --warn:#F2B33D;
  --r:10px; --tap:44px;
  --fs-clock:clamp(44px,15vw,64px);
}
body.sun{
  --bg:#FFFFFF; --panel:#FFFFFF; --panel2:#F0F0F0; --line:#000000;
  --turf:#FFFFFF; --turf-line:#000000;
  --ink:#000000; --ink-dim:#333333;
  --on:#006B3C; --next:#9A5B00; --alert:#B3130B; --gk:#0B3EA8; --warn:#C67A00;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:15px; line-height:1.35;
  touch-action:manipulation; user-select:none; -webkit-user-select:none;
  overscroll-behavior:none;
}
body.sun{font-weight:600}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:none;padding:0;cursor:pointer}

/* ---------- shell ---------- */
#app{display:flex;flex-direction:column;height:100%;padding-top:env(safe-area-inset-top)}
#topbar{
  display:flex;align-items:center;gap:10px;padding:8px 12px;
  border-bottom:1px solid var(--line);background:var(--panel);flex:none;
}
#tb-clock{font-size:26px;font-weight:700;letter-spacing:-.5px}
#tb-period{font-size:11px;color:var(--ink-dim);margin-top:-2px}
#tb-shift{margin-left:auto;text-align:right}
#tb-shiftval{font-size:22px;font-weight:700}
#tb-shiftlab{font-size:10px;color:var(--ink-dim);letter-spacing:.04em}
#tb-go{
  width:56px;height:40px;border-radius:var(--r);border:1px solid var(--line);
  background:var(--panel2);font-size:12px;font-weight:700;
}
#tb-go.running{background:var(--on);color:#06150E;border-color:var(--on)}
body.sun #tb-go.running{color:#fff}
.over #tb-shiftval{color:var(--alert)}

/* Advanced mode visibilities */
body:not(.adv) .adv-only { display: none !important; }

main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px 20px}
.view{display:none}
.view.active{display:block}

nav#tabs{
  display:flex;flex:none;border-top:1px solid var(--line);background:var(--panel);
  padding-bottom:env(safe-area-inset-bottom);
}
nav#tabs button{
  flex:1;min-width:0;min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;color:var(--ink-dim);font-size:10px;letter-spacing:.01em;padding:6px 2px;
}
nav#tabs button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav#tabs button.active{color:var(--ink)}
nav#tabs button.active svg{stroke:var(--on)}

/* ---------- generic ---------- */
h2{font-size:17px;margin:0 0 8px;font-weight:700;letter-spacing:-.2px}
h3{font-size:12px;margin:18px 0 6px;color:var(--ink-dim);font-weight:600}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:12px}
.btn{
  min-height:var(--tap);padding:0 14px;border-radius:var(--r);border:1px solid var(--line);
  background:var(--panel2);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;
}
.btn.wide{width:100%}
.btn.primary{background:var(--on);color:#06150E;border-color:var(--on)}
body.sun .btn.primary{color:#fff}
.btn.warn{background:var(--alert);color:#fff;border-color:var(--alert)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.38}
.row{display:flex;gap:8px}
.row>*{flex:1}
.muted{color:var(--ink-dim);font-size:12px}
label.field{display:block;margin-bottom:10px}
label.field span{display:block;font-size:11px;color:var(--ink-dim);margin-bottom:4px}
input[type=text],input[type=number],select,textarea{
  width:100%;min-height:var(--tap);padding:8px 10px;border-radius:var(--r);
  border:1px solid var(--line);background:var(--panel2);
}
textarea{min-height:110px;font-family:ui-monospace,Menlo,monospace;font-size:11px;resize:vertical}
.seg{display:flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{flex:1;min-height:var(--tap);font-weight:600;font-size:13px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--on);color:#06150E}
body.sun .seg button.on{color:#fff;background:var(--on)}
.ev-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 10px; }
.ev-grid .btn { font-size: 11px; padding: 0; min-height: 38px; }

/* ---------- pitch ---------- */
#pitch{
  background:var(--turf);border:1px solid var(--line);border-radius:var(--r);
  padding:10px 8px;margin-bottom:12px;position:relative;overflow:hidden;
}
#pitch::before{
  content:"";position:absolute;left:8px;right:8px;top:50%;height:1px;background:var(--turf-line);
}
#pitch::after{
  content:"";position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;
  border:1px solid var(--turf-line);border-radius:50%;
}
.band{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:6px 0}
.bandlab{position:relative;z-index:1;font-size:10px;color:var(--ink-dim);text-align:center;margin-top:2px}
body.sun .bandlab{color:#000}

#pitch{--cw:98px;--avs:52px}
.chip{
  width:74px;min-height:74px;border-radius:var(--r);border:1px solid var(--line);
  background:var(--panel);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:2px;padding:5px 3px;position:relative;
}
.band .chip{width:var(--cw);min-height:calc(var(--cw) + 12px);gap:3px}
.band .chip .av,.band .chip .avn{
  width:var(--avs);height:var(--avs);font-size:calc(var(--avs) * .42)
}
.band .chip .nm{max-width:calc(var(--cw) - 8px);font-size:12px}
.band .chip .tm{font-size:11px}
#ghost{position:fixed;z-index:120;pointer-events:none;transform:translate(-50%,-50%) scale(1.06);
  opacity:.96;box-shadow:0 10px 26px rgba(0,0,0,.55);border-color:var(--next)}
.chip.dragging{opacity:.3}
.droptarget{outline:3px dashed var(--next);outline-offset:2px}
#benchzone.droptarget{outline:3px dashed var(--alert);border-radius:var(--r)}
body.nodrag main{overflow:hidden}
.postog{display:flex;gap:6px;margin:2px 0 10px}
.postog button{
  flex:1;min-height:var(--tap);border:1px solid var(--line);border-radius:var(--r);
  background:var(--panel2);font-size:12px;font-weight:700;color:var(--ink-dim)
}
.postog button.on{background:var(--on);color:#06150E;border-color:var(--on)}
body.sun .postog button.on{color:#fff}
.addrow{display:flex;gap:8px;margin-bottom:12px}
.addrow input.n{flex:3;min-width:0} .addrow input.j{flex:1;min-width:60px} .addrow button{flex:none;width:76px}
.prow{cursor:pointer}
.pedit{border:1px solid var(--line);border-top:none;border-radius:0 0 var(--r) var(--r);
  background:var(--panel);padding:12px;margin-top:-9px}
.prow.open{border-radius:var(--r) var(--r) 0 0}
.av{width:34px;height:34px;border-radius:50%;object-fit:cover;display:block;border:1px solid var(--line)}
.avn{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#06150E}
body.sun .avn{color:#fff;border:1px solid #000}
.chip .av{width:30px;height:30px;border-radius:50%;object-fit:cover;display:block;border:1px solid var(--line)}
.chip .avn{
  width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;color:#06150E;
}
body.sun .chip .avn{color:#fff;border:1px solid #000}
.chip .nm{font-size:11px;font-weight:600;max-width:68px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .tm{font-size:10px;color:var(--ink-dim)}
.chip .pc{font-size:9px;font-weight:700;letter-spacing:.04em;color:var(--ink-dim);line-height:1}
body.sun .chip .pc{color:#000}
.chip.sel{outline:3px solid var(--next);outline-offset:-1px}
.chip.empty{border-style:dashed;color:var(--ink-dim);font-size:11px;justify-content:center}
.chip.gkslot{border-color:var(--gk)}
.chip.next{border-color:var(--next);box-shadow:inset 0 0 0 1px var(--next)}
.chip.stale{border-color:var(--warn);box-shadow:inset 0 0 0 1px var(--warn)}
.chip.sinbin{border-color:var(--alert);box-shadow:inset 0 0 0 2px var(--alert)}
.chip{padding-top:11px}
.chip .flag{position:absolute;top:2px;left:0;right:0;text-align:center;font-size:9px;letter-spacing:.03em;color:var(--next);font-weight:700}

#benchzone,#poolzone{min-height:96px;padding-bottom:8px}
#poolzone.droptarget{outline:3px dashed var(--alert);border-radius:var(--r)}
#bench{display:flex;flex-wrap:wrap;gap:6px}
.hint{font-size:12px;color:var(--ink-dim);margin:8px 0}
.upnext{display:flex;align-items:center;gap:9px;padding:8px 10px;margin-bottom:10px;
  border:1px solid var(--next);border-radius:var(--r);background:var(--panel);overflow:hidden}
.uplab{font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--next);flex:none;
  text-transform:uppercase;line-height:1.1;max-width:42px}
.uppl{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:600;white-space:nowrap;min-width:0}
.uppl .av,.uppl .avn{width:26px;height:26px;font-size:11px;flex:none}
.startrow{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.4}
.startrow div b{color:var(--on)}
.startrow>b:first-child{flex:none;width:24px;height:24px;border-radius:50%;background:var(--on);color:#06150E;
  display:flex;align-items:center;justify-content:center;font-size:13px}
body.sun .startrow>b:first-child{color:#fff}
.badges{font-size:11px;font-weight:700;letter-spacing:.02em}
.cirow{display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;margin-bottom:6px;
  border:1px solid var(--line);border-radius:var(--r);background:var(--panel2);min-height:var(--tap);opacity:.45}
.cirow.on{opacity:1;border-color:var(--on)}
.cirow .nm{flex:1;text-align:left;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cirow .tag{font-size:11px;font-weight:700;color:var(--ink-dim)}
.cirow.on .tag{color:var(--on)}
.lulist button{display:flex;align-items:center;gap:10px;width:100%;padding:10px;margin-bottom:6px;
  border:1px solid var(--line);border-radius:var(--r);background:var(--panel2);min-height:var(--tap);text-align:left}
.lulist b{flex:1;font-size:14px}
.teambar{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;margin-bottom:10px;min-height:var(--tap);
  border:1px solid var(--line);border-radius:var(--r);background:var(--panel);text-align:left;font:inherit;color:inherit}
.teambar b{flex:1;min-width:0;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.teambar .muted{flex:none}
.monthlab{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-dim);margin:14px 2px 6px}
.gamerow{display:flex;align-items:center;gap:10px;width:100%;padding:10px;margin-bottom:6px;min-height:var(--tap);
  border:1px solid var(--line);border-radius:var(--r);background:var(--panel);text-align:left;font:inherit;color:inherit}
.gamerow .t{flex:none;min-width:84px;font-size:13px;font-weight:700}
.gamerow .s{flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
tr.low td:last-child{color:var(--warn);font-weight:700}
#topbar.paused #tb-go{background:var(--warn);color:#06150E;border-color:var(--warn);animation:nudge 1.2s ease-in-out infinite}
@keyframes nudge{50%{transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){#topbar.paused #tb-go{animation:none}}
.helpq{font-size:15px;font-weight:700;margin:16px 0 5px}
.helpq:first-child{margin-top:0}
.helpa{font-size:14px;line-height:1.45;color:var(--ink-dim)}
.helpa b{color:var(--ink)}
.selbar{
  position:sticky;bottom:0;background:var(--panel);border:1px solid var(--next);
  border-radius:var(--r);padding:10px;margin-top:10px;font-size:13px;
}

/* ---------- grid ---------- */
table.grid{width:100%;border-collapse:collapse;table-layout:fixed}
table.grid th{
  font-size:10px;color:var(--ink-dim);font-weight:600;padding:6px 2px;text-align:right;
  border-bottom:1px solid var(--line);
}
table.grid th:first-child{text-align:left}
table.grid th.sortable{cursor:pointer}
table.grid th.sorted{color:var(--ink);text-decoration:underline}
table.grid td{padding:0;border-bottom:1px solid var(--line);height:50px;font-size:12px}
table.grid td.t{text-align:right;padding-right:2px}
table.grid td.t button,table.grid td.t .tot{
  width:100%;height:50px;display:flex;flex-direction:column;align-items:flex-end;
  justify-content:center;gap:0;padding-right:2px;font-size:12px
}
table.grid td.t .tot .mono{font-weight:700}
.cnt{font-size:9px;color:var(--ink-dim);line-height:1.1}
.chip.holding{opacity:.5;border-style:dashed}
.chip.onnow{border-color:var(--on)}
nav#tabs button{font-size:9px}
.pname{display:flex;align-items:center;gap:6px;min-width:0}
.pname b{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pnum{
  width:22px;height:22px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:700;color:#06150E
}
body.sun .pnum{color:#fff;border:1px solid #000}
tr.onfield .pname b{color:var(--on)}
tr.off{opacity:.45}
col.c1{width:auto} col.ct{width:44px} col.ctot{width:50px}

/* ---------- roster / history ---------- */
.plist{display:flex;flex-direction:column;gap:8px}
.prow{
  display:flex;align-items:center;gap:10px;padding:8px;border:1px solid var(--line);
  border-radius:var(--r);background:var(--panel)
}
.prow .av,.prow .avn{width:38px;height:38px;border-radius:50%;flex:none}
.prow .avn{display:flex;align-items:center;justify-content:center;font-weight:700;color:#06150E;font-size:14px}
body.sun .prow .avn{color:#fff;border:1px solid #000}
.prow .meta{flex:1;min-width:0}
.prow .meta b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status{font-size:11px;color:var(--ink-dim)}
.status.out{color:var(--alert)}
.iconbtn{width:var(--tap);height:var(--tap);border-radius:var(--r);border:1px solid var(--line);background:var(--panel2);font-size:13px;flex:none}

.hgroup{border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px;background:var(--panel);overflow:hidden}
.hhead{display:flex;align-items:center;gap:8px;padding:10px;width:100%;text-align:left}
.hhead .t{font-size:13px;font-weight:700;min-width:52px}
.hhead .s{font-size:12px;color:var(--ink-dim);flex:1}
.hbody{padding:0 10px 10px;font-size:12px}
.hbody div{padding:3px 0;border-top:1px solid var(--line)}
.lrow{display:flex;gap:10px;padding:5px 0;border-top:1px solid var(--line)}
.lpos{flex:none;width:62px;font-size:11px;color:var(--ink-dim);padding-top:1px}
.lwho{flex:1;font-size:13px}
.lmid{font-size:11px;color:var(--ink-dim);padding-top:5px;border-top:1px solid var(--line)}
.in{color:var(--on)} .out2{color:var(--alert)}

/* ---------- modal / flash ---------- */
#flash{position:fixed;inset:0;pointer-events:none;opacity:0;z-index:90;background:var(--alert)}
#flash.go{animation:fl 1.4s ease-out 2}
@keyframes fl{0%{opacity:0}12%{opacity:.75}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){#flash.go{animation:fl 1.4s steps(2) 1}}
#modalwrap{position:fixed;inset:0;z-index:100;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.6)}
#modalwrap.show{display:flex}
#modal{
  width:100%;max-width:560px;background:var(--panel);border:1px solid var(--line);
  border-radius:14px 14px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom));
  max-height:88vh;overflow-y:auto
}
#modal h2{margin-bottom:10px}
#modalbody{margin-bottom:12px;font-size:14px}
.stage{font-size:13px;padding:6px 0;border-top:1px solid var(--line)}
.toast{
  position:fixed;left:50%;bottom:76px;transform:translateX(-50%);z-index:95;
  background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);
  padding:10px 14px;font-size:13px;max-width:88vw
}
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <button id="tb-go" class="mono">START</button>
    <div>
      <div id="tb-clock" class="mono">00:00</div>
      <div id="tb-period">Period 1</div>
    </div>
    <div id="tb-score" class="adv-only" style="flex:1; text-align:center; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer;">
       <div style="font-weight:900; font-size:18px; letter-spacing:1px;" class="mono"><span id="sc-us">0</span>-<span id="sc-them">0</span></div>
       <div style="font-size:9px; color:var(--ink-dim); margin-top:-2px;">US - THEM</div>
    </div>
    <div id="tb-shift">
      <div id="tb-shiftval" class="mono">0:00</div>
      <div id="tb-shiftlab">shift left</div>
    </div>
  </header>

  <main>
    <section id="v-field" class="view active"></section>
    <section id="v-next" class="view"></section>
    <section id="v-clock" class="view"></section>
    <section id="v-times" class="view"></section>
    <section id="v-log" class="view"></section>
    <section id="v-roster" class="view"></section>
    <section id="v-help" class="view"></section>
    <section id="v-setup" class="view"></section>
  </main>

  <nav id="tabs"></nav>
</div>
<div id="flash"></div>
<div id="modalwrap"><div id="modal">
  <h2 id="modaltitle"></h2>
  <div id="modalbody"></div>
  <div class="row">
    <button class="btn ghost" id="modalcancel">Cancel</button>
    <button class="btn primary" id="modalok">OK</button>
  </div>
</div></div>

<script>
"use strict";
/* ============================================================
   Everyone Plays — soccer substitution & shift tracker
   ============================================================ */

const BANDS = ["GK","DEF","MID","FWD"];
const BANDNAME = {GK:"Goalie",DEF:"Defense",MID:"Midfield",FWD:"Forward"};

const FORMATIONS = {
  4:[{d:2,m:0,f:2,gk:false},{d:1,m:2,f:1,gk:false},{d:2,m:0,f:1,gk:true},{d:1,m:1,f:1,gk:true}],
  5:[{d:2,m:0,f:2,gk:true},{d:2,m:1,f:1,gk:true},{d:1,m:2,f:1,gk:true},{d:2,m:1,f:2,gk:false}],
  6:[{d:3,m:0,f:2,gk:true},{d:2,m:0,f:3,gk:true},{d:2,m:2,f:1,gk:true},{d:2,m:1,f:2,gk:true},{d:1,m:3,f:1,gk:true}],
  7:[{d:3,m:0,f:3,gk:true},{d:2,m:3,f:1,gk:true},{d:3,m:2,f:1,gk:true},{d:2,m:2,f:2,gk:true},{d:3,m:1,f:2,gk:true}],
  8:[{d:4,m:0,f:3,gk:true},{d:3,m:0,f:4,gk:true},{d:3,m:3,f:1,gk:true},{d:2,m:3,f:2,gk:true},{d:3,m:2,f:2,gk:true}],
  9:[{d:4,m:0,f:4,gk:true},{d:3,m:2,f:3,gk:true},{d:3,m:3,f:2,gk:true},{d:4,m:3,f:1,gk:true},{d:2,m:4,f:2,gk:true}],
  10:[{d:5,m:0,f:4,gk:true},{d:4,m:0,f:5,gk:true},{d:4,m:3,f:2,gk:true},{d:3,m:4,f:2,gk:true},{d:4,m:4,f:1,gk:true}],
  11:[{d:5,m:0,f:5,gk:true},{d:4,m:4,f:2,gk:true},{d:4,m:3,f:3,gk:true},{d:4,m:5,f:1,gk:true},{d:3,m:5,f:2,gk:true},{d:5,m:3,f:2,gk:true}]
};
function formName(f){ return f.d+"-"+f.m+"-"+f.f+"-"+(f.gk?1:0); }

/* Specific positions inside each band, left to right as drawn on the Field tab (attack at
   the top). The code — LD, SW, ST — is what goes into the event log, so where a player
   stood survives formation changes and shows up in History. Eligibility stays by band. */
const POSDEF = {
  GK:  {C:["GK","Goalie"]},
  DEF: {L:["LD","Left D"],    LC:["LCD","Left center D"],   C:["SW","Sweeper"],    RC:["RCD","Right center D"],   R:["RD","Right D"]},
  MID: {L:["LM","Left mid"],  LC:["LCM","Left center mid"], C:["CM","Center mid"], RC:["RCM","Right center mid"], R:["RM","Right mid"]},
  FWD: {L:["LW","Left wing"], LC:["LS","Left striker"],     C:["ST","Striker"],    RC:["RS","Right striker"],     R:["RW","Right wing"]}
};
const SIDES = {1:["C"], 2:["L","R"], 3:["L","C","R"], 4:["L","LC","RC","R"], 5:["L","LC","C","RC","R"]};
const POSNAME = {}, POSORDER = [];
BANDS.forEach(b => ["L","LC","C","RC","R"].forEach(s => { const d = POSDEF[b][s]; if(d){ POSNAME[d[0]] = d[1]; POSORDER.push(d[0]); } }));
function posCodes(band, n){
  /* two forwards are a strike partnership, not two wingers */
  const sides = band === "GK" ? (n ? ["C"] : []) : (band === "FWD" && n === 2) ? ["LC","RC"] : (SIDES[n] || []);
  const out = sides.map(s => POSDEF[band][s][0]);
  while(out.length < n) out.push(band + (out.length + 1));
  return out;
}
function posName(code){ return !code ? "" : POSNAME[code] || (BANDNAME[code.replace(/\d+$/,"")] || code) + " " + code.replace(/^\D+/,""); }
function slotPos(band, i){ return posCodes(band, slotsFor(band))[i] || null; }

/* Storage keys predate the rename from Sideline to Everyone Plays. Never rename them — every
   existing roster, game and team would silently disappear. */
const KEY = "sideline-tracker-v1";     /* the first team's data, where the app has always kept it */
const INDEX_KEY = "sideline-teams-v1";
/* sun mode, sound and vibration belong to the phone and the coach, not to a team */
const SHARED = ["sun","sound","vibrate","dragBuzz"];
let TEAMS = freshTeams();               /* {v, active, list:[{id, name, key, players, bytes}], shared} */
let storageMode = "memory";
const memStore = {};                    /* last resort, so switching teams still works when storage is blocked */
const Store = {
  async get(k){
    if(window.storage && window.storage.get){
      try{ const r = await window.storage.get(k); storageMode="artifact"; return r && r.value ? r.value : null; }
      catch(e){ storageMode="artifact"; return null; }
    }
    try{ const s = localStorage.getItem(k); storageMode="local"; return s; }
    catch(e){ storageMode="memory"; return memStore[k] || null; }
  },
  async set(k, s){
    memStore[k] = s;
    if(window.storage && window.storage.set){
      try{ await window.storage.set(k, s); storageMode="artifact"; return; }catch(e){}
    }
    try{ localStorage.setItem(k, s); storageMode="local"; }catch(e){ storageMode="memory"; }
  },
  async remove(k){
    delete memStore[k];
    if(window.storage && window.storage.delete){ try{ await window.storage.delete(k); }catch(e){} }
    try{ localStorage.removeItem(k); }catch(e){}
  },
  /* saves the open team, and the index with its player count and size */
  async save(obj){
    const t = activeTeam(), s = JSON.stringify(obj);
    t.players = obj.roster.length; t.bytes = s.length;
    SHARED.forEach(k => { if(obj.settings[k] !== undefined) TEAMS.shared[k] = obj.settings[k]; });
    await this.set(t.key, s); await this.set(INDEX_KEY, JSON.stringify(TEAMS));
  }
};

/* ---------------- state ---------------- */
const DEFAULTS = {
  v:1, roster:[],
  settings:{
    advanced:false, teamSize:7, formationIdx:0, periods:2, periodLen:25, shiftLen:5,
    minStint:90, staleWarn:10, sinBinMins:5, ycSinBin:false, maxSwitch:null /* no limit */, rotate:true, freshPositions:true,
    confirmChanges:true, autoPlan:true, warnLead:30, sound:false, vibrate:false, dragBuzz:true, sun:false,
    seasonBalance:false, goalieRotation:false, pauseReminder:true
  },
  game:newGame(), archive:[], lineups:[]
};
function newGame(){
  return { id:uid(), log:[], seq:0, shift:1, period:1, running:false, startedAt:null, base:0,
           priorTotal:0, periodOver:false, shiftStart:0, warned:false, alerted:false, adj:{}, next:null,
           date:null, opponent:"", present:null, pausedAt:null, nagged:false };
}
/* Turn whatever came out of storage or a backup into a complete state object: settings added
   since it was saved get their defaults, and the phone-level settings come from the index. */
function hydrate(saved){
  const s = Object.assign(JSON.parse(JSON.stringify(DEFAULTS)), saved || {});
  s.settings = Object.assign({}, DEFAULTS.settings, (saved && saved.settings) || {}, TEAMS.shared);
  s.game = Object.assign(newGame(), (saved && saved.game) || {}); s.game.adj = s.game.adj || {};
  if(!Array.isArray(s.roster)) s.roster = [];
  s.roster.forEach(p => { if(!p.elig) p.elig = newElig(); });
  if(!s.lineups) s.lineups = []; if(!s.archive) s.archive = [];
  s.archive = s.archive.map(a => upgradeGame(a, s.roster)).filter(Boolean);
  if(!s.game.shift) s.game.shift = 1; s.game.log.forEach(e => { if(!e.sh) e.sh = 1; if(!e.eid) e.eid = uid(); });
  if(s.game.running){ s.game.base = Math.min(s.game.base, s.settings.periodLen*60); s.game.running = false; s.game.startedAt = null; s.game.pausedAt = Date.now(); }
  return s;
}
let S = JSON.parse(JSON.stringify(DEFAULTS));

let saveTimer=null;
function save(){ clearTimeout(saveTimer); saveTimer=setTimeout(()=>Store.save(S),400); }

/* ---------------- teams ---------------- */
/* Each team is a whole S — roster, settings, game, archive, lineups — under its own storage
   key, so nothing outside this section needs to know teams exist. */
function freshTeams(){ return {v:1, active:"t1", list:[{id:"t1", name:"My team", key:KEY, players:0, bytes:0}], shared:{}}; }
function activeTeam(){ return TEAMS.list.find(t => t.id === TEAMS.active) || TEAMS.list[0]; }
function newTeamId(){ return "t"+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function saveIndex(){ return Store.set(INDEX_KEY, JSON.stringify(TEAMS)); }
async function readTeam(t){
  try{ const raw = await Store.get(t.key), o = raw ? JSON.parse(raw) : null; return o && o.roster ? o : null; }
  catch(e){ return null; }
}
async function initTeams(){
  let idx = null;
  try{ const raw = await Store.get(INDEX_KEY); idx = raw ? JSON.parse(raw) : null; }catch(e){ idx = null; }
  TEAMS = (idx && idx.list && idx.list.length) ? Object.assign({v:1, shared:{}}, idx) : freshTeams();
  TEAMS.active = activeTeam().id;
  const saved = await readTeam(activeTeam());
  /* first run since teams arrived: the old save is already "My team", and its phone-level
     settings become the shared ones */
  if(!idx && saved && saved.settings) SHARED.forEach(k => { if(saved.settings[k] !== undefined) TEAMS.shared[k] = saved.settings[k]; });
  S = hydrate(saved);
}
function resetView(){
  selected = null; nextSel = null; openPlayer = null; openShifts = {}; checkIn = null; _binWatch = {};
  document.body.classList.toggle("sun", !!S.settings.sun); document.body.classList.toggle("adv", !!S.settings.advanced);
}
/* Two clocks can't run at once — the clock only moves on the screen you're looking at —
   so leaving a team banks its time and stops it. */
function pauseClock(){ if(S.game.running){ S.game.base = periodElapsed(); S.game.running = false; S.game.startedAt = null; S.game.pausedAt = Date.now(); wake(false); } }
async function openTeam(id, msg){
  pauseClock(); clearTimeout(saveTimer); await Store.save(S);
  TEAMS.active = id;
  S = hydrate(await readTeam(activeTeam()));
  await saveIndex();
  resetView(); invalidate(); render(); toast(msg || "Switched to "+activeTeam().name);
}
function switchTeam(id, msg){
  if(id === TEAMS.active || !TEAMS.list.some(t => t.id === id)) return Promise.resolve();
  if(!S.game.running) return openTeam(id, msg);
  modal("Switch teams?", '<div style="font-size:15px">The clock is running for <b>'+esc(activeTeam().name)+'</b>. Switching pauses it, and minutes stop until you come back and start it again.</div>',
    "Pause and switch", ()=>{ openTeam(id, msg); });
  return Promise.resolve();
}
async function addTeam(name, data){
  const id = newTeamId(), t = {id, name:String(name||"").trim().slice(0,40) || "Team "+(TEAMS.list.length+1), key:"sideline-team-"+id, players:0, bytes:0};
  TEAMS.list.push(t);
  if(data){ const s = JSON.stringify(hydrate(data)); t.players = data.roster.length; t.bytes = s.length; await Store.set(t.key, s); }
  await saveIndex();
  await switchTeam(id, data ? "Added as a new team: "+t.name : "Added "+t.name);
}
function renameTeam(id, name){
  const t = TEAMS.list.find(x => x.id === id); if(!t) return;
  t.name = String(name).trim().slice(0,40) || t.name; saveIndex(); render(); toast("Renamed to "+t.name);
}
async function deleteTeam(id){
  const t = TEAMS.list.find(x => x.id === id);
  if(!t || TEAMS.list.length < 2) return;
  if(id === TEAMS.active){
    pauseClock(); clearTimeout(saveTimer);   /* don't write back the team being deleted */
    TEAMS.active = TEAMS.list.find(x => x.id !== id).id;
    S = hydrate(await readTeam(activeTeam()));
    resetView();
  }
  TEAMS.list = TEAMS.list.filter(x => x.id !== id);
  await Store.remove(t.key); await saveIndex();
  invalidate(); render(); toast("Deleted "+t.name);
}
async function eraseAllTeams(){
  pauseClock(); clearTimeout(saveTimer);
  for(const t of TEAMS.list) await Store.remove(t.key);
  await Store.remove(INDEX_KEY);
  TEAMS = freshTeams(); S = hydrate(null);
  resetView(); invalidate(); render(); toast("Erased");
}
/* one file with every team — the open one from memory, the rest from storage */
async function buildBackup(){
  const teams = [];
  for(const t of TEAMS.list) teams.push({name:t.name, data: t.id === TEAMS.active ? S : await readTeam(t)});
  return JSON.stringify({sideline:"backup", v:2, at:Date.now(), active:TEAMS.list.indexOf(activeTeam()), shared:TEAMS.shared, teams});
}
async function restoreTeams(o){
  pauseClock(); clearTimeout(saveTimer);
  for(const t of TEAMS.list) await Store.remove(t.key);
  TEAMS = {v:1, active:"t1", list:[], shared:Object.assign({}, o.shared || {})};
  for(let i=0;i<o.teams.length;i++){
    const src = o.teams[i] || {}, id = i === 0 ? "t1" : newTeamId();
    const t = {id, name:String(src.name || "Team "+(i+1)).slice(0,40), key: i === 0 ? KEY : "sideline-team-"+id};
    const data = hydrate(src.data && src.data.roster ? src.data : null), s = JSON.stringify(data);
    t.players = data.roster.length; t.bytes = s.length;
    TEAMS.list.push(t); await Store.set(t.key, s);
  }
  TEAMS.active = (TEAMS.list[o.active] || TEAMS.list[0]).id;
  await saveIndex();
  S = hydrate(await readTeam(activeTeam()));
  resetView(); invalidate(); render(); toast("Loaded "+TEAMS.list.length+(TEAMS.list.length === 1 ? " team" : " teams"));
}
function teamBar(id, always){
  if(!always && TEAMS.list.length < 2) return "";
  return '<button class="teambar" id="'+id+'"><span class="muted">Team</span><b>'+esc(activeTeam().name)+'</b>'+

}
function openTeams(){
  const body = '<div class="lulist">'+TEAMS.list.map(t => {
      const cur = t.id === TEAMS.active, n = cur ? S.roster.length : (t.players || 0);

    }).join("")+'</div>'+

  document.querySelectorAll("#modalbody [data-team]").forEach(el => el.addEventListener("click", ()=>{

/* ---------------- clock ---------------- */
function periodElapsed(){
  const g=S.game;
  let e = g.base + (g.running ? (Date.now()-g.startedAt)/1000 : 0);
  return Math.min(e, S.settings.periodLen*60);
}
function gameElapsed(){ return S.game.priorTotal + periodElapsed(); }
function periodRemaining(){ return Math.max(0, S.settings.periodLen*60 - periodElapsed()); }
function shiftRemaining(){ return S.settings.shiftLen*60 - (gameElapsed() - S.game.shiftStart); }
function fmt(sec){ sec = Math.max(0, Math.floor(sec)); return Math.floor(sec/60) + ":" + String(sec%60).padStart(2,"0"); }
function fmt2(sec){ sec = Math.max(0, Math.floor(sec)); return String(Math.floor(sec/60)).padStart(2,"0") + ":" + String(sec%60).padStart(2,"0"); }
function mins(sec){ return (Math.max(0,sec)/60).toFixed(1); }

/* ---------------- derived time & stats ---------------- */
function computeMatchScore(){
  let us = 0, them = 0, usShots = 0, usSOG = 0, themShots = 0, themSOG = 0;
  for(const e of S.game.log){
    if(e.type === "GOAL"){ us++; usSOG++; usShots++; }
    if(e.type === "SOG"){ usSOG++; usShots++; }
    if(e.type === "SHOT"){ usShots++; }
    if(e.type === "OPP_GOAL"){ them++; themSOG++; themShots++; }
    if(e.type === "OPP_SOG"){ themSOG++; themShots++; }
    if(e.type === "OPP_SHOT"){ themShots++; }
  }
  return {us, them, usShots, usSOG, themShots, themSOG};
}

/* compute() replays the whole log, and the render path asks for it dozens of times.
   Cache it against everything that can change the answer: the log, the roster, manual
   adjustments, and the clock (bucketed, so live minutes still tick). */
let _stCache = null, _stKey = "", _stGen = 0;
function invalidate(){ _stGen++; _stCache = null; }
function computeKey(){
  const adj = S.game.adj || {};
  let a = 0; for(const k in adj) for(const b in adj[k]) a += adj[k][b];
  return _stGen+"|"+S.game.log.length+"|"+S.roster.length+"|"+Math.floor(gameElapsed()*5)+"|"+a;
}
function compute(){
  const k = computeKey();
  if(_stCache && _stKey === k) return _stCache;
  _stCache = _compute(); _stKey = k; return _stCache;
}
function _compute(){
  const now = gameElapsed();
  const st = {};
  S.roster.forEach(p => st[p.id] = {GK:0,DEF:0,MID:0,FWD:0,total:0,onBand:null,onPos:null,onSince:null,lastOff:null,
                                    n:{GK:0,DEF:0,MID:0,FWD:0}, nTotal:0, pos:{}, np:{},
                                    goals:0, assists:0, saves:0, ga:0, yellows:0, reds:0, sinBinEnd:0, shots:0, sog:0});
  const open = {};
  const close = (pid,gt) => {
    const o = open[pid]; if(!o) return;
    if(st[pid]) {
      const d = Math.max(0, gt-o.start);
      st[pid][o.band] += d; if(o.pos) st[pid].pos[o.pos] = (st[pid].pos[o.pos]||0) + d;
      st[pid].lastOff = gt;
    }
    delete open[pid];
  };
  /* moving along the back line is a new position, but not a new trip into defense */
  const enter = (pid, band, pos, was) => {
    if(!st[pid]) return;
    if(!was || was.band !== band){ st[pid].n[band]++; st[pid].nTotal++; }
    if(pos && (!was || was.pos !== pos)) st[pid].np[pos] = (st[pid].np[pos]||0) + 1;
  };
  
  for(const e of S.game.log){
    if(e.type==="ON"){ close(e.playerId, e.gt); open[e.playerId] = {band:e.band, pos:e.pos||null, start:e.gt}; enter(e.playerId, e.band, e.pos, null); }
    else if(e.type==="OFF"){ close(e.playerId, e.gt); }
    else if(e.type==="MOVE"){ const was = open[e.playerId]; close(e.playerId, e.gt); open[e.playerId] = {band:e.band, pos:e.pos||null, start:e.gt}; enter(e.playerId, e.band, e.pos, was); }
    else if(e.type==="GOAL" && st[e.playerId]){ st[e.playerId].goals++; st[e.playerId].sog++; st[e.playerId].shots++; }
    else if(e.type==="SOG" && st[e.playerId]){ st[e.playerId].sog++; st[e.playerId].shots++; }
    else if(e.type==="SHOT" && st[e.playerId]){ st[e.playerId].shots++; }
    else if(e.type==="ASSIST" && st[e.playerId]) st[e.playerId].assists++;
    else if(e.type==="SAVE" && st[e.playerId]) st[e.playerId].saves++;
    else if(e.type==="YELLOW" && st[e.playerId]){ st[e.playerId].yellows++; st[e.playerId].sinBinEnd = e.gt + ((S.settings.sinBinMins||5)*60); }
    else if(e.type==="RED" && st[e.playerId]) st[e.playerId].reds++;
    else if(e.type==="GA" && st[e.playerId]) st[e.playerId].ga++;
  }
  for(const pid in open){
    const o = open[pid]; if(!st[pid]) continue;
    const d = Math.max(0, now-o.start);
    st[pid][o.band] += d; if(o.pos) st[pid].pos[o.pos] = (st[pid].pos[o.pos]||0) + d;
    st[pid].onBand = o.band; st[pid].onPos = o.pos; st[pid].onSince = o.start; st[pid].lastOff = null;
  }
  const adj = S.game.adj||{};
  for(const pid in adj){ if(!st[pid]) continue; for(const b of BANDS) st[pid][b] += (adj[pid][b]||0); }
  for(const pid in st){ const r=st[pid]; r.total = r.GK+r.DEF+r.MID+r.FWD; }
  return st;
}

/* Reads the per-game summaries, not the logs — older games' logs are trimmed, and reading
   them used to throw once a team had more than three past games. */
function computeSeasonStats(pid){
  const r = aggregate(seasonGames()).by[pid] || {}, z = k => r[k] || 0;
  return {goals:z("goals"), assists:z("assists"), saves:z("saves"), ga:z("ga"), yellows:z("yellows"), reds:z("reds"), shots:z("shots"), sog:z("sog")};
}

function isSinBin(pid){
  if(!S.settings.ycSinBin) return false;
  const p = byId(pid);
  if(!p || p.avail !== "available") return false;
  const r = compute()[pid];
  return !!r && r.sinBinEnd > gameElapsed();
}
function isRedCarded(pid){ const r = compute()[pid]; return !!r && r.reds > 0; }
function isStale(pid){
  if(!S.settings.advanced) return false;
  const p = byId(pid);
  if(!p || p.avail !== "available") return false;
  const r = compute()[pid];
  if(!r || r.onBand || r.reds > 0 || (S.settings.ycSinBin && r.sinBinEnd > gameElapsed())) return false;
  return (gameElapsed() - (r.lastOff !== null ? r.lastOff : 0)) >= (S.settings.staleWarn || 10) * 60;
}
function formation(){
  const list = FORMATIONS[S.settings.teamSize] || FORMATIONS[7];
  return list[Math.min(S.settings.formationIdx || 0, list.length-1)];
}
function slotsFor(band){ const f = formation(); return band==="GK" ? (f.gk?1:0) : band==="DEF" ? f.d : band==="MID" ? f.m : f.f; }
function available(p){ return p.avail === "available" && !isSinBin(p.id) && !isRedCarded(p.id); }
function eligible(p, band){ return !p || !p.elig || p.elig[band] !== false; }
function eligList(p){ return BANDS.filter(b => eligible(p,b)); }
function newElig(){ return {GK:true,DEF:true,MID:true,FWD:true}; }

/* Who is standing in which slot, band by band. Position comes from the log. Anyone without
   one (a game logged before positions existed), or whose position this formation doesn't
   have, takes the first open slot in their band; anyone past the band's size is extra. */
function fieldLayout(st){
  st = st || compute();
  const slots = {}, extra = {}, loose = [];
  BANDS.forEach(b => { slots[b] = posCodes(b, slotsFor(b)).map(() => null); extra[b] = []; });
  S.roster.forEach(p => {
    const r = st[p.id]; if(!r || !r.onBand) return;
    const i = r.onPos ? posCodes(r.onBand, slotsFor(r.onBand)).indexOf(r.onPos) : -1;
    if(i >= 0 && !slots[r.onBand][i]) slots[r.onBand][i] = p.id; else loose.push(p.id);
  });
  loose.forEach(id => { const b = st[id].onBand, i = slots[b].indexOf(null); if(i >= 0) slots[b][i] = id; else extra[b].push(id); });
  return {slots, extra};
}
function whereOn(pid, lay){
  lay = lay || fieldLayout();
  for(const b of BANDS){
    const i = lay.slots[b].indexOf(pid);
    if(i >= 0) return {band:b, i, code:slotPos(b, i)};
    if(lay.extra[b].indexOf(pid) >= 0) return {band:b, i:-1, code:null};
  }
  return null;
}
function whereName(w){ return w ? posName(w.code) || BANDNAME[w.band] : ""; }

/* ---------------- events ---------------- */
function push(events, note){
  invalidate();
  const g = S.game; g.seq++; const gid = g.seq, t = Date.now(), gt = gameElapsed(), sh = g.shift;
  events.forEach(e => g.log.push(Object.assign({eid:uid(), g:gid, t, gt, sh, period:g.period}, e)));
  if(note) g.log.push({eid:uid(), g:gid, t, gt, sh, period:g.period, type:"NOTE", note});
  save();
}
function undoLast(){
  const log = S.game.log; if(!log.length){ toast("Nothing to undo"); return; }
  const gid = log[log.length-1].g;
  while(log.length && log[log.length-1].g === gid) log.pop();
  invalidate(); save(); render(); toast("Undone");
}
function beginNewShift(){
  /* don't burn a shift number on a shift that never recorded anything — it leaves
     gaps in the history that read like lost data */
  const cur = S.game.shift;
  if(S.game.log.some(e => (e.sh||1) === cur)) S.game.shift++;
  resetShiftClock(); S.game.next = null; S.game.planCleared = false;
}
function resetShiftClock(){ S.game.shiftStart = gameElapsed(); S.game.warned = false; S.game.alerted = false; }

/* ---------------- the next shift ---------------- */
/* The coach shouldn't have to remember to plan. Whenever there's a live lineup and
   no plan yet, quietly build one so the buzzer is always one tap from acted on. */
function maybeAutoPlan(){
  if(!S.settings.autoPlan || S.game.planCleared) return;
  if(!S.game.log.length || nextCount()) return;
  const st = compute();
  if(!S.roster.some(p => st[p.id].onBand)) return;
  autoFillNext();
}
/* ---------------- saved lineups ---------------- */
/* slots are saved by index, with gaps, so each player comes back in the same position */
function currentArrangement(){
  const lay = fieldLayout(), out = {};
  let any = false;
  BANDS.forEach(b => {
    out[b] = lay.slots[b].slice();
    if(out[b].some(Boolean)) any = true;
  });
  if(!any){ /* nothing on the field — fall back to whatever is planned */
    const n = ensureNext(); let planned = false;
    BANDS.forEach(b => { out[b] = n[b].slice(); if(out[b].some(Boolean)) planned = true; });
    if(!planned) return null;
  }
  return out;
}
function saveLineup(name){
  const arr = currentArrangement();
  if(!arr){ toast("Put a lineup on the field or in the plan first"); return false; }
  S.lineups.unshift({id:uid(), name:name, at:Date.now(), size:S.settings.teamSize,
                     form:S.settings.formationIdx, slots:arr});
  S.lineups = S.lineups.slice(0,12);
  save(); return true;
}
/* Loading writes into the plan rather than the field, so you always get to look
   at it before it goes on — and missing players simply leave a gap. */
function loadLineup(id){
  const L = S.lineups.find(x => x.id === id); if(!L) return;
  if(L.size !== S.settings.teamSize || L.form !== S.settings.formationIdx){
    S.settings.teamSize = L.size; S.settings.formationIdx = L.form;
  }
  S.game.next = null; S.game.planCleared = false;
  const n = ensureNext();
  let placed = 0, skipped = 0;
  BANDS.forEach(b => {
    (L.slots[b] || []).forEach((pid, idx) => {
      if(!pid) return;
      const p = byId(pid);
      if(!p || !available(p)){ if(p) skipped++; return; }
      const i = n[b][idx] === null ? idx : n[b].indexOf(null);
      if(i < 0){ skipped++; return; }
      n[b][i] = pid; placed++;
    });
  });
  save();
  toast(placed + " placed" + (skipped ? ", " + skipped + " unavailable or no room" : ""));
}

/* ---------------- pre-game check-in ---------------- */
let checkIn = null;
function openCheckIn(){
  checkIn = {};

  drawCheckIn();
}
function drawCheckIn(){

    '<div class="muted" style="margin-bottom:8px">Tap anyone who is not here. '+here+' of '+S.roster.length+' available.</div>'+
    '<div class="row" style="margin-bottom:10px"><button class="btn ghost" id="ci-all">Everyone is here</button>'+
    '<button class="btn ghost" id="ci-none">Nobody yet</button></div>'+
    S.roster.map(p =>
      '<button class="cirow'+(checkIn[p.id]?" on":"")+'" data-ci="'+p.id+'">'+
        avatar(p)+'<span class="nm">'+esc(p.name)+'</span>'+
        '<span class="tag">'+(checkIn[p.id]?"Here":"Out")+'</span></button>').join("");
  modal("Who is here?", body, "Save ("+here+" available)", ()=>{

  });
  document.querySelectorAll("#modalbody [data-ci]").forEach(el => el.addEventListener("click", ()=>{
    checkIn[el.dataset.ci] = !checkIn[el.dataset.ci]; drawCheckIn();
  }));

  document.getElementById("ci-none").addEventListener("click", ()=>{ S.roster.forEach(p=>checkIn[p.id]=false); drawCheckIn(); });

function bestReplacement(band, excludeId){
  const st = compute();
  return S.roster.filter(p => p.id !== excludeId && !st[p.id].onBand && available(p) && eligible(p, band))
    .sort((a,b) => {
      if(st[a.id].total !== st[b.id].total) return st[a.id].total - st[b.id].total;
      return (parseInt(a.number)||99) - (parseInt(b.number)||99);
    })[0];
}
/* Somebody went down. Get them off first, then offer the fairest replacement. */
function pullPlayer(pid, reason){
  const st = compute(), band = st[pid].onBand;
  if(!band) return;
  const w = whereOn(pid), pos = w ? w.code : null, where = whereName(w);
  push([{type:"OFF", playerId:pid}]);
  const sub = bestReplacement(band, pid);
  render();
  if(!sub){ toast(first(pid)+" off — nobody available to come on"); return; }
  modal(reason || "Player off",
    '<div style="font-size:15px"><b>'+esc(first(pid))+'</b> is off at '+esc(where)+'.<br><br>'+
    'Bring on <b>'+esc(sub.name)+'</b>? <span class="muted">('+fmt(st[sub.id].total)+' played — least of anyone available)</span></div>',
    "Bring "+first(sub.id)+" on",
    ()=>{ push([{type:"ON", playerId:sub.id, band, pos}]); render(); toast(first(sub.id)+" on at "+where); },
    "Leave the spot open");
}
function ensureNext(){
  const n = S.game.next || {};
  BANDS.forEach(b => {
    const k = slotsFor(b); n[b] = (n[b] || []).slice(0, k).map(id => byId(id) ? id : null);
    while(n[b].length < k) n[b].push(null);
  });
  S.game.next = n; return n;
}
function nextSlotOf(pid){
  const n = ensureNext();
  for(const b of BANDS){ const i = n[b].indexOf(pid); if(i >= 0) return {band:b, i}; }
  return null;
}
function nextCount(){ return BANDS.reduce((a,b) => a + ensureNext()[b].filter(Boolean).length, 0); }
function planInto(pid, band, i){
  const n = ensureNext(), was = nextSlotOf(pid), sitting = n[band][i];
  n[band][i] = pid;
  if(was) n[was.band][was.i] = (was.band === band && was.i === i) ? null : (sitting || null);
  save();
}
function planClear(pid){ const was = nextSlotOf(pid); if(was){ S.game.next[was.band][was.i] = null; save(); } }
/* An empty slot in the plan means whoever stands in that exact position now stays there.
   Anyone whose position was planned over, and who isn't planned anywhere else, slides into
   the next empty slot in the same band if there is one, and otherwise comes off. */
function resolvePlan(){
  const lay = fieldLayout(), n = ensureNext(), planned = {}, out = {};
  BANDS.forEach(b => n[b].forEach(id => { if(id) planned[id] = 1; }));
  BANDS.forEach(b => {
    const staying = id => (id && !planned[id]) ? id : null;
    out[b] = n[b].map((id, i) => id || staying(lay.slots[b][i]));
    const spare = lay.slots[b].concat(lay.extra[b]).filter(id => staying(id) && out[b].indexOf(id) < 0);
    out[b] = out[b].map(id => id || spare.shift() || null);
  });
  return out;
}
function planDiff(){
  const st = compute(), lay = fieldLayout(st), res = resolvePlan(), keep = {}, ev = [];
  BANDS.forEach(b => res[b].forEach((id, i) => { if(id) keep[id] = {band:b, pos:slotPos(b, i)}; }));
  S.roster.forEach(p => { if(st[p.id].onBand && !keep[p.id]) ev.push({type:"OFF", playerId:p.id}); });
  Object.keys(keep).forEach(id => {
    const k = keep[id], cur = whereOn(id, lay);
    if(!cur) ev.push({type:"ON", playerId:id, band:k.band, pos:k.pos});
    else if(cur.band !== k.band || cur.code !== k.pos) ev.push({type:"MOVE", playerId:id, band:k.band, pos:k.pos});
  });
  return ev;
}
function autoFillNext(){
  const st = compute(), lay = fieldLayout(st), n = ensureNext();
  BANDS.forEach(b => n[b] = n[b].map(()=>null));
  const now = gameElapsed();

  const slots = [];
  BANDS.forEach(b => { for(let i=0;i<slotsFor(b);i++) slots.push({band:b, i, pos:slotPos(b, i)}); });
  const size = slots.length;
  if(!size){ save(); return; }

  /* onNow is the band each field player is in; cur is their exact slot, when they have one */
  const onNow = {}, cur = {};
  BANDS.forEach(b => {
    lay.slots[b].forEach((id, i) => { if(id){ onNow[id] = b; cur[id] = slots.find(s => s.band === b && s.i === i); } });
    lay.extra[b].forEach(id => { onNow[id] = b; });
  });

  /* locked = must stay on: the keeper, and anyone who hasn't had their minimum stint */
  const locked = {};
  const minS = S.settings.minStint || 0;
  if(minS > 0) S.roster.forEach(p => {
    const r = st[p.id];
    if(r.onBand && available(p) && (now - r.onSince) < minS) locked[p.id] = r.onBand;
  });
  const keeper = S.roster.find(p => st[p.id].onBand === "GK");
  if(slotsFor("GK") && keeper && available(keeper) && eligible(keeper,"GK")) locked[keeper.id] = "GK";

  /* with seasonBalance on, a kid behind an even share over past games moves up the order */
  const season = (S.settings.seasonBalance && S.archive.length) ? seasonBalance() : null, owed = seasonOwed(season);
  const byMinutes = (a,b) => {
    const ta = st[a.id].total - (owed[a.id]||0), tb = st[b.id].total - (owed[b.id]||0);
    if(ta !== tb) return ta - tb;
    const la = st[a.id].lastOff == null ? -1 : st[a.id].lastOff, lb = st[b.id].lastOff == null ? -1 : st[b.id].lastOff;
    if(la !== lb) return la - lb;
    return (parseInt(a.number)||99) - (parseInt(b.number)||99);
  };

  /* A. pick the squad — locked players, then whoever has played least */
  const squad = S.roster.filter(p => locked[p.id]);
  S.roster.filter(p => available(p) && !locked[p.id]).sort(byMinutes)
    .forEach(p => { if(squad.length < size) squad.push(p); });

  /* B. hold everyone already on the field in the exact position they're standing in */
  const free = slots.slice(), spot = {};
  const claim = s => { const k = free.indexOf(s); if(k < 0) return false; free.splice(k,1); return true; };
  squad.forEach(p => {
    const b = locked[p.id] || onNow[p.id], c = cur[p.id];
    if(b && eligible(p,b) && c && c.band === b && claim(c)) spot[p.id] = c;
  });
  squad.forEach(p => {
    const b = locked[p.id] || onNow[p.id];
    if(spot[p.id] || !b || !eligible(p,b)) return;
    const s = free.find(x => x.band === b); if(s && claim(s)) spot[p.id] = s;
  });
  /* Whoever is left is coming off the bench. With freshPositions on they go to the open
     position they've spent least time in — a kid who has only played left D gets right D or
     striker. Off, it evens out by band only. Goal is last resort either way. Times are
     bucketed to 30 s so a few seconds' difference doesn't override the next tiebreak. */
  const fresh = S.settings.freshPositions !== false, q = sec => Math.round((sec||0)/30);
  const cost = (p, s) => { const r = st[p.id];
    const past = season && season.posAvg[p.id] ? (season.posAvg[p.id][s.pos] || 0) : 0;   /* avg per past game */
    return [eligible(p, s.band) ? 0 : 1, s.band === "GK" ? 1 : 0, fresh ? q((r.pos[s.pos]||0) + past) : q(r[s.band]), fresh ? q(r[s.band]) : 0]; };
  const better = (a, b) => { for(let k=0;k<a.length;k++) if(a[k] !== b[k]) return a[k] < b[k]; return false; };
  const incoming = squad.filter(p => !spot[p.id]);
  while(incoming.length && free.length){
    let best = null;
    incoming.forEach(p => free.forEach(s => { const c = cost(p, s); if(!best || better(c, best.c)) best = {p, s, c}; }));
    claim(best.s); spot[best.p.id] = best.s; incoming.splice(incoming.indexOf(best.p), 1);
  }

  /* C. rotate front to back. maxSwitch null is no limit — every swap must even things out
     by more than two minutes, so the total keeps falling and this still settles. */
  let budget = S.settings.rotate ? (S.settings.maxSwitch == null ? Infinity : S.settings.maxSwitch) : 0;
  const held = () => squad.filter(p => onNow[p.id] && spot[p.id] && spot[p.id].band === onNow[p.id] && spot[p.id].band !== "GK");
  while(budget >= 2){
    let best = null;
    const hs = held();
    for(const a of hs) for(const b of hs){
      if(a.id === b.id) continue;
      const ba = spot[a.id].band, bb = spot[b.id].band;
      if(ba === bb) continue;
      if(!eligible(a,bb) || !eligible(b,ba)) continue;
      /* gain = how much more balanced both players get by trading places */
      const gain = (st[a.id][ba] - st[a.id][bb]) + (st[b.id][bb] - st[b.id][ba]);
      if(gain > 120 && (!best || gain > best.gain)) best = {a, b, gain};
    }
    if(!best) break;
    const tmp = spot[best.a.id]; spot[best.a.id] = spot[best.b.id]; spot[best.b.id] = tmp;
    onNow[best.a.id] = spot[best.a.id].band; onNow[best.b.id] = spot[best.b.id].band;
    budget -= 2;
  }

  Object.keys(spot).forEach(pid => { const s = spot[pid]; n[s.band][s.i] = pid; });
  save();
}
function lastBandOf(pid){
  for(let i=S.game.log.length-1;i>=0;i--){
    const e = S.game.log[i];
    if(e.playerId===pid && (e.type==="ON"||e.type==="MOVE")) return e.band;
  }
  return null;
}
function nextUpIds(k){
  const st = compute(), owed = seasonOwed();
  return S.roster.filter(p => !st[p.id].onBand && available(p))
    .sort((a,b) => (st[a.id].total - (owed[a.id]||0)) - (st[b.id].total - (owed[b.id]||0))).slice(0,k).map(p => p.id);
}

/* ---------------- audio / haptics / wake ---------------- */
let actx = null;
function primeAudio(){
  try{
    if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state === "suspended") actx.resume();
    const o = actx.createOscillator(), g = actx.createGain();
    g.gain.value = 0; o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + 0.01);
  }catch(e){}
}
document.addEventListener("pointerdown", primeAudio, true);
function beep(freq, start, dur, vol){
  if(!actx) return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = "square"; o.frequency.value = freq;
  const t0 = actx.currentTime + start;
  g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(vol, t0+0.015);
  g.gain.setValueAtTime(vol, t0+dur-0.03); g.gain.linearRampToValueAtTime(0, t0+dur);
  o.connect(g); g.connect(actx.destination); o.start(t0); o.stop(t0+dur+0.02);
}
function alarm(kind){
  if(S.settings.sound){
    primeAudio();
    if(kind === "warn") beep(660,0,.16,.25); 
    else for(let i=0;i<3;i++){ beep(880, i*.42, .18, .3); beep(660, i*.42+.2, .18, .3); }
  }
  if(S.settings.vibrate && navigator.vibrate) navigator.vibrate(kind==="warn" ? [120] : [200,90,200,90,350]);
  if(kind !== "warn"){
    const f = document.getElementById("flash");
    f.classList.remove("go"); void f.offsetWidth; f.classList.add("go");
  }
}
let wakeLock = null;
async function wake(on){
  try{
    if(on && "wakeLock" in navigator && !wakeLock){
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", ()=>{ wakeLock=null; });
    } else if(!on && wakeLock){ await wakeLock.release(); wakeLock=null; }
  }catch(e){ wakeLock = null; }
}
document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState === "visible"){ if(S.game.running) wake(true); tick(); render(); }
});

/* ---------------- clock control ---------------- */
function startClock(){
  if(S.game.periodOver){ toast(S.game.period >= S.settings.periods ? "Game over" : "Start next period on Clock tab"); return; }
  /* the first kickoff dates the game and records who was there */
  if(!S.game.date) S.game.date = Date.now();
  if(!S.game.present) S.game.present = S.roster.filter(available).map(p => p.id);
  S.game.running = true; S.game.startedAt = Date.now(); S.game.pausedAt = null; S.game.nagged = false;
  if(!S.game.log.length && !S.game.shiftStart) resetShiftClock();
  wake(true); save(); render();
}
function stopClock(){
  if(S.game.running){ S.game.base = periodElapsed(); S.game.running = false; S.game.startedAt = null; S.game.pausedAt = Date.now(); }
  wake(false); save(); render();
}
function toggleClock(){ S.game.running ? stopClock() : startClock(); }
function endPeriodNow(){ stopClock(); S.game.periodOver = true; push([{type:"PERIOD_END"}]); alarm("end"); render(); }
function nextPeriod(){
  S.game.priorTotal += S.game.base; S.game.base = 0; S.game.period++; S.game.periodOver = false; S.game.pausedAt = null;
  beginNewShift(); save();
  /* halftime is when coaches reset everything — land them on the lineup, not the clock */
  if(S.settings.autoPlan){ maybeAutoPlan(); if(nextCount()){ activeTab = "next"; } }
  render();
  toast("Period "+S.game.period+" — check your lineup");
}

function tick(){
  invalidate();
  const g = S.game, s = S.settings;
  if(g.running && periodElapsed() >= s.periodLen*60 && !g.periodOver){ endPeriodNow(); return; }
  if(g.running && !g.periodOver){
    const rem = shiftRemaining(), guard = periodRemaining() <= 45;
    if(!g.warned && rem <= s.warnLead && rem > 0 && !guard && s.warnLead > 0){ g.warned = true; alarm("warn"); }
    if(!g.alerted && rem <= 0 && !guard){ g.alerted = true; alarm("end"); }
  }
  /* The most common way minutes go wrong is a clock left paused after a stoppage. Two minutes
     paused mid-period with players on the field gets one nudge and a pulsing START. Halftime
     doesn't count — nextPeriod clears pausedAt. */
  const idle = S.settings.pauseReminder !== false && !g.running && !g.periodOver && g.pausedAt &&
    (Date.now() - g.pausedAt) > 120000 && Object.values(compute()).some(r => r.onBand);
  document.getElementById("topbar").classList.toggle("paused", !!idle);
  if(idle && !g.nagged){ g.nagged = true; alarm("warn"); toast("The clock is still paused. Tap START when play restarts."); }
  checkSinBin();
  paintClocks(); paintLive();
}
/* a sin bin that expires silently is useless — watch for it and say so */
let _binWatch = {};
function checkSinBin(){
  if(!S.settings.ycSinBin) return;
  const st = compute(), now = gameElapsed(), freed = [];
  S.roster.forEach(p => {
    const end = st[p.id] ? st[p.id].sinBinEnd : 0;
    if(!end || p.avail !== "available") return;
    if(end > now){ _binWatch[p.id] = end; }
    else if(_binWatch[p.id]){ delete _binWatch[p.id]; freed.push(p); }
  });
  if(freed.length){
    alarm("warn");
    toast(freed.map(p => p.name.split(" ")[0]).join(", ") + (freed.length>1 ? " are" : " is") + " available again");
    render();
  }
}
function paintClocks(){
  const s = S.settings;
  document.getElementById("tb-clock").textContent = fmt2(periodElapsed());
  document.getElementById("tb-period").textContent = S.game.periodOver ? "Period " + S.game.period + " over" : "Period " + S.game.period + " of " + s.periods;
  const rem = shiftRemaining();
  document.getElementById("tb-shiftval").textContent = (rem<0?"+":"") + fmt(Math.abs(rem));
  document.getElementById("tb-go").textContent = S.game.running ? "PAUSE" : "START";
  document.getElementById("tb-go").classList.toggle("running", S.game.running);
  document.getElementById("topbar").classList.toggle("over", rem <= 0);
  
  const sc = computeMatchScore();
  document.getElementById("sc-us").textContent = sc.us;
  document.getElementById("sc-them").textContent = sc.them;

  const bc = document.getElementById("big-clock");
  if(bc){
    bc.textContent = fmt2(periodElapsed());
    const br = document.getElementById("big-shift"); if(br) br.textContent = (rem<0?"+":"") + fmt(Math.abs(rem));
    const bp = document.getElementById("big-left"); if(bp) bp.textContent = fmt(periodRemaining()) + " left";
  }
}
function paintLive(){
  const st = compute();
  document.querySelectorAll("[data-live]").forEach(el => {
    const [pid, what] = el.dataset.live.split("|"); const r = st[pid]; if(!r) return;
    if(what === "stint") el.textContent = r.onBand ? fmt(gameElapsed()-r.onSince) : "";
    else el.textContent = fmt(r[what] === undefined ? r.total : r[what]);
  });
  document.querySelectorAll("[data-livec]").forEach(el => {
    const [pid, what] = el.dataset.livec.split("|"); const r = st[pid]; if(!r) return;
    const c = what === "total" ? r.nTotal : r.n[what]; el.textContent = c ? "×"+c : "";
  });
}

/* ---------------- helpers ---------------- */
function colorOf(num){ const n = parseInt(num); const h = isNaN(n) ? 150 : (n*47)%360; return "hsl("+h+",62%,"+(document.body.classList.contains("sun")?"30%":"62%")+")"; }
function avatar(p, cls){

  return '<div class="avn '+(cls||"")+'" style="background:'+colorOf(p.number)+'">'+(p.number||"–")+'</div>';
}
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function uid(){ return "p"+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function byId(id){ return S.roster.find(p => p.id===id); }

let activeTab = "field";
function buildTabs(){

function paintTabs(){
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("active", b.dataset.tab === activeTab));
  TABS.forEach(t => document.getElementById("v-"+t.id).classList.toggle("active", t.id === activeTab));
