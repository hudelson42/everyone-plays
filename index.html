<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0E1513">
<title>Everyone Plays — playing time tracker</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Everyone Plays">
<meta name="description" content="Substitution and playing-time tracker for youth sports coaches: soccer, field hockey, lacrosse, ice hockey and basketball. Works offline, keeps everything on your phone.">
<style>
:root{
  --bg:#0E1513; --panel:#16201D; --panel2:#1D2926; --line:#2C3B36;
  --turf:#12392A; --turf-line:rgba(233,245,239,.22);
  --ink:#E9F5EF; --ink-dim:#8FA69E;
  --on:#3ECF8E; --next:#F2B33D; --alert:#E4572E; --gk:#7FB2FF; --warn:#F2B33D;
  --r:10px; --tap:44px;
  --fs-clock:clamp(44px,15vw,64px);
}
body.sun{
  --bg:#FFFFFF; --panel:#FFFFFF; --panel2:#F0F0F0; --line:#000000;
  --turf:#FFFFFF; --turf-line:#000000;
  --ink:#000000; --ink-dim:#333333;
  --on:#006B3C; --next:#9A5B00; --alert:#B3130B; --gk:#0B3EA8; --warn:#C67A00;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:15px; line-height:1.35;
  touch-action:manipulation; user-select:none; -webkit-user-select:none;
  overscroll-behavior:none;
}
body.sun{font-weight:600}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:none;padding:0;cursor:pointer}

/* ---------- shell ---------- */
#app{display:flex;flex-direction:column;height:100%;padding-top:env(safe-area-inset-top)}
#topbar{
  display:flex;align-items:center;gap:10px;padding:8px 12px;
  border-bottom:1px solid var(--line);background:var(--panel);flex:none;
}
#tb-clock{font-size:26px;font-weight:700;letter-spacing:-.5px}
#tb-period{font-size:11px;color:var(--ink-dim);margin-top:-2px}
#tb-period::after{content:" ▸"}
#tb-clockbtn{text-align:left;min-height:var(--tap)}
.backlink{display:inline-flex;align-items:center;min-height:var(--tap);padding:0 4px;margin:-8px 0 4px;color:var(--on);font-weight:700;font-size:14px}
body.sun .backlink{color:#000;text-decoration:underline}
#tb-shift{margin-left:auto;text-align:right}
#tb-shiftval{font-size:22px;font-weight:700}
#tb-shiftlab{font-size:10px;color:var(--ink-dim);letter-spacing:.04em}
#tb-go{
  width:56px;height:40px;border-radius:var(--r);border:1px solid var(--line);
  background:var(--panel2);font-size:12px;font-weight:700;
}
#tb-go.running{background:var(--on);color:#06150E;border-color:var(--on)}
body.sun #tb-go.running{color:#fff}
.over #tb-shiftval{color:var(--alert)}

/* Advanced mode visibilities */
body:not(.adv) .adv-only { display: none !important; }

main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px 20px}
.view{display:none}
.view.active{display:block}

nav#tabs{
  display:flex;flex:none;border-top:1px solid var(--line);background:var(--panel);
  padding-bottom:env(safe-area-inset-bottom);
}
nav#tabs button{
  flex:1;min-width:0;min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;color:var(--ink-dim);font-size:10px;letter-spacing:.01em;padding:6px 2px;
}
nav#tabs button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav#tabs button.active{color:var(--ink)}
nav#tabs button.active svg{stroke:var(--on)}

/* ---------- generic ---------- */
h2{font-size:17px;margin:0 0 8px;font-weight:700;letter-spacing:-.2px}
h3{font-size:12px;margin:18px 0 6px;color:var(--ink-dim);font-weight:600}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:12px}
.btn{
  min-height:var(--tap);padding:0 14px;border-radius:var(--r);border:1px solid var(--line);
  background:var(--panel2);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;
}
.btn.wide{width:100%}
.btn.primary{background:var(--on);color:#06150E;border-color:var(--on)}
body.sun .btn.primary{color:#fff}
.btn.warn{background:var(--alert);color:#fff;border-color:var(--alert)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.38}
.row{display:flex;gap:8px}
.row>*{flex:1}
.muted{color:var(--ink-dim);font-size:12px}
label.field{display:block;margin-bottom:10px}
label.field span{display:flex;align-items:center;gap:2px;font-size:11px;color:var(--ink-dim);margin-bottom:4px}
/* "?" beside each setting, and the floating explanation it opens */
.tipbtn{position:relative;flex:none;width:26px;height:26px;margin-left:6px;border-radius:50%;border:1px solid var(--line);
  color:var(--ink-dim);font-size:13px;font-weight:700;line-height:1}
.tipbtn::after{content:"";position:absolute;inset:-9px} /* a 44 px target around a small circle */
.tipbtn.open{border-color:var(--next);color:var(--next)}
#tipbubble{position:fixed;z-index:110;max-width:min(300px,calc(100vw - 24px));padding:10px 12px;border-radius:var(--r);
  background:var(--panel2);border:1px solid var(--next);font-size:13px;line-height:1.45;color:var(--ink);box-shadow:0 8px 24px rgba(0,0,0,.45)}
body.sun #tipbubble{background:#fff;color:#000;border-color:#000}
/* which screen am I on: Field is live, Next is a plan */
.modestrip{display:flex;align-items:baseline;gap:8px;margin:-4px 0 10px;padding:6px 10px;border-radius:var(--r);font-size:12px}
.modestrip b{font-size:11px;letter-spacing:.08em}
.modestrip.live{background:rgba(62,207,142,.12);color:var(--on);border:1px solid var(--on)}
.modestrip.plan{background:rgba(242,179,61,.12);color:var(--next);border:1px dashed var(--next)}
body.sun .modestrip.live,body.sun .modestrip.plan{background:#fff}
/* Field's top row: the live strip on the left half, the team on the right */
.toprow{display:flex;gap:8px;margin:-4px 0 8px}
.toprow>*{flex:1 1 0;min-width:0;margin:0}
.toprow .modestrip{align-items:center;flex-wrap:wrap;column-gap:6px;row-gap:0;min-height:var(--tap)}
.teambar.compact{flex-direction:column;align-items:flex-start;justify-content:center;gap:0;padding:2px 10px}
.teambar.compact b{flex:none;width:100%;font-size:14px}
.teambar.compact .muted{font-size:10px}
.xtra{display:flex;align-items:center;gap:10px;border-color:var(--alert);margin-bottom:8px;padding:8px 10px}
.xtra>div{flex:1;min-width:0}
.xtra .btn{flex:none}
#v-field #pitch{border:2px solid var(--on)}
#v-next #pitch{border:2px dashed var(--next);background-image:repeating-linear-gradient(135deg,rgba(242,179,61,.08) 0 14px,transparent 14px 28px)}
nav#tabs button.active{box-shadow:inset 0 3px 0 var(--on)}
nav#tabs button.active[data-tab="next"]{color:var(--next);box-shadow:inset 0 3px 0 var(--next)}
input[type=text],input[type=number],select,textarea{
  width:100%;min-height:var(--tap);padding:8px 10px;border-radius:var(--r);
  border:1px solid var(--line);background:var(--panel2);
}
textarea{min-height:110px;font-family:ui-monospace,Menlo,monospace;font-size:11px;resize:vertical}
.seg{display:flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{flex:1;min-height:var(--tap);font-weight:600;font-size:13px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--on);color:#06150E}
body.sun .seg button.on{color:#fff;background:var(--on)}
.ev-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(44px, 1fr)); gap: 4px; margin-top: 6px; }
.ev-grid .btn { font-size: 11px; padding: 0; min-height: var(--tap); }

/* ---------- pitch ---------- */
#pitch{
  background:var(--turf);border:1px solid var(--line);border-radius:var(--r);
  padding:6px;margin-bottom:8px;position:relative;overflow:hidden;
  isolation:isolate; /* keeps the bands' z-index inside the pitch, so the selected-player bar can sit on top */
}
#pitch::before{
  content:"";position:absolute;left:8px;right:8px;top:50%;height:1px;background:var(--turf-line);
}
#pitch::after{
  content:"";position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;
  border:1px solid var(--turf-line);border-radius:50%;
}
.band{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:4px 0}

#pitch{--cw:98px;--avs:52px}
/* No box around a player: the photo, the name, and one line with position and time. Status shows
   as a ring around the photo and a small label over its top edge. */
.chip{
  width:80px;min-height:80px;border-radius:var(--r);border:1px solid transparent;
  background:transparent;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:1px;padding:6px 3px 2px;position:relative;
}
.band .chip{width:var(--cw);min-height:0}
.band .chip .av,.band .chip .avn{
  width:var(--avs);height:var(--avs);font-size:calc(var(--avs) * .42)
}
.band .chip .nm{max-width:calc(var(--cw) - 6px);font-size:14px;font-weight:700}
.chip .meta{display:flex;gap:5px;align-items:baseline;justify-content:center;line-height:1.15;white-space:nowrap}
#pitch.tight{padding:3px 6px}
#pitch.tight .band{margin:1px 0}
#pitch.tight .band .chip{padding:5px 2px 1px;gap:0}
#ghost{position:fixed;z-index:120;pointer-events:none;transform:translate(-50%,-50%) scale(1.06);
  opacity:.96;box-shadow:0 10px 26px rgba(0,0,0,.55);border-color:var(--next);background:var(--panel)}
.chip.dragging{opacity:.3}
.droptarget{outline:3px dashed var(--next);outline-offset:2px}
#benchzone.droptarget{outline:3px dashed var(--alert);border-radius:var(--r)}
body.nodrag main{overflow:hidden}
.postog{display:flex;gap:6px;margin:2px 0 10px}
.postog button{
  flex:1;min-height:var(--tap);border:1px solid var(--line);border-radius:var(--r);
  background:var(--panel2);font-size:12px;font-weight:700;color:var(--ink-dim)
}
.postog button.on{background:var(--on);color:#06150E;border-color:var(--on)}
body.sun .postog button.on{color:#fff}
.addrow{display:flex;gap:8px;margin-bottom:12px}
.addrow input.n{flex:3;min-width:0} .addrow input.j{flex:1;min-width:60px} .addrow button{flex:none;width:76px}
.prow{cursor:pointer}
.pedit{border:1px solid var(--line);border-top:none;border-radius:0 0 var(--r) var(--r);
  background:var(--panel);padding:12px;margin-top:-9px}
.prow.open{border-radius:var(--r) var(--r) 0 0}
.av{width:34px;height:34px;border-radius:50%;object-fit:cover;display:block;border:1px solid var(--line)}
.avn{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#06150E}
body.sun .avn{color:#fff;border:1px solid #000}
.chip .av{width:30px;height:30px;border-radius:50%;object-fit:cover;display:block;border:1px solid var(--line)}
.chip .avn{
  width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;color:#06150E;
}
body.sun .chip .avn{color:#fff;border:1px solid #000}
.chip .nm{font-size:13px;font-weight:700;max-width:74px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.15}
.chip .tm{font-size:12px;color:var(--ink-dim)}
.chip .pc{font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--ink-dim)}
body.sun .chip .pc{color:#000}
.chip.sel{outline:3px solid var(--next);outline-offset:-1px;background:rgba(242,179,61,.14)}
.chip.empty{border:1px dashed var(--line);background:var(--panel);color:var(--ink-dim);font-size:11px;justify-content:center;padding:5px 3px}
.chip.empty.gkslot{border-color:var(--gk)}
.chip.gkslot .av,.chip.gkslot .avn{box-shadow:0 0 0 2px var(--gk)}
.chip.next .av,.chip.next .avn{box-shadow:0 0 0 2px var(--next)}
.chip.stale .av,.chip.stale .avn{box-shadow:0 0 0 2px var(--warn)}
.chip.sinbin .av,.chip.sinbin .avn{box-shadow:0 0 0 3px var(--alert)}
.chip .flag{position:absolute;top:0;left:50%;transform:translateX(-50%);z-index:1;font-size:9px;line-height:12px;padding:0 4px;
  border-radius:6px;background:var(--bg);white-space:nowrap;letter-spacing:.03em;color:var(--next);font-weight:700}
.band .chip .flag{background:var(--turf)}

#benchzone{min-height:60px;padding-bottom:4px}
#poolzone{min-height:96px;padding-bottom:8px}
#poolzone.droptarget{outline:3px dashed var(--alert);border-radius:var(--r)}
#bench{display:flex;flex-wrap:wrap;gap:6px}
/* Field's bench sits on one line: renderField sizes the cards to fit (--bw, --bavs) */
#benchzone #bench{gap:4px}
#poolzone{min-height:60px}
#poolzone #bench{gap:4px}
#benchzone .chip,#poolzone .chip{width:var(--bw,80px);min-height:0;padding:6px 1px 2px}
#benchzone .chip .av,#benchzone .chip .avn,#poolzone .chip .av,#poolzone .chip .avn{width:var(--bavs,30px);height:var(--bavs,30px);font-size:calc(var(--bavs,30px) * .42)}
#benchzone .chip .nm,#poolzone .chip .nm{max-width:calc(var(--bw,80px) - 4px);font-size:12px}
/* on the field a card's time is this stint, in green; everywhere else it's minutes played */
#v-field .band .chip .tm{color:var(--on)}
.benchhead{display:flex;align-items:center;gap:6px;margin:0 0 2px}
.benchhead>div{flex:1;min-width:0;line-height:1.2}
.benchhead h3{margin:0}
.benchhead .muted{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.benchhead .btn{flex:none;padding:0 12px;font-size:13px}
#v-next h3.poolh{margin:2px 0 2px}
.linkrow{display:flex;justify-content:space-between;gap:12px;margin:4px 0}
.linkbtn{min-height:var(--tap);padding:0 4px;color:var(--ink-dim);font-size:13px;font-weight:600;text-decoration:underline}
.hint .linkbtn{min-height:0;padding:0 2px;color:var(--on)}
.hint{font-size:12px;color:var(--ink-dim);margin:8px 0}
.startrow{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.4}
.startrow div b{color:var(--on)}
.startrow>b:first-child{flex:none;width:24px;height:24px;border-radius:50%;background:var(--on);color:#06150E;
  display:flex;align-items:center;justify-content:center;font-size:13px}
body.sun .startrow>b:first-child{color:#fff}
.badges{font-size:11px;font-weight:700;letter-spacing:.02em}
.cirow{display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;margin-bottom:6px;
  border:1px solid var(--line);border-radius:var(--r);background:var(--panel2);min-height:var(--tap);opacity:.45}
.cirow.on{opacity:1;border-color:var(--on)}
.cirow .nm{flex:1;text-align:left;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cirow .tag{font-size:11px;font-weight:700;color:var(--ink-dim)}
.cirow.on .tag{color:var(--on)}
.lulist button{display:flex;align-items:center;gap:10px;width:100%;padding:10px;margin-bottom:6px;
  border:1px solid var(--line);border-radius:var(--r);background:var(--panel2);min-height:var(--tap);text-align:left}
.lulist b{flex:1;font-size:14px}
.teambar{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;margin-bottom:10px;min-height:var(--tap);
  border:1px solid var(--line);border-radius:var(--r);background:var(--panel);text-align:left;font:inherit;color:inherit}
.teambar b{flex:1;min-width:0;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.teambar .muted{flex:none}
.tiplink{color:var(--on);text-decoration:underline;font-weight:600}
body.sun .tiplink{color:#000}
.monthlab{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-dim);margin:14px 2px 6px}
.gamerow{display:flex;align-items:center;gap:10px;width:100%;padding:10px;margin-bottom:6px;min-height:var(--tap);
  border:1px solid var(--line);border-radius:var(--r);background:var(--panel);text-align:left;font:inherit;color:inherit}
.gamerow .t{flex:none;min-width:84px;font-size:13px;font-weight:700}
.gamerow .s{flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
tr.low td:last-child{color:var(--warn);font-weight:700}
#topbar.paused #tb-go{background:var(--warn);color:#06150E;border-color:var(--warn);animation:nudge 1.2s ease-in-out infinite}
@keyframes nudge{50%{transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){#topbar.paused #tb-go{animation:none}}
.helpq{font-size:15px;font-weight:700;margin:16px 0 5px}
.helpq:first-child{margin-top:0}
.helpa{font-size:14px;line-height:1.45;color:var(--ink-dim)}
.helpa b{color:var(--ink)}
.selbar{
  position:sticky;bottom:0;z-index:20;box-shadow:0 -6px 16px rgba(0,0,0,.35);background:var(--panel);border:1px solid var(--next);
  border-radius:var(--r);padding:8px;margin-top:8px;font-size:13px;
}
.selbar .row{margin-top:6px;gap:6px}
.selbar .row .btn{padding:0 8px;font-size:13px}
.selbar .muted{font-size:12px}
.seltxt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.selbar .ev-grid{margin-top:4px}
.selrow{display:flex;align-items:center;gap:8px}
.selrow>div{flex:1;min-width:0}
.selrow .btn{flex:none}

/* ---------- grid ---------- */
table.grid{width:100%;border-collapse:collapse;table-layout:fixed}
table.grid th{
  font-size:10px;color:var(--ink-dim);font-weight:600;padding:6px 2px;text-align:right;
  border-bottom:1px solid var(--line);
}
table.grid th:first-child{text-align:left}
table.grid th.sortable{cursor:pointer}
table.grid th.sorted{color:var(--ink);text-decoration:underline}
table.grid td{padding:0;border-bottom:1px solid var(--line);height:50px;font-size:12px}
table.grid td.t{text-align:right;padding-right:2px}
table.grid td.t button,table.grid td.t .tot{
  width:100%;height:50px;display:flex;flex-direction:column;align-items:flex-end;
  justify-content:center;gap:0;padding-right:2px;font-size:12px
}
table.grid td.t .tot .mono{font-weight:700}
.cnt{font-size:9px;color:var(--ink-dim);line-height:1.1}
.chip.holding{opacity:.5}
.chip.onnow .av,.chip.onnow .avn{box-shadow:0 0 0 2px var(--on)}
/* each sport's playing surface, drawn with the pitch's two pseudo-elements (a center line and a circle for soccer) */
#pitch[data-sport="fieldhockey"]::after,#pitch[data-sport="lacrosse"]::after{left:8px;right:8px;top:24%;bottom:24%;width:auto;height:auto;margin:0;border-radius:0;border:0;
  border-top:1px dashed var(--turf-line);border-bottom:1px dashed var(--turf-line)}
#pitch[data-sport="lacrosse"]::after{border-top-style:solid;border-bottom-style:solid}
#pitch[data-sport="hockey"]{border-radius:26px;background-color:#16303A}
#pitch[data-sport="hockey"]::before{height:2px;background:rgba(228,87,46,.55)}
#pitch[data-sport="hockey"]::after{left:0;right:0;top:32%;bottom:32%;width:auto;height:auto;margin:0;border-radius:0;border:0;
  border-top:2px solid rgba(127,178,255,.5);border-bottom:2px solid rgba(127,178,255,.5)}
#pitch[data-sport="basketball"]{background-color:#2C2418}
#pitch[data-sport="basketball"]::before{left:33%;right:33%;top:0;height:30%;background:none;border:1px solid var(--turf-line);border-top:0}
#pitch[data-sport="basketball"]::after{left:12%;top:-34%;width:76%;height:74%;margin:0;border-radius:50%}
body.sun #pitch[data-sport="hockey"],body.sun #pitch[data-sport="basketball"]{background-color:#fff}
/* hockey lines editor */
.linerow{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.linerow .lpos{flex:none;width:52px}
.lslot{flex:1;min-width:0;min-height:var(--tap);padding:0 4px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel2);
  font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lslot.empty{border-style:dashed;color:var(--ink-dim);font-weight:500}
.lslot.sel{outline:3px solid var(--next);outline-offset:-1px}
nav#tabs button{font-size:11px;font-weight:600}
.pname{display:flex;align-items:center;gap:6px;min-width:0}

const BANDS = ["GK","DEF","MID","FWD"];

      MID: {L:["LM","Left mid"],    LC:["LCM","Left center mid"], C:["CM","Center mid"], RC:["RCM","Right center mid"], R:["RM","Right mid"]},

  },

    posdef:{

      DEF: {L:["LD","Left D"], C:["D","Defense"], R:["RD","Right D"]},
      FWD: {L:["LW","Left wing"], LC:["LF","Left forward"], C:["C","Center"], RC:["RF","Right forward"], R:["RW","Right wing"]}
    },
    special:{FWD:{2:["LF","RF"]}},
    sizes:[4,5,6], defaultSize:6, sizeLabel:n => (n-1)+" v "+(n-1)+" plus goalie",
    formLabel:"Skaters — defense and forwards",

    describe:f => [f.d+" on defense", f.f+" forwards", "1 in goal"].join(" · "),

    posdef:{

      DEF: {L:["PG","Point guard"], C:["PG","Point guard"], R:["SG","Shooting guard"]},
      MID: {L:["SF","Small forward"], C:["SF","Small forward"], R:["PF","Power forward"]},
      FWD: {C:["C","Center"]}
    },
    sizes:[3,4,5], defaultSize:5, sizeLabel:n => n+" v "+n,
    formLabel:"Lineup — guards, forwards, center",
    formName:f => f.d+" G, "+f.m+" F, "+f.f+" C",
    describe:f => [f.d+(f.d === 1 ? " guard" : " guards"), f.m+(f.m === 1 ? " forward" : " forwards"), f.f ? "1 center" : "no center"].join(" · "),
    formations:{ 3:[{d:1,m:1,f:1,gk:false},{d:2,m:1,f:0,gk:false}], 4:[{d:2,m:1,f:1,gk:false},{d:2,m:2,f:0,gk:false}], 5:[{d:2,m:2,f:1,gk:false}] },
    elig:{GK:false,DEF:true,MID:true,FWD:true},
    events:["P1","P2","P3","REB","ASSIST","STL","FOUL"], opp:["OPP_P2","OPP_P3","OPP_P1"], fouls:true,

  }
};
SPORTS.soccer.formations = FORMATIONS;
/* Starting points for a team: a sport plus its usual format and timing. Futsal is a soccer preset;
   lacrosse, hockey and basketball have one for their common small-sided formats. Only format, timing
   and substitution settings change — sound, sun mode and the like stay the coach's. */
const PRESETS = [
  {id:"soccer", label:"Soccer", sport:"soccer", set:{teamSize:7, formationIdx:0, periods:2, periodLen:25, shiftLen:5, minStint:90, warnLead:30, extraTime:true, rotateKeeper:true, rotate:true, freshPositions:true, autoPlan:false}},
  {id:"futsal", label:"Futsal / indoor soccer (5 v 5)", sport:"soccer", set:{teamSize:5, formationIdx:2, periods:2, periodLen:20, shiftLen:3, minStint:60, warnLead:20, extraTime:false, rotateKeeper:true, rotate:true, freshPositions:true, autoPlan:false}},
  {id:"fieldhockey", label:"Field hockey", sport:"fieldhockey", set:{teamSize:11, formationIdx:0, periods:4, periodLen:15, shiftLen:5, minStint:90, warnLead:30, extraTime:false, rotateKeeper:false, rotate:true, freshPositions:true, autoPlan:false, sinBinMins:5}},
  {id:"lax-boys", label:"Lacrosse — boys (10 v 10)", sport:"lacrosse", set:{teamSize:10, formationIdx:0, periods:4, periodLen:12, shiftLen:4, minStint:60, warnLead:20, extraTime:false, rotateKeeper:false, rotate:false, freshPositions:true, autoPlan:false}},
  {id:"lax-girls", label:"Lacrosse — girls (12 v 12)", sport:"lacrosse", set:{teamSize:12, formationIdx:0, periods:2, periodLen:25, shiftLen:5, minStint:60, warnLead:20, extraTime:false, rotateKeeper:false, rotate:false, freshPositions:true, autoPlan:false}},
  {id:"lax-youth", label:"Lacrosse — youth (7 v 7)", sport:"lacrosse", set:{teamSize:7, formationIdx:0, periods:4, periodLen:10, shiftLen:4, minStint:60, warnLead:20, extraTime:false, rotateKeeper:false, rotate:false, freshPositions:true, autoPlan:false}},
  {id:"hockey", label:"Ice hockey (5 v 5)", sport:"hockey", set:{teamSize:6, formationIdx:0, periods:3, periodLen:15, shiftLen:1, minStint:0, warnLead:10, extraTime:false, rotateKeeper:false, rotate:false, freshPositions:false, autoPlan:true, mixLines:false}},
  {id:"hockey-small", label:"Ice hockey — cross-ice (3 v 3 or 4 v 4)", sport:"hockey", set:{teamSize:5, formationIdx:0, periods:3, periodLen:12, shiftLen:1.5, minStint:0, warnLead:10, extraTime:false, rotateKeeper:false, rotate:false, freshPositions:false, autoPlan:true, mixLines:false}},
  {id:"basketball", label:"Basketball (5 v 5)", sport:"basketball", set:{teamSize:5, formationIdx:0, periods:4, periodLen:8, shiftLen:4, minStint:60, warnLead:20, extraTime:false, rotateKeeper:false, rotate:false, freshPositions:false, autoPlan:false, foulOut:false, foulLimit:5}},
  {id:"basketball-small", label:"Basketball — youth (3 v 3 or 4 v 4)", sport:"basketball", set:{teamSize:4, formationIdx:0, periods:4, periodLen:8, shiftLen:4, minStint:60, warnLead:20, extraTime:false, rotateKeeper:false, rotate:false, freshPositions:false, autoPlan:false, foulOut:false, foulLimit:5}}
];
function presetById(id){ return PRESETS.find(p => p.id === id) || PRESETS[0]; }
function applyPreset(state, id){
  const p = presetById(id);
  state.settings.sport = p.sport; state.settings.preset = p.id;
  Object.assign(state.settings, p.set);
  if(state.game) state.game.next = null;
  return state;
}
/* the preset shown on Setup: the one last applied, if it's still this sport */
function currentPreset(){
  const s = S.settings, sport = s.sport || "soccer";
  const p = PRESETS.find(x => x.id === s.preset && x.sport === sport);
  return p ? p.id : PRESETS.find(x => x.sport === sport).id;
}

const POSNAME = {}, POSORDER = [];
let _sportId = null;
/* The team's sport. Position names, their order and the row names are rebuilt when it changes. */
function sportDef(){
  let id = "soccer";
  try{ if(S && S.settings && SPORTS[S.settings.sport]) id = S.settings.sport; }catch(e){}
  if(id !== _sportId){
    _sportId = id; const sp = SPORTS[id];
    Object.keys(POSNAME).forEach(k => delete POSNAME[k]); POSORDER.length = 0;
    BANDS.forEach(b => {
      BANDNAME[b] = sp.bandName[b] || ALLBANDS[b];
      ["L","LC","C","RC","R"].forEach(s => { const d = sp.posdef[b] && sp.posdef[b][s]; if(d && POSORDER.indexOf(d[0]) < 0){ POSNAME[d[0]] = d[1]; POSORDER.push(d[0]); } });
    });
  }
  return SPORTS[id];
}
function sportBands(){ return sportDef().bands; }
function posCodes(band, n){
  const sp = sportDef(), fixed = sp.special && sp.special[band] && sp.special[band][n];
  const sides = band === "GK" ? (n ? ["C"] : []) : (SIDES[n] || []);
  const out = fixed ? fixed.slice() : sides.filter(s => sp.posdef[band] && sp.posdef[band][s]).map(s => sp.posdef[band][s][0]);
  while(out.length < n) out.push(band + (out.length + 1));
  return out;
}
function posName(code){ sportDef(); return !code ? "" : POSNAME[code] || (BANDNAME[code.replace(/\d+$/,"")] || code) + " " + code.replace(/^\D+/,""); }
function slotPos(band, i){ return posCodes(band, slotsFor(band))[i] || null; }

/* Storage keys predate the rename from Sideline to Everyone Plays. Never rename them — every
   existing roster, game and team would silently disappear. */
const KEY = "sideline-tracker-v1";     /* the first team's data, where the app has always kept it */
const INDEX_KEY = "sideline-teams-v1";
/* sun mode, sound and vibration belong to the phone and the coach, not to a team */
const SHARED = ["sun","sound","vibrate","dragBuzz","supportNotes","tapHintHidden","installHidden"];
let TEAMS = freshTeams();               /* {v, active, list:[{id, name, key, players, bytes}], shared} */
let storageMode = "memory";
const memStore = {};                    /* last resort, so switching teams still works when storage is blocked */
const Store = {
  async get(k){
    if(window.storage && window.storage.get){
      try{ const r = await window.storage.get(k); storageMode="artifact"; return r && r.value ? r.value : null; }
      catch(e){ storageMode="artifact"; return null; }
    }
    try{ const s = localStorage.getItem(k); storageMode="local"; return s; }
    catch(e){ storageMode="memory"; return memStore[k] || null; }
  },
  async set(k, s){
    memStore[k] = s;
    if(window.storage && window.storage.set){
      try{ await window.storage.set(k, s); storageMode="artifact"; return; }catch(e){}
    }
    try{ localStorage.setItem(k, s); storageMode="local"; }catch(e){ storageMode="memory"; }
  },
  async remove(k){
    delete memStore[k];
    if(window.storage && window.storage.delete){ try{ await window.storage.delete(k); }catch(e){} }
    try{ localStorage.removeItem(k); }catch(e){}
  },
  /* saves the open team, and the index with its player count and size */
  async save(obj){
    const t = activeTeam(), s = JSON.stringify(obj);
    t.players = obj.roster.length; t.bytes = s.length;
    SHARED.forEach(k => { if(obj.settings[k] !== undefined) TEAMS.shared[k] = obj.settings[k]; });
    await this.set(t.key, s); await this.set(INDEX_KEY, JSON.stringify(TEAMS));
  }
};

/* ---------------- state ---------------- */
const DEFAULTS = {
  v:1, roster:[],
  settings:{
    advanced:false, teamSize:7, formationIdx:0, periods:2, periodLen:25, shiftLen:5,
    minStint:90, staleWarn:10, sinBinMins:5, ycSinBin:false, maxSwitch:null /* no limit */, rotate:true, freshPositions:true,
    confirmChanges:true, autoPlan:false, warnLead:30, sound:false, vibrate:false, dragBuzz:true, sun:false,
    seasonBalance:false, goalieRotation:false, pauseReminder:true, supportNotes:true, rotateKeeper:true, extraTime:true,
    tapHintHidden:false /* not a Setup switch: set by Got it under the Field hint */,
    sport:"soccer", preset:null, mixLines:false, foulOut:false, foulLimit:5,
    installHidden:false /* also not a Setup switch: set by Not now on the install card */
  },
  game:newGame(), archive:[], lineups:[], lines:{}
};
function newGame(){
  return { id:uid(), log:[], seq:0, shift:1, period:1, running:false, startedAt:null, base:0,
           priorTotal:0, periodOver:false, shiftStart:0, warned:false, alerted:false, adj:{}, next:null,
           date:null, opponent:"", present:null, pausedAt:null, nagged:false, onBreak:false, fullTime:false };
}
/* Turn whatever came out of storage or a backup into a complete state object: settings added
   since it was saved get their defaults, and the phone-level settings come from the index. */
function hydrate(saved){
  const s = Object.assign(JSON.parse(JSON.stringify(DEFAULTS)), saved || {});
  s.settings = Object.assign({}, DEFAULTS.settings, (saved && saved.settings) || {}, TEAMS.shared);
  s.game = Object.assign(newGame(), (saved && saved.game) || {}); s.game.adj = s.game.adj || {};
  if(!Array.isArray(s.roster)) s.roster = [];
  s.roster.forEach(p => { if(!p.elig) p.elig = newElig(); });
  if(!s.lineups) s.lineups = []; if(!s.archive) s.archive = []; if(!s.lines || typeof s.lines !== "object") s.lines = {};
  if(!SPORTS[s.settings.sport]) s.settings.sport = "soccer";
  s.archive = s.archive.map(a => upgradeGame(a, s.roster)).filter(Boolean);
  if(!s.game.shift) s.game.shift = 1; s.game.log.forEach(e => { if(!e.sh) e.sh = 1; if(!e.eid) e.eid = uid(); });
  if(s.game.running){ if(s.settings.extraTime === false) s.game.base = Math.min(s.game.base, s.settings.periodLen*60); s.game.running = false; s.game.startedAt = null; s.game.pausedAt = Date.now(); }
  return s;
}
let S = JSON.parse(JSON.stringify(DEFAULTS));

let saveTimer=null;
function save(){ clearTimeout(saveTimer); saveTimer=setTimeout(()=>Store.save(S),400); }

/* ---------------- teams ---------------- */
/* Each team is a whole S — roster, settings, game, archive, lineups — under its own storage
   key, so nothing outside this section needs to know teams exist. */
function freshTeams(){ return {v:1, active:"t1", list:[{id:"t1", name:"My team", key:KEY, players:0, bytes:0}], shared:{}}; }
function activeTeam(){ return TEAMS.list.find(t => t.id === TEAMS.active) || TEAMS.list[0]; }
function newTeamId(){ return "t"+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function saveIndex(){ return Store.set(INDEX_KEY, JSON.stringify(TEAMS)); }
async function readTeam(t){
  try{ const raw = await Store.get(t.key), o = raw ? JSON.parse(raw) : null; return o && o.roster ? o : null; }
  catch(e){ return null; }
}
async function initTeams(){
  let idx = null;
  try{ const raw = await Store.get(INDEX_KEY); idx = raw ? JSON.parse(raw) : null; }catch(e){ idx = null; }
  TEAMS = (idx && idx.list && idx.list.length) ? Object.assign({v:1, shared:{}}, idx) : freshTeams();
  TEAMS.active = activeTeam().id;
  const saved = await readTeam(activeTeam());
  /* first run since teams arrived: the old save is already "My team", and its phone-level
     settings become the shared ones */
  if(!idx && saved && saved.settings) SHARED.forEach(k => { if(saved.settings[k] !== undefined) TEAMS.shared[k] = saved.settings[k]; });
  S = hydrate(saved);
}
function resetView(){
  selected = null; nextSel = null; openPlayer = null; openShifts = {}; checkIn = null; _binWatch = {};
  document.body.classList.toggle("sun", !!S.settings.sun); document.body.classList.toggle("adv", !!S.settings.advanced);
}
/* Two clocks can't run at once — the clock only moves on the screen you're looking at —
   so leaving a team banks its time and stops it. */
function pauseClock(){ if(S.game.running){ S.game.base = periodElapsed(); S.game.running = false; S.game.startedAt = null; S.game.pausedAt = Date.now(); wake(false); } }
async function openTeam(id, msg){
  pauseClock(); clearTimeout(saveTimer); await Store.save(S);
  TEAMS.active = id;
  S = hydrate(await readTeam(activeTeam()));
  await saveIndex();
  resetView(); invalidate(); render(); toast(msg || "Switched to "+activeTeam().name);
}
function switchTeam(id, msg){
  if(id === TEAMS.active || !TEAMS.list.some(t => t.id === id)) return Promise.resolve();
  if(!S.game.running) return openTeam(id, msg);
  modal("Switch teams?", '<div style="font-size:15px">The clock is running for <b>'+esc(activeTeam().name)+'</b>. Switching pauses it, and minutes stop until you come back and start it again.</div>',
    "Pause and switch", ()=>{ openTeam(id, msg); });
  return Promise.resolve();
}
/* data: a whole team from an old backup. preset: a new, empty team set up for that sport. */
async function addTeam(name, data, preset){
  const id = newTeamId(), t = {id, name:String(name||"").trim().slice(0,40) || "Team "+(TEAMS.list.length+1), key:"sideline-team-"+id, players:0, bytes:0};
  const imported = !!data;
  if(!data && preset) data = applyPreset(hydrate(null), preset);
  TEAMS.list.push(t);
  if(data){ const s = JSON.stringify(hydrate(data)); t.players = data.roster.length; t.bytes = s.length; await Store.set(t.key, s); }
  await saveIndex();
  await switchTeam(id, imported ? "Added as a new team: "+t.name : "Added "+t.name);
}
function renameTeam(id, name){
  const t = TEAMS.list.find(x => x.id === id); if(!t) return;
  t.name = String(name).trim().slice(0,40) || t.name; saveIndex(); render(); toast("Renamed to "+t.name);
}
async function deleteTeam(id){
  const t = TEAMS.list.find(x => x.id === id);
  if(!t || TEAMS.list.length < 2) return;
  if(id === TEAMS.active){
    pauseClock(); clearTimeout(saveTimer);   /* don't write back the team being deleted */
    TEAMS.active = TEAMS.list.find(x => x.id !== id).id;
    S = hydrate(await readTeam(activeTeam()));
    resetView();
  }
  TEAMS.list = TEAMS.list.filter(x => x.id !== id);
  await Store.remove(t.key); await saveIndex();
  invalidate(); render(); toast("Deleted "+t.name);
}
async function eraseAllTeams(){
  pauseClock(); clearTimeout(saveTimer);
  for(const t of TEAMS.list) await Store.remove(t.key);
  await Store.remove(INDEX_KEY);
  TEAMS = freshTeams(); S = hydrate(null);
  resetView(); invalidate(); render(); toast("Erased");
}
/* one file with every team — the open one from memory, the rest from storage */
async function buildBackup(){
  const teams = [];
  for(const t of TEAMS.list) teams.push({name:t.name, data: t.id === TEAMS.active ? S : await readTeam(t)});
  return JSON.stringify({sideline:"backup", v:2, at:Date.now(), active:TEAMS.list.indexOf(activeTeam()), shared:TEAMS.shared, teams});
}
async function restoreTeams(o){
  pauseClock(); clearTimeout(saveTimer);
  for(const t of TEAMS.list) await Store.remove(t.key);
  TEAMS = {v:1, active:"t1", list:[], shared:Object.assign({}, o.shared || {})};
  for(let i=0;i<o.teams.length;i++){
    const src = o.teams[i] || {}, id = i === 0 ? "t1" : newTeamId();
    const t = {id, name:String(src.name || "Team "+(i+1)).slice(0,40), key: i === 0 ? KEY : "sideline-team-"+id};
    const data = hydrate(src.data && src.data.roster ? src.data : null), s = JSON.stringify(data);
    t.players = data.roster.length; t.bytes = s.length;
    TEAMS.list.push(t); await Store.set(t.key, s);
  }
  TEAMS.active = (TEAMS.list[o.active] || TEAMS.list[0]).id;
  await saveIndex();
  S = hydrate(await readTeam(activeTeam()));
  resetView(); invalidate(); render(); toast("Loaded "+TEAMS.list.length+(TEAMS.list.length === 1 ? " team" : " teams"));
}
function teamBar(id, always, compact){
  if(!always && TEAMS.list.length < 2) return "";
  if(compact) return '<button class="teambar compact" id="'+id+'"><span class="muted">Team ▸</span><b>'+esc(activeTeam().name)+'</b></button>';
  return '<button class="teambar" id="'+id+'"><span class="muted">Team</span><b>'+esc(activeTeam().name)+'</b>'+
    '<span class="muted">'+(TEAMS.list.length > 1 ? "Switch" : "Add a team")+' ▸</span></button>';
}
function openTeams(){
  const body = '<div class="lulist">'+TEAMS.list.map(t => {
      const cur = t.id === TEAMS.active, n = cur ? S.roster.length : (t.players || 0);
      return '<button data-team="'+t.id+'"'+(cur ? ' style="border-color:var(--on)"' : '')+'><b>'+esc(t.name)+'</b>'+
        '<span class="muted">'+n+(n === 1 ? ' player' : ' players')+'</span>'+
        '<span class="muted" style="flex:none">'+(cur ? "Open" : "Switch")+'</span></button>';
    }).join("")+'</div>'+
    '<div class="muted" style="margin:6px 0 4px">Add a team</div>'+
    '<input type="text" id="team-new" maxlength="40" placeholder="U10 Blue, Saturday rec…">'+
    '<select id="team-sport" style="margin-top:8px" aria-label="Sport">'+PRESETS.map(p => '<option value="'+p.id+'"'+(p.id === currentPreset() ? " selected" : "")+'>'+esc(p.label)+'</option>').join("")+'</select>'+
    '<div class="muted" style="margin-top:8px">Each team has its own roster, settings, minutes and history. Rename or delete teams on Setup.</div>';
  modal("Teams", body, "Add team", ()=>{

    if(!v){ toast("Type a name for the new team"); return false; }

  }, "Close");
  document.querySelectorAll("#modalbody [data-team]").forEach(el => el.addEventListener("click", ()=>{
    const id = el.dataset.team; closeModal(); switchTeam(id);
  }));

/* ---------------- clock ---------------- */
function periodElapsed(){
  const g=S.game;
  let e = g.base + (g.running ? (Date.now()-g.startedAt)/1000 : 0);
  /* with extra time on, the clock runs past full time until the coach ends the period */
  return S.settings.extraTime === false ? Math.min(e, S.settings.periodLen*60) : e;
}
function inExtraTime(){
  const g = S.game;
  return S.settings.extraTime !== false && !g.periodOver && !g.onBreak && periodElapsed() >= S.settings.periodLen*60;
}
function gameElapsed(){ return S.game.priorTotal + periodElapsed(); }
function periodRemaining(){ return Math.max(0, S.settings.periodLen*60 - periodElapsed()); }
function shiftRemaining(){ return S.settings.shiftLen*60 - (gameElapsed() - S.game.shiftStart); }
function fmt(sec){ sec = Math.max(0, Math.floor(sec)); return Math.floor(sec/60) + ":" + String(sec%60).padStart(2,"0"); }
function fmt2(sec){ sec = Math.max(0, Math.floor(sec)); return String(Math.floor(sec/60)).padStart(2,"0") + ":" + String(sec%60).padStart(2,"0"); }
function mins(sec){ return (Math.max(0,sec)/60).toFixed(1); }

/* ---------------- derived time & stats ---------------- */
function computeMatchScore(){
  let us = 0, them = 0, usShots = 0, usSOG = 0, themShots = 0, themSOG = 0;
  for(const e of S.game.log){
    if(e.type === "GOAL"){ us++; usSOG++; usShots++; }
    if(e.type === "SOG"){ usSOG++; usShots++; }
    if(e.type === "SHOT"){ usShots++; }
    if(e.type === "OPP_GOAL"){ them++; themSOG++; themShots++; }
    if(e.type === "OPP_SOG"){ themSOG++; themShots++; }
    if(e.type === "OPP_SHOT"){ themShots++; }
    if(e.type === "P1" || e.type === "P2" || e.type === "P3") us += +e.type[1];
    if(e.type === "OPP_P1" || e.type === "OPP_P2" || e.type === "OPP_P3") them += +e.type[5];
  }
  return {us, them, usShots, usSOG, themShots, themSOG};
}

/* compute() replays the whole log, and the render path asks for it dozens of times.
   Cache it against everything that can change the answer: the log, the roster, manual
   adjustments, and the clock (bucketed, so live minutes still tick). */
let _stCache = null, _stKey = "", _stGen = 0;
function invalidate(){ _stGen++; _stCache = null; }
function computeKey(){
  const adj = S.game.adj || {};
  let a = 0; for(const k in adj) for(const b in adj[k]) a += adj[k][b];
  return _stGen+"|"+S.game.log.length+"|"+S.roster.length+"|"+Math.floor(gameElapsed()*5)+"|"+a;
}
function compute(){
  const k = computeKey();
  if(_stCache && _stKey === k) return _stCache;
  _stCache = _compute(); _stKey = k; return _stCache;
}
function _compute(){
  const now = gameElapsed();
  const st = {};
  S.roster.forEach(p => st[p.id] = {GK:0,DEF:0,MID:0,FWD:0,total:0,onBand:null,onPos:null,onSince:null,lastOff:null,
                                    n:{GK:0,DEF:0,MID:0,FWD:0}, nTotal:0, pos:{}, np:{},
                                    goals:0, assists:0, saves:0, ga:0, yellows:0, reds:0, sinBinEnd:0, shots:0, sog:0,
                                    points:0, rebounds:0, steals:0, fouls:0, gb:0, pim:0, greens:0});
  const open = {};
  const close = (pid,gt) => {
    const o = open[pid]; if(!o) return;
    if(st[pid]) {
      const d = Math.max(0, gt-o.start);
      st[pid][o.band] += d; if(o.pos) st[pid].pos[o.pos] = (st[pid].pos[o.pos]||0) + d;
      st[pid].lastOff = gt;
    }
    delete open[pid];
  };
  /* moving along the back line is a new position, but not a new trip into defense */
  const enter = (pid, band, pos, was) => {
    if(!st[pid]) return;
    if(!was || was.band !== band){ st[pid].n[band]++; st[pid].nTotal++; }
    if(pos && (!was || was.pos !== pos)) st[pid].np[pos] = (st[pid].np[pos]||0) + 1;
  };
  
  for(const e of S.game.log){
    if(e.type==="ON"){ close(e.playerId, e.gt); open[e.playerId] = {band:e.band, pos:e.pos||null, start:e.gt}; enter(e.playerId, e.band, e.pos, null); }
    else if(e.type==="OFF"){ close(e.playerId, e.gt); }
    else if(e.type==="MOVE"){ const was = open[e.playerId]; close(e.playerId, e.gt); open[e.playerId] = {band:e.band, pos:e.pos||null, start:e.gt}; enter(e.playerId, e.band, e.pos, was); }
    else if(e.type==="GOAL" && st[e.playerId]){ st[e.playerId].goals++; st[e.playerId].sog++; st[e.playerId].shots++; }
    else if(e.type==="SOG" && st[e.playerId]){ st[e.playerId].sog++; st[e.playerId].shots++; }
    else if(e.type==="SHOT" && st[e.playerId]){ st[e.playerId].shots++; }
    else if(e.type==="ASSIST" && st[e.playerId]) st[e.playerId].assists++;
    else if(e.type==="SAVE" && st[e.playerId]) st[e.playerId].saves++;
    else if(e.type==="YELLOW" && st[e.playerId]){ st[e.playerId].yellows++; st[e.playerId].sinBinEnd = e.gt + ((S.settings.sinBinMins||5)*60); }
    else if(e.type==="RED" && st[e.playerId]) st[e.playerId].reds++;
    else if(e.type==="GA" && st[e.playerId]) st[e.playerId].ga++;
    /* other sports: field hockey's green card is two minutes; a penalty carries its own length and
       back-to-back penalties are served one after the other */
    else if(e.type==="GREEN" && st[e.playerId]){ st[e.playerId].greens++; st[e.playerId].sinBinEnd = Math.max(st[e.playerId].sinBinEnd, e.gt + 120); }
    else if(e.type==="PEN" && st[e.playerId]){ const r = st[e.playerId], secs = e.secs || 120; r.pim += secs; r.sinBinEnd = Math.max(r.sinBinEnd, e.gt) + secs; }
    else if(e.type==="GB" && st[e.playerId]) st[e.playerId].gb++;
    else if((e.type==="P1" || e.type==="P2" || e.type==="P3") && st[e.playerId]) st[e.playerId].points += +e.type[1];
    else if(e.type==="REB" && st[e.playerId]) st[e.playerId].rebounds++;
    else if(e.type==="STL" && st[e.playerId]) st[e.playerId].steals++;
    else if(e.type==="FOUL" && st[e.playerId]) st[e.playerId].fouls++;
  }
  for(const pid in open){
    const o = open[pid]; if(!st[pid]) continue;
    const d = Math.max(0, now-o.start);
    st[pid][o.band] += d; if(o.pos) st[pid].pos[o.pos] = (st[pid].pos[o.pos]||0) + d;
    st[pid].onBand = o.band; st[pid].onPos = o.pos; st[pid].onSince = o.start; st[pid].lastOff = null;
  }
  const adj = S.game.adj||{};
  for(const pid in adj){ if(!st[pid]) continue; for(const b of BANDS) st[pid][b] += (adj[pid][b]||0); }
  for(const pid in st){ const r=st[pid]; r.total = r.GK+r.DEF+r.MID+r.FWD; }
  return st;
}

/* Reads the per-game summaries, not the logs — older games' logs are trimmed, and reading
   them used to throw once a team had more than three past games. */
function computeSeasonStats(pid){
  const r = aggregate(seasonGames()).by[pid] || {}, z = k => r[k] || 0;
  return {goals:z("goals"), assists:z("assists"), saves:z("saves"), ga:z("ga"), yellows:z("yellows"), reds:z("reds"), shots:z("shots"), sog:z("sog")};
}

/* Timed suspensions: soccer's yellow-card sin bin is optional; every other sport's cards and
   penalties always put the player out for their time. */
function timedPenalties(){ return sportDef().id !== "soccer" || !!S.settings.ycSinBin; }
function isSinBin(pid){
  if(!timedPenalties()) return false;
  const p = byId(pid);
  if(!p || p.avail !== "available") return false;
  const r = compute()[pid];
  return !!r && r.sinBinEnd > gameElapsed();
}
/* out for the game: a red card, or in basketball a foul-out when that option is on */
function isRedCarded(pid){
  const r = compute()[pid]; if(!r) return false;
  return r.reds > 0 || (!!sportDef().fouls && !!S.settings.foulOut && r.fouls >= (S.settings.foulLimit || 5));
}
function isStale(pid){
  if(!S.settings.advanced) return false;
  const p = byId(pid);
  if(!p || p.avail !== "available") return false;
  const r = compute()[pid];
  if(!r || r.onBand || isRedCarded(pid) || (timedPenalties() && r.sinBinEnd > gameElapsed())) return false;
  return (gameElapsed() - (r.lastOff !== null ? r.lastOff : 0)) >= (S.settings.staleWarn || 10) * 60;
}
function formation(){
  const sp = sportDef(), list = sp.formations[S.settings.teamSize] || sp.formations[sp.defaultSize];
  return list[Math.min(S.settings.formationIdx || 0, list.length-1)];
}
function slotsFor(band){ const f = formation(); return band==="GK" ? (f.gk?1:0) : band==="DEF" ? f.d : band==="MID" ? f.m : f.f; }
function available(p){ return p.avail === "available" && !isSinBin(p.id) && !isRedCarded(p.id); }
function eligible(p, band){ return !p || !p.elig || p.elig[band] !== false; }
function eligList(p){ return sportBands().filter(b => eligible(p,b)); }
/* soccer kids can all go in goal; in sports with goalie gear, the coach ticks who plays there */
function newElig(){ return Object.assign({}, sportDef().elig); }

/* Who is standing in which slot, band by band. Position comes from the log. Anyone without
   one (a game logged before positions existed), or whose position this formation doesn't
   have, takes the first open slot in their band; anyone past the band's size is extra. */
function fieldLayout(st){
  st = st || compute();
  const slots = {}, extra = {}, loose = [];
  BANDS.forEach(b => { slots[b] = posCodes(b, slotsFor(b)).map(() => null); extra[b] = []; });
  S.roster.forEach(p => {
    const r = st[p.id]; if(!r || !r.onBand) return;
    const i = r.onPos ? posCodes(r.onBand, slotsFor(r.onBand)).indexOf(r.onPos) : -1;
    if(i >= 0 && !slots[r.onBand][i]) slots[r.onBand][i] = p.id; else loose.push(p.id);
  });
  loose.forEach(id => { const b = st[id].onBand, i = slots[b].indexOf(null); if(i >= 0) slots[b][i] = id; else extra[b].push(id); });
  return {slots, extra};
}
function whereOn(pid, lay){
  lay = lay || fieldLayout();
  for(const b of BANDS){
    const i = lay.slots[b].indexOf(pid);
    if(i >= 0) return {band:b, i, code:slotPos(b, i)};
    if(lay.extra[b].indexOf(pid) >= 0) return {band:b, i:-1, code:null};
  }
  return null;
}
function whereName(w){ return w ? posName(w.code) || BANDNAME[w.band] : ""; }
/* Player cards on the pitch: wide enough for a first name, capped so three rows fit on a phone.
   The old caps (108 px cards, 56 px photos) made the field taller than the screen on a real
   Android phone. */
function pitchSize(widest){
  const inner = Math.max(240, (window.innerWidth || 390) - 44);
  const cw = Math.max(62, Math.min(92, Math.floor((inner - 6*(widest-1)) / widest)));
  const avs = Math.max(28, Math.min(40, Math.round(cw * 0.42)));
  return "--cw:"+cw+"px;--avs:"+avs+"px";
}
/* Bench cards narrow (46–80 px) so perRow of them share one line; photos no bigger than the field's */
function benchSize(perRow, pitchVars){
  const n = Math.max(1, perRow), inner = Math.max(240, (window.innerWidth || 390) - 24);
  const bw = Math.max(46, Math.min(80, Math.floor((inner - 4*(n-1)) / n)));
  return "--bw:"+bw+"px;--bavs:"+Math.min(parseInt(String(pitchVars).split("--avs:")[1]) || 40, bw - 8)+"px";
}
/* Then make the whole pitch fit on one screen, below whatever sits above it and above the
   selected-player bar if one is open. Runs after paintLive, because the stint times change the
   card height. Photos shrink first (not below 24 px); if that isn't enough the pitch goes tight —
   less padding, no band labels. Past that it scrolls rather than become unreadable. */
function fitPitch(viewId){
  const view = document.getElementById(viewId), main = document.querySelector("main");
  const pitch = view ? view.querySelector("#pitch") : null;
  if(!pitch || !main || !main.clientHeight) return;
  /* how far an element's bottom sits past the bottom of the screen, or past the selected-player bar */
  const bar = view.querySelector(".selbar"), bench = bar ? null : view.querySelector("#benchzone,#poolzone");
  const past = el => el.getBoundingClientRect().bottom - main.getBoundingClientRect().top + main.scrollTop
    - (main.clientHeight - 8 - (bar ? bar.offsetHeight + 12 : 0));
  /* tighten the spacing first, so the bench fits too; photos keep their size unless the pitch alone won't fit */
  if(past(bench || pitch) > 0) pitch.classList.add("tight");
  const over = past(pitch);
  if(over <= 0) return;
  const rows = pitch.querySelectorAll(".band").length || 1;
  const avs = parseFloat(pitch.style.getPropertyValue("--avs")) || 40;
  pitch.style.setProperty("--avs", Math.max(24, Math.floor(avs - over / rows)) + "px");
}

/* ---------------- events ---------------- */
function push(events, note){
  invalidate();
  const g = S.game; g.seq++; const gid = g.seq, t = Date.now(), gt = gameElapsed(), sh = g.shift;
  events.forEach(e => g.log.push(Object.assign({eid:uid(), g:gid, t, gt, sh, period:g.period}, e)));
  if(note) g.log.push({eid:uid(), g:gid, t, gt, sh, period:g.period, type:"NOTE", note});
  save();
}
/* Undo says what it undid, so a coach who tapped it by mistake knows what to redo. Undoing the
   end of a period puts the game back in that period, but only before the next one has started. */
function undoLast(){
  const log = S.game.log; if(!log.length){ toast("Nothing to undo"); return; }
  const gid = log[log.length-1].g, group = log.filter(e => e.g === gid);
  const pe = group.find(e => e.type === "PERIOD_END");
  if(pe){
    const g = S.game;
    if(pe.base === undefined || g.running || (!g.onBreak && !g.periodOver)){
      toast("The end of period "+pe.period+" can't be undone once the next period has started"); return;
    }
    if(!g.periodOver){ g.priorTotal -= pe.base; g.period = pe.period; }
    g.base = pe.base; g.periodOver = false; g.onBreak = false; g.shift = pe.shift; g.shiftStart = pe.shiftStart;
    g.next = null; g.warned = true; g.alerted = true; g.pausedAt = Date.now(); g.nagged = false;
    g.fullTime = pe.base >= S.settings.periodLen*60;
  }
  while(log.length && log[log.length-1].g === gid) log.pop();
  invalidate(); save(); render(); toast("Undid: "+describeGroup(group));
}
function describeGroup(evs){
  const nm = id => first(id), at = e => posName(e.pos) || BANDNAME[e.band] || "";
  const on = evs.filter(e => e.type === "ON"), off = evs.filter(e => e.type === "OFF"), mv = evs.filter(e => e.type === "MOVE");
  const pe = evs.find(e => e.type === "PERIOD_END"); if(pe) return "end of period "+pe.period;
  const LABEL = {GOAL:"goal", SOG:"shot on goal", SHOT:"shot", ASSIST:"assist", SAVE:"save", YELLOW:"yellow card", RED:"red card",
                 GA:"goal against", OPP_GOAL:"opponent goal", OPP_SOG:"opponent shot on goal", OPP_SHOT:"opponent shot", NOTE:"note",
                 GREEN:"green card", PEN:"penalty", GB:"ground ball", P1:"free throw", P2:"2-pointer", P3:"3-pointer", REB:"rebound", STL:"steal", FOUL:"foul",
                 OPP_P1:"opponent free throw", OPP_P2:"opponent 2-pointer", OPP_P3:"opponent 3-pointer"};
  const stat = evs.find(e => LABEL[e.type]);
  if(stat && !on.length && !mv.length) return LABEL[stat.type]+(stat.playerId && stat.type.indexOf("OPP_") !== 0 ? " — "+nm(stat.playerId) : "");
  if(on.length + off.length + mv.length > 2) return "shift change ("+on.length+" on, "+off.length+" off"+(mv.length ? ", "+mv.length+" moved" : "")+")";
  if(on.length === 1 && off.length === 1) return nm(on[0].playerId)+" on for "+nm(off[0].playerId);
  if(mv.length === 2) return nm(mv[0].playerId)+" and "+nm(mv[1].playerId)+" switching";
  if(mv.length === 1) return nm(mv[0].playerId)+" to "+at(mv[0]);
  if(on.length === 1) return nm(on[0].playerId)+" on at "+at(on[0]);
  if(off.length === 1) return nm(off[0].playerId)+" off";
  return "last change";
}
/* the number the next shift will really get — beginNewShift doesn't burn a number on an empty shift */
function upcomingShift(){ const cur = S.game.shift; return S.game.log.some(e => (e.sh||1) === cur) ? cur + 1 : cur; }
function beginNewShift(){
  /* don't burn a shift number on a shift that never recorded anything — it leaves
     gaps in the history that read like lost data */
  const cur = S.game.shift;
  if(S.game.log.some(e => (e.sh||1) === cur)) S.game.shift++;
  resetShiftClock(); S.game.next = null; S.game.planCleared = false;
}
function resetShiftClock(){ S.game.shiftStart = gameElapsed(); S.game.warned = false; S.game.alerted = false; }

/* ---------------- the next shift ---------------- */
/* The coach shouldn't have to remember to plan. Whenever there's a live lineup and
   no plan yet, quietly build one so the buzzer is always one tap from acted on. */
function maybeAutoPlan(){
  if(!S.settings.autoPlan || S.game.planCleared) return;
  if(!S.game.log.length || nextCount()) return;
  const st = compute();
  if(!S.roster.some(p => st[p.id].onBand)) return;
  autoFillNext();
}
/* ---------------- saved lineups ---------------- */
/* slots are saved by index, with gaps, so each player comes back in the same position */
function currentArrangement(){
  const lay = fieldLayout(), out = {};
  let any = false;
  BANDS.forEach(b => {
    out[b] = lay.slots[b].slice();
    if(out[b].some(Boolean)) any = true;
  });
  if(!any){ /* nothing on the field — fall back to whatever is planned */
    const n = ensureNext(); let planned = false;
    BANDS.forEach(b => { out[b] = n[b].slice(); if(out[b].some(Boolean)) planned = true; });
    if(!planned) return null;
  }
  return out;
}
/* From Field this saves who is on the field. From Next (fromPlan) it saves the plan as it will go
   on — planned spots plus anyone holding theirs — so the lineup the coach built is what's saved. */
function saveLineup(name, fromPlan){
  let arr = null;
  if(fromPlan){
    const res = resolvePlan();
    if(BANDS.some(b => res[b].some(Boolean))){ arr = {}; BANDS.forEach(b => { arr[b] = res[b].slice(); }); }
  }
  if(!arr) arr = currentArrangement();
  if(!arr){ toast("Put a lineup on the field or in the plan first"); return false; }
  S.lineups.unshift({id:uid(), name:name, at:Date.now(), size:S.settings.teamSize,
                     form:S.settings.formationIdx, slots:arr, sport:sportDef().id});
  S.lineups = S.lineups.slice(0,12);
  save(); return true;
}
/* Loading writes into the plan rather than the field, so you always get to look at it before it
   goes on. A spot the lineup can't fill — a player who isn't here, has left the roster, or a lineup
   saved with a gap — used to stay open; now the fairest available player takes it, and the toast
   says who. Mid-game, a spot someone is already standing in stays theirs, like any empty plan slot. */
function loadLineup(id){
  const L = S.lineups.find(x => x.id === id); if(!L) return;
  if(L.size !== S.settings.teamSize || L.form !== S.settings.formationIdx){
    S.settings.teamSize = L.size; S.settings.formationIdx = L.form;
  }
  S.game.next = null; S.game.planCleared = false;
  const n = ensureNext(), away = [];
  let placed = 0;
  BANDS.forEach(b => {
    (L.slots[b] || []).forEach((pid, idx) => {
      if(!pid) return;
      const p = byId(pid);
      if(!p || !available(p)){ if(p) away.push(first(pid)); return; }
      const i = n[b][idx] === null ? idx : n[b].indexOf(null);
      if(i < 0) return;
      n[b][i] = pid; placed++;
    });
  });
  const filled = fillOpenSpots(), open = openPlanSpots();
  save();
  const parts = [placed+" from the lineup"];
  if(away.length) parts.push(away.join(", ")+(away.length === 1 ? " isn't" : " aren't")+" available");
  if(filled.length) parts.push(filled.slice(0, 2).map(f => f.who+" in at "+f.at).join(", ")+(filled.length > 2 ? " and "+(filled.length-2)+" more" : ""));
  if(open) parts.push(open+(open === 1 ? " spot" : " spots")+" still open, nobody else available");
  toast(parts.join(" · "));
}
/* Plan spots that would go on empty (nothing planned, nobody standing there) get the fairest
   available player not already in the lineup: eligible for that band first, then fewest minutes. */
function fillOpenSpots(){
  const st = compute(), n = ensureNext(), res = resolvePlan(), used = {}, owed = seasonOwed(), filled = [];
  BANDS.forEach(b => res[b].forEach(id => { if(id) used[id] = 1; }));
  BANDS.forEach(b => res[b].forEach((id, i) => {
    if(id) return;
    const pick = S.roster.filter(p => available(p) && !used[p.id]).sort((a, c) =>
      (eligible(c, b) - eligible(a, b)) ||
      ((st[a.id].total - (owed[a.id]||0)) - (st[c.id].total - (owed[c.id]||0))) ||
      ((parseInt(a.number)||99) - (parseInt(c.number)||99)))[0];
    if(!pick) return;
    n[b][i] = pick.id; used[pick.id] = 1;
    filled.push({who:first(pick.id), at:posName(slotPos(b, i)) || BANDNAME[b]});
  }));
  return filled;
}
function openPlanSpots(){ const res = resolvePlan(); return BANDS.reduce((a, b) => a + res[b].filter(x => !x).length, 0); }

/* ---------------- pre-game check-in ---------------- */
let checkIn = null;
function openCheckIn(){
  checkIn = {};
  S.roster.forEach(p => checkIn[p.id] = p.avail === "available");
  drawCheckIn();
}
function drawCheckIn(){
  const here = S.roster.filter(p => checkIn[p.id]).length;
  const body =
    '<div class="muted" style="margin-bottom:8px">Tap anyone who is not here. '+here+' of '+S.roster.length+' available.</div>'+
    '<div class="row" style="margin-bottom:10px"><button class="btn ghost" id="ci-all">Everyone is here</button>'+
    '<button class="btn ghost" id="ci-none">Nobody yet</button></div>'+
    S.roster.map(p =>
      '<button class="cirow'+(checkIn[p.id]?" on":"")+'" data-ci="'+p.id+'">'+
        avatar(p)+'<span class="nm">'+esc(p.name)+'</span>'+
        '<span class="tag">'+(checkIn[p.id]?"Here":"Out")+'</span></button>').join("");
  modal("Who is here?", body, "Save ("+here+" available)", ()=>{
    S.roster.forEach(p => { p.avail = checkIn[p.id] ? "available" : "out"; });
    invalidate(); save(); render(); toast(here+" players available");
  });
  document.querySelectorAll("#modalbody [data-ci]").forEach(el => el.addEventListener("click", ()=>{
    checkIn[el.dataset.ci] = !checkIn[el.dataset.ci]; drawCheckIn();
  }));
  document.getElementById("ci-all").addEventListener("click", ()=>{ S.roster.forEach(p=>checkIn[p.id]=true); drawCheckIn(); });
  document.getElementById("ci-none").addEventListener("click", ()=>{ S.roster.forEach(p=>checkIn[p.id]=false); drawCheckIn(); });
}

function bestReplacement(band, excludeId){
  const st = compute();
  return S.roster.filter(p => p.id !== excludeId && !st[p.id].onBand && available(p) && eligible(p, band))
    .sort((a,b) => {
      if(st[a.id].total !== st[b.id].total) return st[a.id].total - st[b.id].total;
      return (parseInt(a.number)||99) - (parseInt(b.number)||99);
    })[0];
}
/* Somebody went down. Get them off first, then offer the fairest replacement. */
function pullPlayer(pid, reason){
  const st = compute(), band = st[pid].onBand;
  if(!band) return;
  const w = whereOn(pid), pos = w ? w.code : null, where = whereName(w);
  push([{type:"OFF", playerId:pid}]);
  const sub = bestReplacement(band, pid);
  render();
  if(!sub){ toast(first(pid)+" off — nobody available to come on"); return; }
  modal(reason || "Player off",
    '<div style="font-size:15px"><b>'+esc(first(pid))+'</b> is off at '+esc(where)+'.<br><br>'+
    'Bring on <b>'+esc(sub.name)+'</b>? <span class="muted">('+fmt(st[sub.id].total)+' played — least of anyone available)</span></div>',
    "Bring "+first(sub.id)+" on",
    ()=>{ push([{type:"ON", playerId:sub.id, band, pos}]); render(); toast(first(sub.id)+" on at "+where); },
    "Leave the spot open");
}
function ensureNext(){
  const n = S.game.next || {};
  BANDS.forEach(b => {
    const k = slotsFor(b); n[b] = (n[b] || []).slice(0, k).map(id => byId(id) ? id : null);
    while(n[b].length < k) n[b].push(null);
  });
  S.game.next = n; return n;
}
function nextSlotOf(pid){
  const n = ensureNext();
  for(const b of BANDS){ const i = n[b].indexOf(pid); if(i >= 0) return {band:b, i}; }
  return null;
}
function nextCount(){ return BANDS.reduce((a,b) => a + ensureNext()[b].filter(Boolean).length, 0); }
function planInto(pid, band, i){
  const n = ensureNext(), was = nextSlotOf(pid), sitting = n[band][i];
  n[band][i] = pid;
  if(was) n[was.band][was.i] = (was.band === band && was.i === i) ? null : (sitting || null);
  save();
}
function planClear(pid){ const was = nextSlotOf(pid); if(was){ S.game.next[was.band][was.i] = null; save(); } }
/* An empty slot in the plan means whoever stands in that exact position now stays there.
   Anyone whose position was planned over, and who isn't planned anywhere else, slides into
   the next empty slot in the same band if there is one, and otherwise comes off. */
function resolvePlan(){
  const lay = fieldLayout(), n = ensureNext(), planned = {}, out = {};
  BANDS.forEach(b => n[b].forEach(id => { if(id) planned[id] = 1; }));
  BANDS.forEach(b => {
    const staying = id => (id && !planned[id]) ? id : null;
    out[b] = n[b].map((id, i) => id || staying(lay.slots[b][i]));
    const spare = lay.slots[b].concat(lay.extra[b]).filter(id => staying(id) && out[b].indexOf(id) < 0);
    out[b] = out[b].map(id => id || spare.shift() || null);
  });
  return out;
}
function planDiff(){
  const st = compute(), lay = fieldLayout(st), res = resolvePlan(), keep = {}, ev = [];
  BANDS.forEach(b => res[b].forEach((id, i) => { if(id) keep[id] = {band:b, pos:slotPos(b, i)}; }));
  S.roster.forEach(p => { if(st[p.id].onBand && !keep[p.id]) ev.push({type:"OFF", playerId:p.id}); });
  Object.keys(keep).forEach(id => {
    const k = keep[id], cur = whereOn(id, lay);
    if(!cur) ev.push({type:"ON", playerId:id, band:k.band, pos:k.pos});
    else if(cur.band !== k.band || cur.code !== k.pos) ev.push({type:"MOVE", playerId:id, band:k.band, pos:k.pos});
  });
  return ev;
}
/* ---------------- hockey lines ---------------- */
/* Hockey changes whole lines, not single players. The coach sets forward lines and defense pairs, or
   lets the app build them from the roster. Auto-fill sends out the line and the pair that have played
   least, keeps the goalie in, and gives a hole left by an absent or penalized player to the
   least-played skater who isn't on the ice. Mix lines turns this off: auto-fill then picks
   individuals, as in every other sport. */
function lineBands(){ return ["FWD","DEF"].filter(b => slotsFor(b) > 0); }
function usesLines(){ return !!sportDef().lines && !S.settings.mixLines; }
function ensureLines(){
  const L = S.lines = (S.lines && typeof S.lines === "object") ? S.lines : {}, seen = {};
  lineBands().forEach(b => {
    const k = slotsFor(b);
    L[b] = (Array.isArray(L[b]) ? L[b] : []).map(line => {
      const x = (Array.isArray(line) ? line : []).slice(0, k).map(id => byId(id) ? id : null);
      while(x.length < k) x.push(null);
      return x;
    });
  });
  /* a player belongs to one line or pair */
  lineBands().forEach(b => L[b].forEach(line => line.forEach((id, i) => { if(!id) return; if(seen[id]) line[i] = null; else seen[id] = 1; })));
  return L;
}
function linesEmpty(){ const L = ensureLines(); return !lineBands().some(b => L[b].some(line => line.some(Boolean))); }
/* As many lines and pairs as the roster fills with the fewest holes, keeping the counts within one of
   each other: 13 skaters make three lines and two pairs, 10 make two of each. */
function buildLines(){
  const f = slotsFor("FWD"), d = slotsFor("DEF"), L = S.lines = {};
  const byNum = (a, b) => (parseInt(a.number)||99) - (parseInt(b.number)||99);
  const pool = S.roster.filter(p => eligible(p, "FWD") || eligible(p, "DEF")).sort(byNum), n = pool.length;
  let best = null;
  for(let nd = d ? 1 : 0; nd <= (d ? Math.max(1, Math.ceil(n / d)) : 0); nd++){
    const nf = f ? Math.max(1, Math.ceil(Math.max(0, n - nd * d) / f)) : 0;
    if(d && f && Math.abs(nf - nd) > 1) continue;
    const holes = nf * f + nd * d - n;
    if(!best || holes < best.holes || (holes === best.holes && nf > best.nf)) best = {nd, nf, holes};
  }
  if(!best) best = {nd: d ? 1 : 0, nf: f ? 1 : 0};
  const needD = best.nd * d, needF = best.nf * f;
  const dOnly = pool.filter(p => eligible(p, "DEF") && !eligible(p, "FWD")), fOnly = pool.filter(p => eligible(p, "FWD") && !eligible(p, "DEF"));
  const both = pool.filter(p => eligible(p, "FWD") && eligible(p, "DEF"));
  const dAll = dOnly.slice(0, needD);
  const keepForF = Math.min(both.length, Math.max(0, needF - fOnly.length));
  both.slice(0, Math.max(0, both.length - keepForF)).forEach(p => { if(dAll.length < needD) dAll.push(p); });
  const fAll = pool.filter(p => dAll.indexOf(p) < 0);
  while(dAll.length < needD && fAll.length > needF) dAll.push(fAll.pop());
  const chunk = (list, size, count) => Array.from({length:count}, (_, i) => {
    const line = list.slice(i * size, (i + 1) * size).map(p => p.id); while(line.length < size) line.push(null); return line; });
  if(d) L.DEF = chunk(dAll, d, best.nd);
  if(f) L.FWD = chunk(fAll, f, best.nf);
  save();
}
function autoFillLines(){
  const st = compute(), lay = fieldLayout(st), n = ensureNext();
  BANDS.forEach(b => n[b] = n[b].map(() => null));
  if(linesEmpty()) buildLines();
  const L = ensureLines(), now = gameElapsed(), used = {};
  const left = Math.max(0, Math.min((S.settings.shiftLen || 1) * 60 - (now - S.game.shiftStart), periodRemaining()));
  const total = id => st[id].total + (st[id].onBand ? left : 0);
  const ok = id => { const p = id && byId(id); return !!p && available(p) && !used[id]; };
  /* the goalie stays in unless Switch goalie each shift is on */
  if(slotsFor("GK")){
    const keeper = lay.slots.GK[0], rotate = S.settings.rotateKeeper !== false;
    let g = (!rotate && ok(keeper)) ? keeper : null;
    if(!g){
      const gk = S.roster.filter(p => ok(p.id) && eligible(p, "GK"))
        .sort((a, c) => ((a.id === keeper) - (c.id === keeper)) || (st[a.id].GK - st[c.id].GK))[0];
      g = gk ? gk.id : (ok(keeper) ? keeper : null);
    }
    if(g){ n.GK[0] = g; used[g] = 1; }
  }
  lineBands().forEach(b => {
    const k = slotsFor(b);
    const cands = L[b].map((line, idx) => ({idx, line, live: line.filter(ok)})).filter(c => c.live.length);
    if(cands.length){
      const avg = c => c.live.reduce((a, id) => a + total(id), 0) / c.live.length;
      const onIce = c => c.live.filter(id => st[id].onBand).length;
      cands.sort((a, c) => (avg(a) - avg(c)) || (onIce(a) - onIce(c)) || (a.idx - c.idx));
      cands[0].line.forEach((id, i) => { if(i < k && ok(id)){ n[b][i] = id; used[id] = 1; } });
    }
    for(let i = 0; i < k; i++){
      if(n[b][i]) continue;
      const sub = S.roster.filter(p => ok(p.id)).sort((a, c) =>
        ((!!st[a.id].onBand) - (!!st[c.id].onBand)) || (eligible(c, b) - eligible(a, b)) || (total(a.id) - total(c.id)))[0];
      if(sub){ n[b][i] = sub.id; used[sub.id] = 1; }
    }
  });
  save();
}
let lineSel = null;
function openLines(){
  /* the first time, start from lines built from the roster rather than an empty screen */
  if(linesEmpty() && S.roster.length) buildLines();
  const L = ensureLines(), bands = lineBands(), where = {};
  if(lineSel && !(L[lineSel.b] && L[lineSel.b][lineSel.li])) lineSel = null;
  bands.forEach(b => L[b].forEach((line, li) => line.forEach(id => { if(id) where[id] = (b === "FWD" ? "Line " : "Pair ")+(li+1); })));
  let body = '<div class="muted" style="margin-bottom:8px">Auto-fill sends out the line and the pair that have played least. Tap a spot, then the player for it.</div>';
  bands.forEach(b => {
    const codes = posCodes(b, slotsFor(b)), word = b === "FWD" ? "Line" : "Pair";
    body += '<h3 style="margin:10px 0 4px">'+(b === "FWD" ? "Forward lines" : "Defense pairs")+'</h3>'+
      L[b].map((line, li) => '<div class="linerow"><span class="lpos">'+word+' '+(li+1)+'</span>'+line.map((id, si) => {
        const on = lineSel && lineSel.b === b && lineSel.li === li && lineSel.si === si;
        return '<button class="lslot'+(on ? " sel" : "")+(id ? "" : " empty")+'" data-ls="'+b+'|'+li+'|'+si+'">'+(id ? esc(first(id)) : '+ '+esc(codes[si]))+'</button>'; }).join("")+'</div>').join("")+
      '<div class="row" style="margin:4px 0 6px"><button class="btn ghost" data-ladd="'+b+'">Add '+(b === "FWD" ? "a line" : "a pair")+'</button>'+
      (L[b].length ? '<button class="btn ghost" data-ldrop="'+b+'">Remove the last</button>' : '')+'</div>';
  });
  if(lineSel){
    const pool = S.roster.slice().sort((a, c) => ((!!where[a.id]) - (!!where[c.id])) || (eligible(c, lineSel.b) - eligible(a, lineSel.b)) || ((parseInt(a.number)||99) - (parseInt(c.number)||99)));
    body += '<h3 style="margin:12px 0 4px">Who goes there?</h3><div class="lulist"><button data-lpick=""><b>Leave it empty</b></button>'+
      pool.map(p => '<button data-lpick="'+p.id+'">'+avatar(p)+'<b>'+esc(p.name)+'</b><span class="muted" style="flex:none">'+
        (where[p.id] ? esc(where[p.id]) : eligible(p, lineSel.b) ? "" : "not ticked for "+esc(BANDNAME[lineSel.b].toLowerCase()))+'</span></button>').join("")+'</div>';
  }
  body += '<button class="btn wide" id="l-build" style="margin-top:12px">Build lines from the roster</button>';
  modal("Lines", body, null, null, "Done");
  const again = () => { save(); openLines(); };
  document.querySelectorAll("#modalbody [data-ls]").forEach(el => el.addEventListener("click", ()=>{
    const [b, li, si] = el.dataset.ls.split("|");
    lineSel = (lineSel && lineSel.b === b && lineSel.li === +li && lineSel.si === +si) ? null : {b, li:+li, si:+si}; again();
  }));
  document.querySelectorAll("#modalbody [data-lpick]").forEach(el => el.addEventListener("click", ()=>{
    const pid = el.dataset.lpick, sel = lineSel; if(!sel) return;
    if(pid) bands.forEach(b => L[b].forEach(line => line.forEach((id, i) => { if(id === pid) line[i] = null; })));
    L[sel.b][sel.li][sel.si] = pid || null; lineSel = null; again();
  }));
  document.querySelectorAll("#modalbody [data-ladd]").forEach(el => el.addEventListener("click", ()=>{

  }));
