function autoFillNext(){
  if(usesLines()) return autoFillLines();
  const st = compute(), lay = fieldLayout(st), n = ensureNext();
  BANDS.forEach(b => n[b] = n[b].map(()=>null));
  const now = gameElapsed();
  /* Plan for the end of the shift, not this moment. Everyone on the field is counted as if they
     finish it, so at kickoff, when nobody has minutes yet, the plan already brings on the bench
     instead of keeping the starters on a tie. */
  const left = Math.max(0, Math.min((S.settings.shiftLen || 5) * 60 - (now - S.game.shiftStart), periodRemaining()));
  const total = id => st[id].total + (st[id].onBand ? left : 0);
  const inBand = (id, b) => st[id][b] + (st[id].onBand === b ? left : 0);
  const inPos = (id, pos) => (st[id].pos[pos] || 0) + (st[id].onPos === pos ? left : 0);

  const slots = [];
  BANDS.forEach(b => { for(let i=0;i<slotsFor(b);i++) slots.push({band:b, i, pos:slotPos(b, i)}); });
  const size = slots.length;
  if(!size){ save(); return; }

  /* onNow is the band each field player is in; cur is their exact slot, when they have one */
  const onNow = {}, cur = {};
  BANDS.forEach(b => {
    lay.slots[b].forEach((id, i) => { if(id){ onNow[id] = b; cur[id] = slots.find(s => s.band === b && s.i === i); } });
    lay.extra[b].forEach(id => { onNow[id] = b; });
  });

  /* locked = must stay on: anyone who still won't have had their minimum stint by the end of the
     shift, and the keeper when rotateKeeper is off. By default the goalie changes every shift. */
  const locked = {};
  const minS = S.settings.minStint || 0;
  const rotateKeeper = S.settings.rotateKeeper !== false;
  if(minS > 0) S.roster.forEach(p => {
    const r = st[p.id];
    if(r.onBand && available(p) && (now - r.onSince) + left < minS) locked[p.id] = r.onBand;
  });
  const keeper = S.roster.find(p => st[p.id].onBand === "GK");
  if(!rotateKeeper && slotsFor("GK") && keeper && available(keeper) && eligible(keeper,"GK")) locked[keeper.id] = "GK";
  /* with rotateKeeper on, nobody is held in goal just for standing there */
  const heldInGoal = (p, b) => b === "GK" && rotateKeeper && !locked[p.id];

  /* with seasonBalance on, a kid behind an even share over past games moves up the order */
  const season = (S.settings.seasonBalance && S.archive.length) ? seasonBalance() : null, owed = seasonOwed(season);
  const byMinutes = (a,b) => {
    const ta = total(a.id) - (owed[a.id]||0), tb = total(b.id) - (owed[b.id]||0);
    if(ta !== tb) return ta - tb;
    const la = st[a.id].lastOff == null ? -1 : st[a.id].lastOff, lb = st[b.id].lastOff == null ? -1 : st[b.id].lastOff;
    if(la !== lb) return la - lb;
    return (parseInt(a.number)||99) - (parseInt(b.number)||99);
  };

  /* A. pick the squad — locked players, then whoever has played least. A player joins only if the
     whole squad can still be placed where they're eligible; otherwise a full line change could
     bring on five forwards for three forward spots. Only if nobody eligible is left does the
     rest fill up regardless. */
  const fits = group => {
    const match = {};
    const place = (p, seen) => {
      for(let k = 0; k < slots.length; k++){
        const s = slots[k];
        if(seen[k] || !eligible(p, s.band) || (locked[p.id] && locked[p.id] !== s.band)) continue;
        seen[k] = true;
        if(!match[k] || place(match[k], seen)){ match[k] = p; return true; }
      }
      return false;
    };
    return group.every(p => place(p, {}));
  };
  const squad = S.roster.filter(p => locked[p.id]);
  const pool = S.roster.filter(p => available(p) && !locked[p.id]).sort(byMinutes);
  pool.forEach(p => { if(squad.length < size && fits(squad.concat([p]))) squad.push(p); });
  pool.forEach(p => { if(squad.length < size && squad.indexOf(p) < 0) squad.push(p); });
  /* someone in the squad has to be able to play in goal: swap the most-played unlocked pick for the
     least-played goalie-eligible player left out */
  if(slotsFor("GK") && !squad.some(p => eligible(p, "GK"))){
    const gk = pool.find(p => squad.indexOf(p) < 0 && eligible(p, "GK"));
    const drop = squad.slice().reverse().find(p => !locked[p.id]);
    if(gk && drop) squad[squad.indexOf(drop)] = gk;
  }

  /* B. hold everyone already on the field in the exact position they're standing in */
  const free = slots.slice(), spot = {};
  const claim = s => { const k = free.indexOf(s); if(k < 0) return false; free.splice(k,1); return true; };
  squad.forEach(p => {
    const b = locked[p.id] || onNow[p.id], c = cur[p.id];
    if(b && eligible(p,b) && c && c.band === b && !heldInGoal(p, b) && claim(c)) spot[p.id] = c;
  });
  squad.forEach(p => {
    const b = locked[p.id] || onNow[p.id];
    if(spot[p.id] || !b || !eligible(p,b) || heldInGoal(p, b)) return;
    const s = free.find(x => x.band === b); if(s && claim(s)) spot[p.id] = s;
  });
  /* Whoever is left is coming off the bench. With freshPositions on they go to the open
     position they've spent least time in — a kid who has only played left D gets right D or
     striker. Off, it evens out by band only. With the keeper rotating, goal goes to whoever has
     spent least time there; with the keeper held, goal is a last resort. Times are bucketed to
     30 s so a few seconds' difference doesn't override the next tiebreak. */
  const fresh = S.settings.freshPositions !== false, q = sec => Math.round((sec||0)/30);
  const cost = (p, s) => {
    const past = season && season.posAvg[p.id] ? (season.posAvg[p.id][s.pos] || 0) : 0;   /* avg per past game */
    return [eligible(p, s.band) ? 0 : 1, (s.band === "GK" && !rotateKeeper) ? 1 : 0,
            fresh ? q(inPos(p.id, s.pos) + past) : q(inBand(p.id, s.band)), fresh ? q(inBand(p.id, s.band)) : 0]; };
  const better = (a, b) => { for(let k=0;k<a.length;k++) if(a[k] !== b[k]) return a[k] < b[k]; return false; };
  const incoming = squad.filter(p => !spot[p.id]);
  /* Each step takes the cheapest pairing, but never one that lowers how many of the rest can still
     go somewhere they're eligible. Without that check, two kids ticked for goal could both be used
     outfield and goal left to someone who doesn't play it. With everyone eligible everywhere (soccer's
     default) no pairing is ever refused, so the result is the plain greedy one. */
  const maxEligible = (ps, ss) => {
    const match = ss.map(() => null);
    const take = (p, seen) => {
      for(let k = 0; k < ss.length; k++){
        if(seen[k] || !eligible(p, ss[k].band)) continue;
        seen[k] = true;
        if(match[k] === null || take(match[k], seen)){ match[k] = p; return true; }
      }
      return false;
    };
    return ps.reduce((n, p) => n + (take(p, {}) ? 1 : 0), 0);
  };
  while(incoming.length && free.length){
    const can = maxEligible(incoming, free), refused = new Set();
    let best = null, first = null;
    for(;;){
      best = null;
      incoming.forEach(p => free.forEach(s => {
        if(refused.has(p.id+"|"+s.band+"|"+s.i)) return;
        const c = cost(p, s); if(!best || better(c, best.c)) best = {p, s, c};
      }));
      if(!best) break;
      if(!first) first = best;
      const after = maxEligible(incoming.filter(x => x !== best.p), free.filter(x => x !== best.s)) + (eligible(best.p, best.s.band) ? 1 : 0);
      if(after >= can) break;
      refused.add(best.p.id+"|"+best.s.band+"|"+best.s.i);
    }
    best = best || first;
    claim(best.s); spot[best.p.id] = best.s; incoming.splice(incoming.indexOf(best.p), 1);
  }

  /* C. rotate front to back. maxSwitch null is no limit — every swap must even things out
     by more than two minutes, so the total keeps falling and this still settles. */
  let budget = S.settings.rotate ? (S.settings.maxSwitch == null ? Infinity : S.settings.maxSwitch) : 0;
  const held = () => squad.filter(p => onNow[p.id] && spot[p.id] && spot[p.id].band === onNow[p.id] && spot[p.id].band !== "GK");
  while(budget >= 2){
    let best = null;
    const hs = held();
    for(const a of hs) for(const b of hs){
      if(a.id === b.id) continue;
      const ba = spot[a.id].band, bb = spot[b.id].band;
      if(ba === bb) continue;
      if(!eligible(a,bb) || !eligible(b,ba)) continue;
      /* gain = how much more balanced both players get by trading places */
      const gain = (inBand(a.id, ba) - inBand(a.id, bb)) + (inBand(b.id, bb) - inBand(b.id, ba));
      if(gain > 120 && (!best || gain > best.gain)) best = {a, b, gain};
    }
    if(!best) break;
    const tmp = spot[best.a.id]; spot[best.a.id] = spot[best.b.id]; spot[best.b.id] = tmp;
    onNow[best.a.id] = spot[best.a.id].band; onNow[best.b.id] = spot[best.b.id].band;
    budget -= 2;
  }

  Object.keys(spot).forEach(pid => { const s = spot[pid]; n[s.band][s.i] = pid; });
  save();
}
function lastBandOf(pid){
  for(let i=S.game.log.length-1;i>=0;i--){
    const e = S.game.log[i];
    if(e.playerId===pid && (e.type==="ON"||e.type==="MOVE")) return e.band;
  }
  return null;
}
function nextUpIds(k){
  const st = compute(), owed = seasonOwed();
  return S.roster.filter(p => !st[p.id].onBand && available(p))
    .sort((a,b) => (st[a.id].total - (owed[a.id]||0)) - (st[b.id].total - (owed[b.id]||0))).slice(0,k).map(p => p.id);
}

/* ---------------- audio / haptics / wake ---------------- */
let actx = null;
function primeAudio(){
  try{
    if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state === "suspended") actx.resume();
    const o = actx.createOscillator(), g = actx.createGain();
    g.gain.value = 0; o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + 0.01);
  }catch(e){}
}
document.addEventListener("pointerdown", primeAudio, true);
function beep(freq, start, dur, vol){
  if(!actx) return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = "square"; o.frequency.value = freq;
  const t0 = actx.currentTime + start;
  g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(vol, t0+0.015);
  g.gain.setValueAtTime(vol, t0+dur-0.03); g.gain.linearRampToValueAtTime(0, t0+dur);
  o.connect(g); g.connect(actx.destination); o.start(t0); o.stop(t0+dur+0.02);
}
/* iOS Safari has no Vibration API, so vibration settings are hidden there rather than silently doing nothing */
function canVibrate(){ return typeof navigator.vibrate === "function"; }
function alarm(kind){
  if(S.settings.sound){
    primeAudio();
    if(kind === "warn") beep(660,0,.16,.25); 
    else for(let i=0;i<3;i++){ beep(880, i*.42, .18, .3); beep(660, i*.42+.2, .18, .3); }
  }
  if(S.settings.vibrate && navigator.vibrate) navigator.vibrate(kind==="warn" ? [120] : [200,90,200,90,350]);
  if(kind !== "warn"){
    const f = document.getElementById("flash");
    f.classList.remove("go"); void f.offsetWidth; f.classList.add("go");
  }
}
let wakeLock = null;
async function wake(on){
  try{
    if(on && "wakeLock" in navigator && !wakeLock){
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", ()=>{ wakeLock=null; });
    } else if(!on && wakeLock){ await wakeLock.release(); wakeLock=null; }
  }catch(e){ wakeLock = null; }
}
document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState === "visible"){ if(S.game.running) wake(true); tick(); render(); }
});

/* ---------------- clock control ---------------- */
function startClock(){
  if(S.game.periodOver){
    /* the game is over, unless it was saved mid-break by an older version or periods were added */
    if(S.game.period >= S.settings.periods){ promptNewGame(); return; }
    nextPeriod();
  }
  /* the first kickoff dates the game and records who was there */
  if(!S.game.date) S.game.date = Date.now();
  if(!S.game.present) S.game.present = S.roster.filter(available).map(p => p.id);
  S.game.running = true; S.game.startedAt = Date.now(); S.game.pausedAt = null; S.game.nagged = false; S.game.onBreak = false;
  if(!S.game.log.length && !S.game.shiftStart) resetShiftClock();
  wake(true); save(); render();
}
function stopClock(){
  if(S.game.running){ S.game.base = periodElapsed(); S.game.running = false; S.game.startedAt = null; S.game.pausedAt = Date.now(); }
  wake(false); save(); render();
}
function toggleClock(){ S.game.running ? stopClock() : startClock(); }
/* A period ending moves straight to the next one, clock stopped at 0:00, so START is all it
   takes to begin it — no trip to the Clock tab. Only the last period leaves the game over. */
function endPeriodNow(){
  stopClock();
  /* enough to put things back if this turns out to be a mis-tap — see undoLast */
  push([{type:"PERIOD_END", base:S.game.base, shift:S.game.shift, shiftStart:S.game.shiftStart}]); alarm("end");
  if(S.game.period < S.settings.periods){
    const ended = S.game.period; nextPeriod();
    const P = sportDef().period;
    toast(P+" "+ended+" is over. Tap START when "+P.toLowerCase()+" "+S.game.period+" begins.");
  } else { S.game.periodOver = true; save(); render(); toast("Game over"); }
}
/* Doesn't switch tabs when the buzzer ends a period on its own — the Field and Next tabs say
   what's happening instead. A coach who taps "Start period" on the clock screen lands on the lineup. */
function nextPeriod(toLineup){
  S.game.priorTotal += S.game.base; S.game.base = 0; S.game.period++; S.game.periodOver = false; S.game.pausedAt = null; S.game.onBreak = true; S.game.fullTime = false;
  beginNewShift(); save();
  if(S.settings.autoPlan){ maybeAutoPlan(); if(toLineup === true && nextCount()) activeTab = "next"; }
  render();
}

function tick(){
  invalidate();
  const g = S.game, s = S.settings;
  if(g.running && periodElapsed() >= s.periodLen*60 && !g.periodOver){
    if(s.extraTime === false){ endPeriodNow(); return; }
    /* the referee ends the period, not the app: buzz once at full time and keep counting */
    if(!g.fullTime){ g.fullTime = true; alarm("end"); save(); render(); toast("Time is up. The clock keeps running until you end "+sportDef().period.toLowerCase()+" "+g.period+"."); }
  }
  if(g.running && !g.periodOver){
    const rem = shiftRemaining(), guard = periodRemaining() <= 45;
    if(!g.warned && rem <= s.warnLead && rem > 0 && !guard && s.warnLead > 0){ g.warned = true; alarm("warn"); }
    if(!g.alerted && rem <= 0 && !guard){ g.alerted = true; alarm("end"); }
  }
  /* The most common way minutes go wrong is a clock left paused after a stoppage. Two minutes
     paused mid-period with players on the field gets one nudge and a pulsing START. Halftime
     doesn't count — nextPeriod clears pausedAt. */
  const idle = S.settings.pauseReminder !== false && !g.running && !g.periodOver && g.pausedAt &&
    (Date.now() - g.pausedAt) > 120000 && Object.values(compute()).some(r => r.onBand);
  document.getElementById("topbar").classList.toggle("paused", !!idle);
  if(idle && !g.nagged){ g.nagged = true; alarm("warn"); toast("The clock is still paused. Tap START when play restarts."); }
  /* Field offers Start a new shift once the shift clock runs out, so redraw when that flips */
  const shiftOut = !!g.log.length && shiftRemaining() <= 0;
  if(shiftOut !== _shiftOut){ _shiftOut = shiftOut; if(activeTab === "field" && !drag) render(); }
  checkSinBin();
  paintClocks(); paintLive();
}
let _shiftOut = false;
/* a sin bin that expires silently is useless — watch for it and say so */
let _binWatch = {};
function checkSinBin(){
  if(!timedPenalties()) return;
  const st = compute(), now = gameElapsed(), freed = [];
  S.roster.forEach(p => {
    const end = st[p.id] ? st[p.id].sinBinEnd : 0;
    if(!end || p.avail !== "available") return;
    if(end > now){ _binWatch[p.id] = end; }
    else if(_binWatch[p.id]){ delete _binWatch[p.id]; freed.push(p); }
  });
  if(freed.length){
    alarm("warn");
    toast(freed.map(p => p.name.split(" ")[0]).join(", ") + (freed.length>1 ? " are" : " is") + " available again");
    render();
  }
}
function paintClocks(){
  const s = S.settings;
  document.getElementById("tb-clock").textContent = fmt2(periodElapsed());
  const P = sportDef().period;
  document.getElementById("tb-period").textContent = S.game.periodOver ? (S.game.period >= s.periods ? "Game over" : P + " " + S.game.period + " over")
    : S.game.onBreak ? P + " " + S.game.period + " ready" : P + " " + S.game.period + " of " + s.periods;
  /* in extra time the shift countdown is noise, so that corner counts the extra time instead */
  const xt = inExtraTime(), extra = "+" + fmt(periodElapsed() - s.periodLen*60);
  document.querySelectorAll("[data-extra]").forEach(el => el.textContent = extra);
  const rem = shiftRemaining();
  document.getElementById("tb-shiftval").textContent = xt ? extra : (rem<0?"+":"") + fmt(Math.abs(rem));
  document.getElementById("tb-shiftlab").textContent = xt ? "extra time" : "shift left";
  document.getElementById("tb-go").textContent = S.game.running ? "PAUSE" : "START";
  document.getElementById("tb-go").classList.toggle("running", S.game.running);
  document.getElementById("topbar").classList.toggle("over", rem <= 0 || xt);
  
  const sc = computeMatchScore();
  document.getElementById("sc-us").textContent = sc.us;
  document.getElementById("sc-them").textContent = sc.them;

  const bc = document.getElementById("big-clock");
  if(bc){
    bc.textContent = fmt2(periodElapsed());
    const br = document.getElementById("big-shift"); if(br) br.textContent = xt ? "–" : (rem<0?"+":"") + fmt(Math.abs(rem));
    const bp = document.getElementById("big-left"); if(bp) bp.textContent = inExtraTime() ? extra + " extra time" : fmt(periodRemaining()) + " left";
  }
}
function paintLive(){
  const st = compute();
  document.querySelectorAll("[data-live]").forEach(el => {
    const [pid, what] = el.dataset.live.split("|"); const r = st[pid]; if(!r) return;
    if(what === "stint") el.textContent = r.onBand ? fmt(gameElapsed()-r.onSince) : "";
    else el.textContent = fmt(r[what] === undefined ? r.total : r[what]);
  });
  document.querySelectorAll("[data-livec]").forEach(el => {
    const [pid, what] = el.dataset.livec.split("|"); const r = st[pid]; if(!r) return;
    const c = what === "total" ? r.nTotal : r.n[what]; el.textContent = c ? "×"+c : "";
  });
}

  {id:"next", label:"Next", icon:'<path d="M4 12h13"/><path d="M12 7l5 5-5 5"/><path d="M20 5v14"/>'},
  {id:"times", label:"Minutes", icon:'<path d="M4 6h16M4 12h16M4 18h10"/>'},
  {id:"log", label:"History", icon:'<path d="M4 5h16v14H4z"/><path d="M8 9h8M8 13h5"/>'},
  {id:"roster", label:"Roster", icon:'<circle cx="9" cy="9" r="3"/><path d="M4 19c0-2.8 2.2-5 5-5s5 2.2 5 5"/><path d="M16 8h5M18.5 5.5v5"/>'},
  {id:"setup", label:"Setup", icon:'<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/>'}
];
/* Six tabs, so the labels can be big enough to hit with cold hands. The clock screen opens from
   the clock in the top bar, and Help from Setup; both have a Back link. */
const VIEWS = ["field","next","clock","times","log","roster","help","setup"];
let activeTab = "field", lastTab = "field";
function buildTabs(){
  const nav = document.getElementById("tabs");
  nav.innerHTML = TABS.map(t => '<button data-tab="'+t.id+'"><svg viewBox="0 0 24 24">'+t.icon+'</svg>'+t.label+'</button>').join("");
  nav.querySelectorAll("button").forEach(b => b.addEventListener("click", ()=>{ activeTab = lastTab = b.dataset.tab; selected = null; nextSel = null; render(); document.querySelector("main").scrollTop = 0; }));
}
function paintTabs(){
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("active", b.dataset.tab === activeTab || (activeTab === "help" && b.dataset.tab === "setup")));
  /* Field is Ice or Court in those sports; the view id stays "field" */
  const fb = document.querySelector('#tabs button[data-tab="field"]');
  if(fb && fb.lastChild && fb.lastChild.nodeType === 3) fb.lastChild.textContent = sportDef().tab;
  VIEWS.forEach(id => document.getElementById("v-"+id).classList.toggle("active", id === activeTab));
}
function openView(id){
  if(activeTab !== "clock" && activeTab !== "help") lastTab = activeTab;
  activeTab = id; selected = null; nextSel = null; render(); document.querySelector("main").scrollTop = 0;
}
function goBack(){ activeTab = (lastTab === "clock" || lastTab === "help") ? "field" : lastTab; render(); document.querySelector("main").scrollTop = 0; }

/* ============================================================
   FIELD
   ============================================================ */
let selected = null; 

function renderField(){
  const st = compute(), lay = fieldLayout(st), sp = sportDef(), P = sp.period;

  const nextIds = nextUpIds(Math.max(2, Math.ceil(S.settings.teamSize/3))), order = ["FWD","MID","DEF","GK"];
  let widest = 1;
  order.forEach(b => widest = Math.max(widest, lay.slots[b].length + lay.extra[b].length));
  const pitchVars = pitchSize(widest);

  let pitch = '<div id="pitch" data-sport="'+sportDef().id+'" style="'+pitchVars+'">';
  order.forEach(b => {
    const codes = posCodes(b, slotsFor(b)), extra = lay.extra[b];
    if(!codes.length && !extra.length) return;
    pitch += '<div class="band">';
    lay.slots[b].forEach((pid, i) => {
      if(pid) pitch += chip(byId(pid), st, b, "field", false, codes[i]);
      else pitch += '<button class="chip empty '+(b==="GK"?"gkslot ":"")+((selected && selected.t==="s" && selected.band===b && selected.i===i)?"sel":"")+'" data-slot="'+b+'|'+i+'">+ '+esc(posName(codes[i]))+'</button>';
    });
    extra.forEach(pid => { pitch += chip(byId(pid), st, b, "field", false, ""); });
    pitch += '</div>';
  });
  pitch += '</div>';

  const bench = S.roster.filter(p => !st[p.id].onBand);
  let benchHTML = '<div id="benchzone" style="'+benchSize(bench.length, pitchVars)+'"><div id="bench">' + (bench.length ? bench.map(p => chip(p, st, null, "bench", nextIds.includes(p.id))).join("") : '<div class="muted">Everyone on the roster is on the '+sp.surface+'.</div>') + '</div></div>';

  const diff = nextCount() ? planDiff() : [];
  const changes = diff.length;
  const onCt = diff.filter(e=>e.type==="ON").length, offCt = diff.filter(e=>e.type==="OFF").length, mvCt = diff.filter(e=>e.type==="MOVE").length;
  /* the plan buttons share the Bench heading, so they don't take a row above the field */
  const benchHead = '<div class="benchhead"><div><h3>Bench</h3><div class="muted">'+
    (changes ? 'Next: '+onCt+' on · '+offCt+' off'+(mvCt?' · '+mvCt+' moving':'') : 'Times are minutes played')+'</div></div>'+
    (selected ? '' : changes
      ? '<button class="btn ghost" id="edit-next">Edit plan</button><button class="btn primary" id="send-next">Send them on</button>'
      : '<button class="btn primary" id="plan-next">'+(S.game.log.length ? (usesLines() ? "Plan next lines" : "Plan next shift") : "Pick a starting lineup")+'</button>')+'</div>';

  /* between periods and after the whistle, say what happens next right here */
  const periodCard = S.game.onBreak && S.game.log.length
    ? '<div class="card" style="border-color:var(--next);margin-bottom:10px"><b>'+P+' '+(S.game.period-1)+' is over.</b> <span class="muted">Set the lineup if you want, then tap START when '+P.toLowerCase()+' '+S.game.period+' begins.</span></div>'
    : S.game.periodOver
    ? '<div class="card" style="border-color:var(--next);margin-bottom:10px"><b>Game over.</b> <span class="muted">Check the minutes, then start a new game to file this one in History.</span><div class="row" style="margin-top:8px"><button class="btn" id="f-mins">See minutes</button><button class="btn primary" id="f-newgame">New game</button></div></div>'
    : '';

  /* before kickoff the useful buttons are different ones */
  const preBar = !S.game.log.length
    ? '<div class="row" style="margin-bottom:10px"><button class="btn" id="f-checkin">Who is here?</button>'+
      '<button class="btn" id="f-lineup">Load a lineup</button></div>' : "";

  /* past full time with extra time on: the clock keeps running until the coach ends the period */
  /* the how-to line goes once the coach taps Got it, or after three filed games */
  const noKeeper = (sp.bands.indexOf("GK") < 0 || formation().gk) ? "" : "No keeper in this formation. ";
  /* lacrosse offside: with a spot open at defense or attack, a midfielder has to hold that side */
  const short = sp.id === "lacrosse" && S.game.log.length
    ? ["DEF","FWD"].filter(b => slotsFor(b) && lay.slots[b].filter(Boolean).length + lay.extra[b].length < slotsFor(b)) : [];
  const offside = short.length ? '<div class="hint" style="color:var(--warn);margin-top:0">Short on '+short.map(b => BANDNAME[b].toLowerCase()).join(" and ")+'. Hold a midfielder on that side to stay onside.</div>' : '';
  const showHint = !S.settings.tapHintHidden && S.archive.length < 3;
  const hint = (noKeeper || showHint) ? '<div class="hint">'+noKeeper+(showHint ? 'Tap a spot then a player, or two players to swap. Press and hold to drag. Green times are how long each player has been on. <button class="linkbtn" id="f-hintok">Got it</button>' : '')+'</div>' : '';
  const xtra = inExtraTime()
    ? '<div class="card xtra"><div><b>Extra time</b> <span class="mono" data-extra></span><div class="muted">Minutes still count.</div></div><button class="btn warn" id="f-endper">End '+P.toLowerCase()+' '+S.game.period+'</button></div>'
    : '';

  if(!S.roster.length){
    document.getElementById("v-field").innerHTML =
      teamBar("f-team")+'<div class="card"><h2>Let\'s get you set up</h2>'+
      '<div class="startrow"><b>1</b><div>Add your players on the <b>Roster</b> tab — a name and a number is enough.</div></div>'+
      '<div class="startrow"><b>2</b><div>Pick your game format on the <b>Setup</b> tab. It comes set to 7 v 7.</div></div>'+
      '<div class="startrow"><b>3</b><div>Come back here, tap an open spot, then tap the player who goes there.</div></div>'+
      '<div class="row" style="margin-top:12px"><button class="btn primary" id="go-roster">Add players</button>'+
      '<button class="btn ghost" id="go-help">How it works</button></div></div>';
    document.getElementById("go-roster").addEventListener("click", ()=>{ activeTab="roster"; render(); });
    document.getElementById("go-help").addEventListener("click", ()=>openView("help"));
    const ft0 = document.getElementById("f-team"); if(ft0) ft0.addEventListener("click", openTeams);
    return;
  }

  document.getElementById("v-field").innerHTML =
    /* while a player is selected the cards above the field step aside, so field and bar both fit */
    '<div class="toprow"><div class="modestrip live"><b>ON THE '+sp.surface.toUpperCase()+' NOW</b> live</div>' + teamBar("f-team", true, true) + '</div>' +
    (selected ? '' : xtra + periodCard + installBar() + supportCard() + preBar + offside) + pitch + benchHead + benchHTML +
    (selected ? selbar(st) : hint) +
    /* Start a new shift is only needed once the shift clock has run out; the clock screen always has it */
    '<div class="linkrow"><button class="linkbtn" id="undo">Undo last</button>'+
    (S.game.log.length && shiftRemaining() <= 0 ? '<button class="linkbtn" id="reset-shift">Start a new shift</button>' : '')+'</div>';

  document.querySelectorAll("#v-field [data-chip]").forEach(el => {
    el.addEventListener("click", ()=>{ if(!suppressClick) tapChip(el.dataset.chip, el.dataset.kind); });
    armDrag(el);
  });
  document.querySelectorAll("#v-field [data-slot]").forEach(el => el.addEventListener("click", ()=>{ if(!suppressClick) tapSlot(el.dataset.slot); }));
  
  if(selected && selected.t === "p"){
    const selid = selected.id;
    document.querySelectorAll('#v-field [data-ev]').forEach(b => b.addEventListener('click', ()=>logStat(selid, b.dataset.ev)));
  }

  const ft = document.getElementById("f-team"); if(ft) ft.addEventListener("click", openTeams);
  bindSupportCard(document.getElementById("v-field"));
  const fm =document.getElementById("f-mins"); if(fm) fm.addEventListener("click", ()=>{ activeTab = "times"; timesView = "game"; render(); });
  const fn = document.getElementById("f-newgame"); if(fn) fn.addEventListener("click", promptNewGame);
  const fe = document.getElementById("f-endper");
  if(fe) fe.addEventListener("click", ()=>modal("End period "+S.game.period+"?", "The clock stops and minutes stop counting.", "End period", endPeriodNow));
  const ci = document.getElementById("f-checkin"); if(ci) ci.addEventListener("click", openCheckIn);
  bindInstall(document.getElementById("v-field"));
  const fl = document.getElementById("f-lineup"); if(fl) fl.addEventListener("click", openLineups);
  /* with Keep next shift ready off (the default), this is how a plan gets made: build it, then show it */
  const goNext = document.getElementById("plan-next");
  if(goNext) goNext.addEventListener("click", ()=>{ activeTab = lastTab = "next"; if(!nextCount()){ S.game.planCleared = false; autoFillNext(); } render(); document.querySelector("main").scrollTop = 0; });
  const ed = document.getElementById("edit-next"); if(ed) ed.addEventListener("click", ()=>{ activeTab = "next"; render(); });
  const sn = document.getElementById("send-next"); if(sn) sn.addEventListener("click", sendNextShift);
  const rs = document.getElementById("reset-shift");
  if(rs) rs.addEventListener("click", ()=>{ beginNewShift(); save(); render(); toast("Shift "+S.game.shift+" started"); });
  document.getElementById("undo").addEventListener("click", undoLast);
  const hk = document.getElementById("f-hintok"); if(hk) hk.addEventListener("click", ()=>{ S.settings.tapHintHidden = true; save(); render(); });
  const cs = document.getElementById("clear-sel"); if(cs) cs.addEventListener("click", ()=>{ selected=null; render(); });
  const sb = document.getElementById("sub-off");
  if(sb) sb.addEventListener("click", ()=>{
    const pid = selected.id;
    confirmChange("Take <b>"+esc(first(pid))+"</b> off, leaving the spot open",
      ()=>{ push([{type:"OFF", playerId:pid}]); toast(first(pid)+" off"); render(); });
    selected = null; render();
  });
  const hb = document.getElementById("sub-hurt");
  if(hb) hb.addEventListener("click", ()=>{ const pid = selected.id; selected = null; pullPlayer(pid, "Sub out now"); });
}

function pushEvent(pid, type, msg){ push([{type, playerId: pid}]); selected = null; render(); toast(msg); }
/* A stat tapped on the selected player's bar. Cards and penalties that put a player out take them off
   in the same group, so one Undo reverses both. */
function logStat(pid, type){
  const st = compute(), on = !!st[pid].onBand, nm = first(pid), sp = sportDef();
  const off = on ? [{type:"OFF", playerId:pid}] : [];
  if(type === "YELLOW"){
    const bin = timedPenalties();
    push([{type:"YELLOW", playerId:pid}].concat(bin ? off : [])); selected = null; render();
    toast(!bin ? "Yellow card recorded for "+nm : sp.id === "soccer" ? "Yellow card — "+nm+" to the sin bin" : "Yellow card — "+nm+" off for "+(S.settings.sinBinMins||5)+" minutes");
    return;
  }
  if(type === "RED"){ push([{type:"RED", playerId:pid}].concat(off)); selected = null; render(); toast("Red card — "+nm+" is out for the rest of this game"); return; }
  if(type === "GREEN"){ push([{type:"GREEN", playerId:pid}].concat(off)); selected = null; render(); toast("Green card — "+nm+" off for 2 minutes"); return; }
  if(type === "PEN"){ selected = null; render(); choosePenalty(pid); return; }
  if(type === "FOUL"){
    push([{type:"FOUL", playerId:pid}]); selected = null;
    const r = compute()[pid], out = sp.fouls && S.settings.foulOut && r.fouls >= (S.settings.foulLimit || 5);
    if(out && r.onBand){ pullPlayer(pid, nm+" fouled out"); return; }
    render(); toast(out ? nm+" has fouled out" : "Foul — "+nm+" ("+r.fouls+(r.fouls === 1 ? " foul)" : " fouls)"));
    return;
  }
  const MSG = {GOAL:"Goal — "+nm+" (counts as a shot on goal too)", SOG:"Shot on goal — "+nm, SHOT:"Shot — "+nm, ASSIST:"Assist — "+nm, SAVE:"Save — "+nm,
               GB:"Ground ball — "+nm, P1:"Free throw — "+nm, P2:"2 points — "+nm, P3:"3 points — "+nm, REB:"Rebound — "+nm, STL:"Steal — "+nm};
  if(sp.id !== "soccer" && type === "GOAL") MSG.GOAL = "Goal — "+nm;
  pushEvent(pid, type, MSG[type] || nm);
}
function penLabel(s){ return s < 60 ? s+" sec" : (s % 60 ? (s/60).toFixed(1) : s/60)+" min"; }
/* lacrosse and hockey penalties carry their length; the player sits it out and checkSinBin says when they're back */
function choosePenalty(pid){
  const secs = sportDef().penaltySecs || [120];
  modal("Penalty — "+first(pid), '<div class="muted" style="margin-bottom:8px">How long? '+esc(first(pid))+' comes off, sits it out, and the app tells you when they can go back on.</div>'+
    '<div class="row" style="flex-wrap:wrap">'+secs.map(s => '<button class="btn" data-pen="'+s+'">'+penLabel(s)+'</button>').join("")+'</div>', null, null, "Cancel");
  document.querySelectorAll("#modalbody [data-pen]").forEach(b => b.addEventListener("click", ()=>{
    const s = parseInt(b.dataset.pen), on = !!compute()[pid].onBand;
    closeModal();
    push([{type:"PEN", playerId:pid, secs:s}].concat(on ? [{type:"OFF", playerId:pid}] : []));
    render(); toast("Penalty — "+first(pid)+" out for "+penLabel(s));
  }));
}
function chip(p, st, band, kind, isNext, pos){
  const r = st[p.id], sel = selected && selected.t === "p" && selected.id === p.id;
  const sinbin = isSinBin(p.id), stale = kind === "bench" && isStale(p.id);
  const unavail = (!available(p) && !sinbin) || p.avail !== "available";
  let flag = "";
  if(isNext) flag = '<span class="flag">NEXT</span>';
  else if(sinbin) flag = '<span class="flag" style="color:var(--alert)">SIN BIN</span>';
  else if(unavail) flag = '<span class="flag" style="color:var(--alert)">OUT</span>';
  else if(stale) flag = '<span class="flag" style="color:var(--warn)">STALE</span>';
  return '<button class="chip'+(sel?" sel":"")+(band==="GK"?" gkslot":"")+(isNext?" next":"")+(stale?" stale":"")+(sinbin?" sinbin":"")+'"'+
    (unavail?' style="opacity:.42"':'')+ ' data-chip="'+p.id+'" data-kind="'+kind+'">'+ flag + avatar(p) +
    '<span class="nm">'+esc(p.name.split(" ")[0])+'</span><span class="meta">'+(pos ? '<span class="pc mono">'+esc(pos)+'</span>' : '')+
    /* basketball coaches watch fouls, so they show on the court card in Advanced mode */
    (kind === "field" && r.fouls && sportDef().fouls && S.settings.advanced ? '<span class="pc mono" style="color:var(--warn)">'+r.fouls+'F</span>' : '')+
    '<span class="tm mono" data-live="'+p.id+'|'+(kind==="field"?"stint":"total")+'"></span></span></button>';
}
function selbar(st){
  if(selected.t === "s"){
    return '<div class="selbar selrow"><div><b>'+esc(posName(slotPos(selected.band, selected.i)) || BANDNAME[selected.band])+'</b> is open. <span class="muted">Tap the player you want there.</span></div><button class="btn ghost" id="clear-sel">Clear</button></div>';
  }
  const p = byId(selected.id); if(!p) return "";
  const isField = !!st[p.id].onBand;
  /* the sport's stat buttons; Save only for whoever is in goal */
  const EVB = {GOAL:"Goal", ASSIST:"Assist", SOG:"SOG", SHOT:"Shot", SAVE:"Save", YELLOW:"Yellow", RED:"Red", GREEN:"Green",
               PEN:"Penalty", GB:"GB", P1:"+1", P2:"+2", P3:"+3", REB:"Reb", STL:"Steal", FOUL:"Foul"};
  const EVID = {ASSIST:"ev-ast", YELLOW:"ev-yel"};
  const EVTONE = {YELLOW:"var(--warn)", RED:"var(--alert)", GREEN:"var(--on)", PEN:"var(--warn)", FOUL:"var(--warn)"};
  const onGoal = isField && st[p.id].onBand === "GK";
  const evts = S.settings.advanced ? '<div class="ev-grid">'+sportDef().events.filter(t => t !== "SAVE" || onGoal).map(t =>
    '<button class="btn ghost" id="'+(EVID[t] || "ev-"+t.toLowerCase())+'" data-ev="'+t+'"'+(EVTONE[t] ? ' style="color:'+EVTONE[t]+';border-color:'+EVTONE[t]+'"' : '')+'>'+EVB[t]+'</button>').join("")+'</div>' : '';
  return '<div class="selbar"><div class="seltxt"><b>'+esc(p.name)+'</b> <span class="muted">'+
    (isField ? "Tap a bench player, a spot, or a teammate." : "Tap an open spot or the player to replace.")+
    '</span></div><div class="row">'+
      (isField ? '<button class="btn warn" id="sub-hurt">Hurt: sub out</button><button class="btn ghost" id="sub-off">Take off</button>' : '')+
      '<button class="btn ghost" id="clear-sel">Clear</button></div>'+
    evts+'</div>';
}
function first(id){ const p = byId(id); return p ? p.name.split(" ")[0] : "Player"; }

/* Every way of changing the field goes through here, so tapping and dragging behave
   the same way and the wording matches what is actually about to happen. */
function confirmChange(text, run){
  if(!S.settings.confirmChanges){ run(); return; }
  modal("Make this change?", '<div style="font-size:15px">'+text+'</div>', "Do it", run);
}
function describePair(aId, bId){
  const lay = fieldLayout(), wa = whereOn(aId, lay), wb = whereOn(bId, lay);
  if(wa && wb) return "Switch <b>"+esc(first(aId))+"</b> ("+esc(whereName(wa))+") and <b>"+esc(first(bId))+"</b> ("+esc(whereName(wb))+")";
  if(!wa && !wb) return "Both are on the bench";
  const inId = wa ? bId : aId, outId = wa ? aId : bId;
  return "Bring <b>"+esc(first(inId))+"</b> on for <b>"+esc(first(outId))+"</b> at "+esc(whereName(wa || wb));
}
function describePlace(pid, band, i){
  const w = whereOn(pid), to = esc(posName(slotPos(band, i)) || BANDNAME[band]);
  return w ? "Move <b>"+esc(first(pid))+"</b> from "+esc(whereName(w))+" to "+to
           : "Bring <b>"+esc(first(pid))+"</b> on at "+to;
}

/* Every change lands in one exact position — the open slot, or the spot of the player you
   dropped onto — so the log always says left D, never just "defense". */
function doPlace(pid, band, i){
  const p = byId(pid), lay = fieldLayout(), pos = slotPos(band, i);
  if(!pos){ toast("That spot isn't in this formation"); return; }
  const there = lay.slots[band][i];
  if(there === pid){ toast(first(pid)+" is already at "+posName(pos)); return; }
  if(there){ doPair(pid, there); return; }
  if(whereOn(pid, lay)){ push([{type:"MOVE", playerId:pid, band, pos}]); }
  else {
    if(!available(p)){ toast(first(pid)+" is unavailable/in Sin Bin"); return; }
    push([{type:"ON", playerId:pid, band, pos}]);
  }
  toast(eligible(p, band) ? first(pid)+" → "+posName(pos) : first(pid)+" isn't listed for "+BANDNAME[band]+" — placed at "+posName(pos)+" anyway");
}
function doPair(aId, bId){
  if(aId === bId) return;
  const lay = fieldLayout(), wa = whereOn(aId, lay), wb = whereOn(bId, lay);
  if(wa && wb){
    if(wa.band === wb.band && wa.code === wb.code){ toast("Both are already at "+whereName(wa)); return; }
    push([{type:"MOVE", playerId:aId, band:wb.band, pos:wb.code},{type:"MOVE", playerId:bId, band:wa.band, pos:wa.code}]);
    toast(first(aId)+" → "+whereName(wb)+", "+first(bId)+" → "+whereName(wa));
  } else if(!wa && !wb){
    toast("Drag onto the field, not onto another bench player");
  } else {
    const incoming = wa ? bId : aId, outgoing = wa ? aId : bId, w = wa || wb;
    if(!available(byId(incoming))){ toast(first(incoming)+" is unavailable/in Sin Bin"); return; }
    push([{type:"OFF", playerId:outgoing},{type:"ON", playerId:incoming, band:w.band, pos:w.code}]);
    toast(first(incoming)+" on for "+first(outgoing)+" at "+whereName(w)+(eligible(byId(incoming), w.band) ? "" : " — not their usual spot"));
  }
}
function tapChip(id, kind){
  if(!selected){ selected = {t:"p", id, kind}; render(); return; }
  if(selected.t === "s"){ doPlace(id, selected.band, selected.i); selected = null; render(); return; }
  if(selected.id === id){ selected = null; render(); return; }
  /* two bench players can't swap with each other, so the second tap just picks that player instead */
  if(selected.kind === "bench" && kind === "bench"){ selected = {t:"p", id, kind}; render(); return; }

  const aId = selected.id;
  confirmChange(describePair(aId, id), ()=>{ doPair(aId, id); render(); });
  selected = null; render();
}
function tapSlot(key){
  const [band, iStr] = key.split("|"), i = parseInt(iStr);
  if(selected && selected.t === "p"){
    const pid = selected.id;
    confirmChange(describePlace(pid, band, i), ()=>{ doPlace(pid, band, i); render(); });
    selected = null; render(); return;
  }
  selected = (selected && selected.t === "s" && selected.band === band && selected.i === i) ? null : {t:"s", band, i};
  render();
}

/* ---------- press and hold to drag ---------- */
let drag = null, suppressClick = false;
function armDrag(el){
  el.addEventListener("pointerdown", e => {
    if(drag || (e.button && e.button !== 0)) return;
    const sx = e.clientX, sy = e.clientY;
    let timer = setTimeout(()=>{ timer = null; off(); beginDrag(el, sx, sy); }, 180);
    const move = ev => { if(Math.abs(ev.clientX-sx) > 8 || Math.abs(ev.clientY-sy) > 8){ clearTimeout(timer); off(); } };
    const end = () => { clearTimeout(timer); off(); };
    const off = () => { document.removeEventListener("pointermove", move); document.removeEventListener("pointerup", end); document.removeEventListener("pointercancel", end); };
    document.addEventListener("pointermove", move); document.addEventListener("pointerup", end); document.addEventListener("pointercancel", end);
  });
}
function beginDrag(el, x, y){
  const id = el.dataset.chip; if(!id) return;
  /* its own setting — a coach can want this nudge with the shift-end vibration off */
  if(S.settings.dragBuzz !== false && navigator.vibrate) navigator.vibrate(14);
  const r = el.getBoundingClientRect(), ghost = el.cloneNode(true);
  ghost.id = "ghost"; ghost.classList.remove("sel");
  ghost.style.width = r.width+"px"; ghost.style.minHeight = r.height+"px";
  ghost.style.left = x+"px"; ghost.style.top = y+"px";
  const srcAv = el.querySelector(".av,.avn"), gAv = ghost.querySelector(".av,.avn");
  if(srcAv && gAv){ const cs = getComputedStyle(srcAv); gAv.style.width = cs.width; gAv.style.height = cs.height; gAv.style.fontSize = cs.fontSize; }
  document.body.appendChild(ghost);
  el.classList.add("dragging"); document.body.classList.add("nodrag");
  drag = {id, el, ghost, target:null};
  document.addEventListener("pointermove", dragMove, {passive:false});
  document.addEventListener("pointerup", dragEnd); document.addEventListener("pointercancel", dragEnd); document.addEventListener("touchmove", blockScroll, {passive:false});

function blockScroll(e){ if(drag) e.preventDefault(); }
function dragMove(e){
  if(!drag) return; e.preventDefault();
  drag.ghost.style.left = e.clientX+"px"; drag.ghost.style.top = e.clientY+"px"; drag.ghost.style.visibility = "hidden";
  const under = document.elementFromPoint(e.clientX, e.clientY); drag.ghost.style.visibility = "";
  let t = under && under.closest ? under.closest("[data-chip],[data-slot],[data-nslot],#benchzone,#poolzone") : null;
  if(t === drag.el) t = null;
  if(t !== drag.target){ if(drag.target) drag.target.classList.remove("droptarget"); drag.target = t; if(t) t.classList.add("droptarget"); }

function dragEnd(){
  if(!drag) return;
  const id = drag.id, t = drag.target;

  drag.el.classList.remove("dragging"); drag.ghost.remove();
  document.body.classList.remove("nodrag");
  document.removeEventListener("pointermove", dragMove); document.removeEventListener("pointerup", dragEnd); document.removeEventListener("pointercancel", dragEnd); document.removeEventListener("touchmove", blockScroll);
  drag = null;

     blanking every tap for a fixed window — a real tap right after a drag must land. */
  suppressClick = true;
  const eat = ev => { ev.stopPropagation(); ev.preventDefault(); done(); };
  const done = () => { suppressClick = false; document.removeEventListener("click", eat, true); clearTimeout(tmr); };
  const tmr = setTimeout(done, 250);
  document.addEventListener("click", eat, true);
  if(t){
    if(activeTab === "next"){
      if(t.id === "poolzone") planClear(id);
      else if(t.dataset.nslot){
        const [band, i] = t.dataset.nslot.split("|");
        if(!eligible(byId(id), band)) toast(first(id)+" isn't listed for "+BANDNAME[band]+" — planned anyway");
        planInto(id, band, parseInt(i));
      }
      nextSel = null;
    } else {
      /* dragging is deliberate — it commits straight away. Tapping is easy to do by
         accident, so that path asks first. */
      if(t.id === "benchzone"){ if(compute()[id].onBand){ push([{type:"OFF", playerId:id}]); toast(first(id)+" off"); } }
      else if(t.dataset.slot){ const [band, i] = t.dataset.slot.split("|"); doPlace(id, band, parseInt(i)); }
      else if(t.dataset.chip) doPair(id, t.dataset.chip);
      selected = null;
    }
  }
  render();
}

function planChip(p, st, band, i, holding){
  const code = slotPos(band, i) || "";
  if(!p) return '<button class="chip empty" data-nslot="'+band+'|'+i+'">+ '+esc(posName(code))+'</button>';
  const r = st[p.id];
  return '<button class="chip'+((nextSel&&nextSel.t==="p"&&nextSel.id===p.id)?" sel":"")+(band==="GK"?" gkslot":"")+(holding?" holding":"")+'" data-chip="'+p.id+'" data-kind="plan" data-nslot="'+band+'|'+i+'">'+
    (holding === true ? '<span class="flag" style="color:var(--ink-dim)">STAYS</span>' : holding ? '<span class="flag">MOVES</span>' : (r.onBand ? '' : '<span class="flag" style="color:var(--next)">IN</span>'))+
    avatar(p) + '<span class="nm">'+esc(p.name.split(" ")[0])+'</span><span class="meta">'+(code ? '<span class="pc mono">'+esc(code)+'</span>' : '')+'<span class="tm mono">'+fmt(r.total)+'</span></span></button>';
}
function tapNextChip(pid){
  if(!nextSel){ nextSel = {t:"p", id:pid}; render(); return; }
  if(nextSel.t === "s"){
    if(!eligible(byId(pid), nextSel.band)) toast(first(pid)+" isn't listed for "+BANDNAME[nextSel.band]+" — planned anyway");
    planInto(pid, nextSel.band, nextSel.i); nextSel = null; render(); return;
  }
  if(nextSel.id === pid){ nextSel = null; render(); return; }
  const target = nextSlotOf(pid), mine = nextSlotOf(nextSel.id);
  /* neither is in the plan, so there's nothing to swap: pick the second player instead */
  if(!target && !mine){ nextSel = {t:"p", id:pid}; render(); return; }
  if(target) planInto(nextSel.id, target.band, target.i);
  else if(mine) planClear(nextSel.id);
  nextSel = null; render();
}
function tapNextSlot(key){
  const [band, iStr] = key.split("|"), i = parseInt(iStr);
  if(nextSel && nextSel.t === "p" && nextSel.id === (ensureNext()[band][i])){ nextSel = null; render(); return; }
  if(nextSel && nextSel.t === "p"){
    const p = byId(nextSel.id);
    if(!eligible(p, band)) toast(first(nextSel.id)+" isn't listed for "+BANDNAME[band]+" — planned anyway");
    planInto(nextSel.id, band, i); nextSel = null; render(); return;
  }
  nextSel = (nextSel && nextSel.t === "s" && nextSel.band === band && nextSel.i === i) ? null : {t:"s", band, i}; render();
}

const ARCHIVE_MAX = 100, LOGS_KEPT = 3;
function archiveGame(){
  if(!S.game.log.length) return;
  S.archive.unshift(Object.assign(summarizeGame(), {at: Date.now(), log: S.game.log.slice()}));
  S.archive = S.archive.slice(0, ARCHIVE_MAX);
  /* The summary is everything the season view needs. Full event logs are kept for the last few
     games only — logs plus base64 photos would otherwise approach the storage quota. */
  S.archive.forEach((a,i) => { if(i >= LOGS_KEPT) delete a.log; });

/* ---------------- past games & season ---------------- */
/* A game boiled down to what season totals need, keyed by player id so a renamed player keeps
   their history. Built by New game, and on the fly for the game in progress. */
function summarizeGame(){
  const g = S.game, st = compute(), log = g.log, now = gameElapsed(), R = x => Math.round(x || 0);
  const present = g.present ? new Set(g.present) : null;
  const firstOn = log.find(e => e.type === "ON");
  const starters = new Set(firstOn ? log.filter(e => e.g === firstOn.g && e.type === "ON").map(e => e.playerId) : []);
  /* replay once for shifts played and time in goal per period ("2 periods in goal") */
  const shifts = {}, on = new Set(), gkOpen = {}, gkPer = {};
  const addShift = (pid, sh) => { (shifts[pid] = shifts[pid] || new Set()).add(sh || 1); };
  const gkAdd = (pid, period, secs) => { const m = gkPer[pid] = gkPer[pid] || {}; m[period] = (m[period] || 0) + secs; };
  log.forEach(e => {
    on.forEach(pid => addShift(pid, e.sh));
    if(e.type === "PERIOD_END"){ Object.keys(gkOpen).forEach(pid => { gkAdd(pid, e.period, e.gt - gkOpen[pid]); gkOpen[pid] = e.gt; }); return; }
    if(!e.playerId || !(e.type === "ON" || e.type === "OFF" || e.type === "MOVE")) return;

function aggregate(games){
  const by = {}, team = {games:0, record:0, w:0, l:0, d:0, gf:0, ga:0, shots:0, sog:0, oppShots:0, oppSog:0};
  const STATS = ["goals","assists","shots","sog","saves","ga","yellows","reds","gkPeriods","points","rebounds","steals","fouls","gb","pim","greens"];
  games.forEach(a => {
    team.games++;

      const s = a.score;
      team.gf += s.us; team.ga += s.them; team.shots += s.usShots||0; team.sog += s.usSOG||0; team.oppShots += s.themShots||0; team.oppSog += s.themSOG||0;
      if(!a.current){ team.record++; if(s.us > s.them) team.w++; else if(s.us < s.them) team.l++; else team.d++; }
    }
    const came = a.players.filter(p => p.attended || p.total > 0);
    const even = came.length ? (a.playerSeconds != null ? a.playerSeconds : came.reduce((x,p) => x + p.total, 0)) / came.length : 0;
    a.players.forEach(p => {
      if(!p.id) return;

                                        goals:0, assists:0, shots:0, sog:0, saves:0, ga:0, yellows:0, reds:0, gkPeriods:0,
                                        points:0, rebounds:0, steals:0, fouls:0, gb:0, pim:0, greens:0};

function seasonBalance(){

    const r = by[id], avg = {};

    Object.keys(r.pos).forEach(c => { avg[c] = r.pos[c] / Math.max(1, r.gp); });
    out.posAvg[id] = avg;
  });
  return out;

/* Capped at one shift, so a kid who is behind gets about one extra shift a game until caught up

function seasonOwed(season){

  if(!season) return {};
  const cap = (S.settings.shiftLen || 5) * 60, out = {};
  Object.keys(season.behind).forEach(id => { out[id] = Math.max(-cap, Math.min(cap, season.behind[id])); });

function saveFile(name, text, mime){
  try{ const blob = new Blob([text], {type:mime}), url = URL.createObjectURL(blob), a = document.createElement("a"); a.href = url; a.download = name; a.style.display = "none"; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 4000); toast("Saved "+name); }
  catch(e){ toast("Browser blocked download — use Copy as text instead"); }

/* Android Chrome only shares a short list of file types, and .json isn't one of them, so files go out
   as .txt / text/plain. Big text (a backup with photos) is too long to share as a message, so if files
   can't be shared it's saved instead. */
async function shareFile(name, text, mime, title){
  try{
    const file = new File([text], name, {type:mime});
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title}); return; }
    if(text.length > 20000){ saveFile(name, text, mime); toast("This phone can't share that file, so it was saved to Downloads"); return; }
    await navigator.share({title, text});
  }
  catch(e){ if(e && e.name === "AbortError") return; toast("Sharing isn't available here"); }
}
/* A backup of all teams replaces everything. One from before teams existed is added as a new
   team, so restoring an old file never wipes out the teams already on the phone. */
function loadBackup(text){
  let o; try{ o = JSON.parse(text); }catch(e){ toast("That file isn't a backup"); return false; }
  if(o && Array.isArray(o.teams) && o.teams.length){ closeModal(); restoreTeams(o); return true; }
  if(!o || !o.roster || !o.settings){ toast("That file isn't a backup"); return false; }
  closeModal(); addTeam("Imported team", o); return true;
}

function fixEvent(eid){
  const e = S.game.log.find(x => x.eid === eid); if(!e) return;
  if(e.type === "NOTE"){
    modal("Edit note", '<input type="text" id="fix-note" value="'+esc(e.note)+'">', "Save", ()=>{
      const v = document.getElementById("fix-note").value.trim();
      if(!v){ toast("Type something or delete the note"); return false; }
      e.note = v; save(); render(); toast("Note updated");
    });
    setTimeout(()=>{ const el=document.getElementById("fix-note"); if(el){ el.focus(); el.select(); } }, 60);
    return;
  }
  const LABEL = {GOAL:"Goal", SOG:"Shot on goal", SHOT:"Shot", ASSIST:"Assist",
                 SAVE:"Save", YELLOW:"Yellow card", RED:"Red card", GA:"Goal against",
                 GREEN:"Green card", PEN:"Penalty", GB:"Ground ball", P1:"Free throw", P2:"2-pointer", P3:"3-pointer",
                 REB:"Rebound", STL:"Steal", FOUL:"Foul"};
  const st = compute();
  /* whoever was on the field when it happened comes first — that is nearly always who you meant */
  const onThen = {};
  for(const x of S.game.log){
    if(x.gt > e.gt) break;
    if(x.type === "ON" || x.type === "MOVE") onThen[x.playerId] = 1;
    else if(x.type === "OFF") delete onThen[x.playerId];
  }
  const rank = p => (onThen[p.id] ? 0 : 1);
  const list = S.roster.slice().sort((a,b) => rank(a) - rank(b) || (parseInt(a.number)||99)-(parseInt(b.number)||99));
  const body = '<div class="muted" style="margin-bottom:8px">'+esc(LABEL[e.type]||e.type)+
    ' at '+fmt2(e.gt)+' — currently '+esc(byId(e.playerId) ? byId(e.playerId).name : "unknown")+'. Tap who it should be.</div>'+
    '<div class="lulist">'+ list.map(p =>
      '<button data-fixto="'+p.id+'"'+(p.id===e.playerId?' style="border-color:var(--on)"':'')+'>'+
        avatar(p)+'<b>'+esc(p.name)+'</b>'+
        '<span class="muted" style="flex:none">'+(onThen[p.id] ? "on then" : "bench")+'</span></button>').join("") +'</div>';
  modal("Who was it?", body, null, null, "Close");
  document.querySelectorAll("#modalbody [data-fixto]").forEach(el => el.addEventListener("click", ()=>{
    e.playerId = el.dataset.fixto;

    toast((LABEL[e.type]||"Event")+" — "+first(e.playerId));
  }));
}

/* One card per shift. live: the game in progress — collapsible, events fixable and deletable.
   Otherwise a read-only record of a past game, every card open. */
function shiftCardsHTML(log, opts){
  const byShift = {};
  log.forEach((e,i) => { const k = e.sh || 1; (byShift[k] = byShift[k] || []).push(i); });
  const nums = Object.keys(byShift).map(Number).sort((a,b)=>b-a);
  const nameOf = opts.nameOf;

  /* who was standing where at a given point in the log */
  const lineAt = idx => {
    const open = {};
    for(let i=0;i<idx;i++){
      const e = log[i];
      if(e.type==="ON"||e.type==="MOVE") open[e.playerId] = {band:e.band, pos:e.pos||null};
      else if(e.type==="OFF") delete open[e.playerId];
    }
    return open;
  };

  /* full words in the detail, standard box-score letters in the collapsed header */
  const MARK  = {GOAL:"Goal", SOG:"SOG", SHOT:"Shot", ASSIST:"Assist", SAVE:"Save",
                 YELLOW:"Yellow card", RED:"Red card", GA:"Goal against",
                 OPP_GOAL:"goal", OPP_SOG:"shot on goal", OPP_SHOT:"shot",
                 GREEN:"Green card", PEN:"Penalty", GB:"Ground ball", P1:"Free throw", P2:"2-pointer", P3:"3-pointer",
                 REB:"Rebound", STL:"Steal", FOUL:"Foul", OPP_P1:"free throw", OPP_P2:"2-pointer", OPP_P3:"3-pointer"};
  const SHORT = {GOAL:"G", SOG:"SOG", SHOT:"Sh", ASSIST:"A", SAVE:"Sv",
                 YELLOW:"YC", RED:"RC", GA:"GA",
                 GREEN:"GC", PEN:"PEN", GB:"GB", P1:"FT", P2:"2P", P3:"3P", REB:"Reb", STL:"Stl", FOUL:"PF"};
  const TONE  = {YELLOW:"var(--warn)", RED:"var(--alert)", GOAL:"var(--on)",
                 GREEN:"var(--on)", PEN:"var(--warn)", FOUL:"var(--warn)", P1:"var(--on)", P2:"var(--on)", P3:"var(--on)"};
  const MATCH = e => MARK[e.type] || e.type==="NOTE" || e.type==="PERIOD_END";

  const html = nums.map(sh => {
    const idxs = byShift[sh], first = log[idxs[0]];
    /* A shift normally opens with a group of substitutions. If it doesn't — the first
       thing logged was a goal, say — there is no opening group and everything counts
       as an event, otherwise that goal would silently vanish from the card. */
    const firstGroup = idxs.filter(i => log[i].g === first.g).map(i => log[i]);
    const opensWithSubs = firstGroup.some(e => e.type==="ON" || e.type==="OFF" || e.type==="MOVE");
    const openG = opensWithSubs ? first.g : null;
    const lastOpening = opensWithSubs ? idxs.filter(i => log[i].g === first.g).pop() + 1 : idxs[0];
    const line = lineAt(lastOpening);
    const later = idxs.map(i=>log[i]).filter(e => e.g !== openG);
    const subs = later.filter(e => e.type==="ON"||e.type==="OFF"||e.type==="MOVE").length;
    const events = later.filter(MATCH);

    const pos = nums.indexOf(sh);
    const endGt = pos > 0 ? log[byShift[nums[pos-1]][0]].gt : opts.endGt;
    const dur = Math.max(0, endGt - first.gt);

    const rows = BANDS.map(b => {
      const rank = id => { const k = POSORDER.indexOf(line[id].pos); return k < 0 ? 99 : k; };
      const who = Object.keys(line).filter(id => line[id].band === b).sort((x, y) => rank(x) - rank(y));
      if(!who.length) return "";
      return '<div class="lrow"><span class="lpos">'+BANDNAME[b]+'</span><span class="lwho">'+
        who.map(id => nameOf(id)+(line[id].pos ? ' <span class="muted">'+esc(line[id].pos)+'</span>' : '')).join(", ")+'</span></div>';
    }).join("");

    const evNodes = events.map(e => {
      let desc;
      if(e.type==="NOTE") desc = "“"+esc(e.note)+"”";
      else if(e.type==="PERIOD_END") desc = '<span class="muted">End of period '+e.period+'</span>';
      else if(e.type.indexOf("OPP_")===0) desc = 'Opponent '+MARK[e.type];
      else desc = '<b'+(TONE[e.type]?' style="color:'+TONE[e.type]+'"':'')+'>'+MARK[e.type]+'</b> — '+nameOf(e.playerId);
      const del = (!opts.live || e.type==="PERIOD_END") ? "" :
        '<button class="btn ghost" style="min-height:26px;height:26px;width:26px;padding:0;flex:none" data-del-ev="'+e.eid+'">×</button>';
      const fixable = opts.live && (e.type === "NOTE" || (e.playerId && e.type.indexOf("OPP_") !== 0));
      const label = fixable
        ? '<button data-fix="'+e.eid+'" style="flex:1;text-align:left;font:inherit;color:inherit">'+desc+'</button>'
        : '<span style="flex:1">'+desc+'</span>';
      return '<div class="lmid" style="display:flex;align-items:center;gap:8px">'+
        '<span class="mono muted" style="flex:none">'+fmt2(e.gt)+'</span>'+
        label+del+'</div>';
    }).join("");

    /* a compact badge line so a collapsed shift still says something */
    const tally = {};
    events.forEach(e => {
      /* opponent events are already in the scoreline up top — don't double-count them here */
      if(SHORT[e.type] && e.type.indexOf("OPP_") !== 0) tally[e.type] = (tally[e.type]||0)+1;
    });
    const badges = Object.keys(SHORT).filter(k => tally[k])
      .map(k => '<span'+(TONE[k]?' style="color:'+TONE[k]+'"':'')+'>'+tally[k]+SHORT[k]+'</span>').join(" ");

    const open = !opts.live || openShifts["s"+sh] === true || (openShifts["s"+sh] === undefined && pos === 0);
    return '<div class="hgroup">'+
      '<button class="hhead"'+(opts.live ? ' data-sh="'+sh+'"' : '')+'>'+
        '<span class="t mono">'+fmt2(first.gt)+'</span>'+
        '<span class="s"><b>Shift '+sh+'</b>'+(badges?' <span class="badges">'+badges+'</span>':'')+'</span>'+
        '<span class="muted">'+fmt(dur)+' · P'+first.period+(open?" ▾":" ▸")+'</span>'+
      '</button>'+
      (open ? '<div class="hbody">'+
        (rows || '<div class="muted">Nobody on the field</div>')+
        (subs ? '<div class="lmid muted">'+subs+' mid-shift change'+(subs>1?"s":"")+'</div>' : '')+
        evNodes+
      '</div>' : '')+
    '</div>';
  }).join("");

  return html;

}

function shrink(file, cb){
  const fr = new FileReader();
  fr.onload = () => { const img = new Image(); img.onload = () => { const side = Math.min(img.width, img.height), out = 128, c = document.createElement("canvas"); c.width = c.height = out; const ctx = c.getContext("2d"); ctx.drawImage(img, (img.width-side)/2, (img.height-side)/2, side, side, 0, 0, out, out); cb(c.toDataURL("image/jpeg", 0.72)); }; img.onerror = () => toast("Couldn't read that image"); img.src = fr.result; };
  fr.onerror = () => toast("Couldn't read that file"); fr.readAsDataURL(file);
}

function sportHelp(q){
  const sp = sportDef(), out = [];
  out.push(q("Which sports does it do?",
    "Soccer (futsal too), field hockey, lacrosse, ice hockey and basketball. Each team has its own sport: pick it when you add a team, or change it on <b>Setup</b> between games. Tabs and positions use that sport's words, so the <b>Field</b> tab is <b>Ice</b> in hockey and <b>Court</b> in basketball."));
  if(sp.id !== "soccer" && sp.bands.indexOf("GK") >= 0) out.push(q("Who plays in goal?",
    "Goalies wear their own gear, so new players aren't ticked for goal. Open each goalie on <b>Roster</b> and tick <b>"+sp.gkButton+"</b>. Auto-fill keeps your goalie in unless you turn on <b>Switch goalie each shift</b>."));
  if(sp.lines) out.push(q("How do lines work?",
    "Hockey changes whole lines. Tap <b>Lines</b> on the Roster tab to set forward lines and defense pairs, or let the app build them from the roster. <b>Plan next lines</b> sends out the line and the pair that have played least, and gives a spot left by an absent or penalized player to whoever has played least.<br><br>With <b>Keep next shift ready</b> on, the next change is already waiting on the Ice tab after each one: one tap on <b>Send them on</b>. Turn on <b>Mix lines</b> on Setup to rotate individual skaters instead."));
  if(sp.penaltySecs) out.push(q("Penalties",
    "In Advanced mode, tap the player, then <b>Penalty</b> and how long. They come off, their spot stays open, and the app tells you when they can go back on. Penalty minutes add up in the Season view."));
  if(sp.id === "fieldhockey") out.push(q("Cards",
    "In Advanced mode, tap the player, then the card. Green is 2 minutes off, yellow is the suspension set on Setup, and red is the rest of the game. The app tells you when a suspended player can go back on."));
  if(sp.fouls) out.push(q("Fouls",
    "In Advanced mode, tap the player, then <b>Foul</b>. A player's fouls show on their card. Turn on <b>Foul-out</b> on Setup and a player who reaches the limit comes off, and the app offers the fairest replacement."));
  if(sp.id === "lacrosse") out.push(q("Offside",
    "If a penalty or an injury leaves defense or attack a player short, the Field tab says so, as a reminder to hold a midfielder on that side."));
  return out.join("");
}

/* Everything on the Minutes tab is derived from the event log, so a bad edit shows up
   as wrong numbers rather than a crash. These are the invariants that must hold. */
function selfCheck(){
  const st = compute(), out = [];
  const ok = (name, pass, detail) => out.push('<div class="stage">'+(pass?'<span class="in">PASS</span>':'<span class="out2">FAIL</span>')+' '+name+(detail?' <span class="muted">'+esc(detail)+'</span>':'')+'</div>');

  const onField = S.roster.filter(p => st[p.id].onBand);
  ok("Field holds the right number", onField.length === 0 || onField.length <= S.settings.teamSize,
     onField.length+" on, "+S.settings.teamSize+" allowed");

  let over = [];
  BANDS.forEach(b => { const c = onField.filter(p => st[p.id].onBand === b).length;
    if(c > slotsFor(b)) over.push(BANDNAME[b]+" "+c+"/"+slotsFor(b)); });
  ok("No position is overfilled", !over.length, over.join(", "));

  /* time conservation: everyone's minutes should add up to slots x elapsed */
  let adjTotal = 0; const adj = S.game.adj||{};
  for(const k in adj) for(const b in adj[k]) adjTotal += adj[k][b];
  const sum = S.roster.reduce((a,p) => a + st[p.id].total, 0) - adjTotal;
  let expect = 0, cursor = 0, live = {};
  S.game.log.forEach(e => {
    const n = Object.keys(live).length;
    expect += n * Math.max(0, e.gt - cursor); cursor = e.gt;
    if(e.type==="ON"||e.type==="MOVE") live[e.playerId] = 1;
    else if(e.type==="OFF") delete live[e.playerId];
  });
  expect += Object.keys(live).length * Math.max(0, gameElapsed() - cursor);
  ok("Minutes add up", Math.abs(sum - expect) < 2, Math.round(sum)+"s counted vs "+Math.round(expect)+"s on the field");

  const dupes = S.roster.filter(p => {
    let n = 0; S.game.log.forEach(e => { if(e.playerId===p.id){ if(e.type==="ON") n++; else if(e.type==="OFF") n--; } });
    return n > 1;
  });
  ok("Nobody is on twice", !dupes.length, dupes.map(p=>p.name).join(", "));

  const codes = onField.map(p => st[p.id].onPos).filter(Boolean), clash = codes.filter((c, i) => codes.indexOf(c) !== i);
  ok("No two players share a position", !clash.length, clash.map(posName).join(", "));

  const badElig = S.roster.filter(p => st[p.id].onBand && !eligible(p, st[p.id].onBand));
  ok("Everyone is in a position they play", !badElig.length, badElig.map(p=>p.name).join(", "));

  const ghosts = S.game.log.filter(e => e.playerId && !byId(e.playerId)).length;
  ok("No events point at deleted players", !ghosts, ghosts ? ghosts+" orphaned" : "");

  /* every team shares the one browser quota */
  const bytes = JSON.stringify(S).length + TEAMS.list.reduce((a, t) => a + (t.id === TEAMS.active ? 0 : (t.bytes || 0)), 0);
  ok("Storage has room", bytes < 3500000, Math.round(bytes/1024)+" KB used"+(TEAMS.list.length > 1 ? " across "+TEAMS.list.length+" teams" : "")+", roughly 5 MB available");
  ok("Saving is working", storageMode !== "memory", storageMode+" storage");

  return out.join("");
}

   only through its own menu unless the page asks. It hands us the offer in beforeinstallprompt; we
   keep it and show a button. Safari on iPhone never fires it, so there we say where the button is. */
let installPrompt = null;

function isInstalled(){

  catch(e){ return false; }
}
function canInstall(){ return !!installPrompt && !isInstalled(); }
function installHow(){
  const ua = navigator.userAgent || "";
  if(/iPhone|iPad|iPod/.test(ua)) return "In Safari, tap the Share button, then <b>Add to Home Screen</b>.";
  if(/Android/.test(ua)) return "Open your browser's menu, then <b>Install app</b> or <b>Add to Home screen</b>.";

/* Register the service worker when we're on a real origin. Opened straight from a
   downloads folder this throws, which is fine — the app still runs, it just can't
   install or cache. */
function registerSW(){
  if(!("serviceWorker" in navigator)) return;
  if(location.protocol !== "https:" && location.hostname !== "localhost") return;
  navigator.serviceWorker.register("sw.js").then(reg => {
    reg.addEventListener("updatefound", () => {
      const sw = reg.installing;
      if(!sw) return;
      sw.addEventListener("statechange", () => {
        /* a new version is ready and an old one is already running */
        if(sw.state === "installed" && navigator.serviceWorker.controller){
          modal("A new version is ready",
            '<div style="font-size:15px">Reload to pick it up. Your roster and the game in progress are not affected.</div>',
            "Reload now", ()=>{ sw.postMessage("skipWaiting"); location.reload(); }, "Later");
        }
      });
    });
  }).catch(()=>{});
}
